# DevAcademy yerel geliştirme ortamı
#
#   docker compose up -d                           # yalnızca altyapı: PostgreSQL + Redis (uygulamalar pnpm dev ile)
#   docker compose --profile media up -d           # + MinIO (yalnızca admin medya yükleme için gerekir)
#   docker compose --profile app up -d --build     # altyapı + API + web (tam yığın)
#   docker compose run --rm seed                   # content/ klasörünü veritabanına yükle
#
# Varsayılan kimlik bilgileri yalnızca yerel geliştirme içindir: altyapı portları yalnızca 127.0.0.1'e
# açılır. Gizli değerler ortamdan ezilebilir (ör. JWT_ACCESS_SECRET=... docker compose --profile app up).
#
# Kalıcı servisler (postgres, redis, minio, api, web) `restart: unless-stopped` ile sunucu ya da Docker yeniden
# başlayınca kendiliğinden ayağa kalkar; elle `docker compose stop` edilenler durdurulmuş kalır. Tek seferlik
# servisler (migrate, seed, minio-init) yeniden başlatılmaz. Kalıcı servislerin logları json-file sürücüsüyle
# servis başına 3 x 20 MB ile sınırlıdır (x-logging). Veritabanı yedeği: scripts/backup-db.sh (README → Bakım).

name: devacademy

# Kalıcı servisler için ortak log sınırı (disk dolmasını önler)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: devacademy
      POSTGRES_PASSWORD: devacademy
      POSTGRES_DB: devacademy
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devacademy -d devacademy']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 uyumlu nesne depolama (admin medya yükleme). İsteğe bağlı: `--profile media`.
  # MinIO Docker Hub'da imaj yayınlamayı bıraktı (minio/minio, minio/mc çekilemiyor); imaj MINIO_IMAGE ile
  # değiştirilebilir. Erişilemezse uygulamanın geri kalanı etkilenmez, yalnızca medya yükleme kapalı kalır.
  minio:
    profiles: ['media']
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  # Bucket'ı oluşturur ve herkese açık okuma izni verir (tek seferlik). Sunucu imajı `mc`'yi içerir.
  minio-init:
    profiles: ['media']
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/devacademy-media &&
      mc anonymous set download local/devacademy-media
      "

  # Bekleyen migration'ları uygular (tek seferlik); API bunu bekler
  migrate:
    profiles: ['app', 'seed']
    # seed ile aynı imaj: `up --build` migrate'i derleyince seed de güncel içerikle çalışır
    image: devacademy-tools
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tools
    environment: &api-env
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      # PUBLIC_HOST: sunucuya dışarıdan (telefon, başka bilgisayar) erişilen adres; .env'de ayarlayın
      CORS_ORIGINS: http://${PUBLIC_HOST:-localhost}:3000,http://${PUBLIC_HOST:-localhost}:8081,http://localhost:3000,http://localhost:8081
      LOG_LEVEL: info
      DATABASE_URL: postgresql://devacademy:devacademy@postgres:5432/devacademy?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-access-secret-change-me-0123456789}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://${PUBLIC_HOST:-localhost}:9000/devacademy-media
      WEB_URL: http://${PUBLIC_HOST:-localhost}:3000
      S3_BUCKET: devacademy-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      CONTENT_DIR: ../content
      # Sentry isteğe bağlı: kök .env'de SENTRY_DSN verilirse 5xx hatalar raporlanır
      SENTRY_DSN: ${SENTRY_DSN:-}
      SEED_ADMIN_EMAIL: admin@devacademy.local
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['app']
    restart: unless-stopped
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *api-env
    ports:
      - '4000:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # İçerik yükleyici: docker compose run --rm --build seed (içerik değiştikçe tekrar)
  # `--profile app up` ile her açılışta otomatik çalışmaz
  seed:
    profiles: ['seed']
    image: devacademy-tools
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tools
    environment: *api-env
    command: ['sh', '-c', 'pnpm exec tsx prisma/seed.ts']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    profiles: ['app']
    restart: unless-stopped
    logging: *default-logging
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${PUBLIC_HOST:-localhost}:4000/api/v1
    environment:
      API_URL_INTERNAL: http://api:4000/api/v1
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
