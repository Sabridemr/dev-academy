<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">and ve or kısa devre karar şeması</title>
  <desc id="desc">İki karar şeması yan yana. Solda x and y: önce x değerlendirilir; x yanlış (falsy) ise y hiç hesaplanmaz ve sonuç x olur; x doğru (truthy) ise y hesaplanır ve sonuç y olur. Sağda x or y: önce x değerlendirilir; x doğru ise y hiç hesaplanmaz ve sonuç x olur; x yanlış ise y hesaplanır ve sonuç y olur. Altta yanlış sayılan değerler: False, None, 0, 0.0, boş metin, boş liste, boş sözlük, boş küme.</desc>
  <defs>
    <marker id="k03-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <g font-size="15" font-weight="600" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <text x="225" y="30">x and y</text>
    <text x="675" y="30">x or y</text>
  </g>

  <!-- Karar kutuları -->
  <g fill="var(--da-surface, #f8fafc)" stroke="var(--da-primary, #6366f1)" stroke-width="2">
    <polygon points="225,50 315,95 225,140 135,95"/>
    <polygon points="675,50 765,95 675,140 585,95"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <text x="225" y="92">x doğru mu?</text>
    <text x="225" y="110" font-size="11" fill="var(--da-muted, #64748b)">(truthy)</text>
    <text x="675" y="92">x doğru mu?</text>
    <text x="675" y="110" font-size="11" fill="var(--da-muted, #64748b)">(truthy)</text>
  </g>

  <g stroke="var(--da-muted, #64748b)" stroke-width="1.8" fill="none" marker-end="url(#k03-ok)">
    <path d="M 160 128 L 110 178"/>
    <path d="M 290 128 L 340 178"/>
    <path d="M 610 128 L 560 178"/>
    <path d="M 740 128 L 790 178"/>
  </g>
  <g font-size="12" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="115" y="150">hayır</text>
    <text x="335" y="150">evet</text>
    <text x="565" y="150">evet</text>
    <text x="785" y="150">hayır</text>
  </g>

  <!-- Sonuç kutuları -->
  <g stroke-width="1.8">
    <rect x="30" y="180" width="160" height="62" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-success, #10b981)"/>
    <rect x="260" y="180" width="160" height="62" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-accent, #f59e0b)"/>
    <rect x="480" y="180" width="160" height="62" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-success, #10b981)"/>
    <rect x="710" y="180" width="160" height="62" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-accent, #f59e0b)"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <text x="110" y="205" font-weight="600">sonuç: x</text>
    <text x="110" y="227" font-size="12" fill="var(--da-success, #10b981)">y hiç hesaplanmaz</text>
    <text x="340" y="205" font-weight="600">sonuç: y</text>
    <text x="340" y="227" font-size="12" fill="var(--da-muted, #64748b)">y hesaplanır</text>
    <text x="560" y="205" font-weight="600">sonuç: x</text>
    <text x="560" y="227" font-size="12" fill="var(--da-success, #10b981)">y hiç hesaplanmaz</text>
    <text x="790" y="205" font-weight="600">sonuç: y</text>
    <text x="790" y="227" font-size="12" fill="var(--da-muted, #64748b)">y hesaplanır</text>
  </g>

  <!-- Falsy değerler -->
  <rect x="30" y="270" width="840" height="50" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="6 6"/>
  <text x="450" y="300" text-anchor="middle" font-size="13" fill="var(--da-fg, #0f172a)">Yanlış (falsy) sayılanlar: False · None · 0 · 0.0 · "" · [] · {} · set()   —   gerisi doğru (truthy)</text>
</svg>
