<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">List comprehension ile eşdeğer for döngüsü</title>
  <desc id="desc">Üstte bir list comprehension: ifade, for kısmı ve if filtresi renklerle ayrılmış. Altta aynı işi yapan for döngüsü: boş liste, for satırı, if satırı ve append satırı. Renkli oklar her parçanın döngüdeki karşılığını gösterir; ifade comprehension'da başta yazılır ama en son çalışır.</desc>
  <defs>
    <marker id="k09-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <text x="40" y="36" font-size="14" font-weight="600" fill="var(--da-muted, #64748b)">COMPREHENSION</text>
  <rect x="40" y="48" width="820" height="70" rx="14" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
  <g font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="64" y="92" fill="var(--da-fg, #0f172a)">kareler = [</text>
    <rect x="196" y="66" width="74" height="36" rx="6" fill="var(--da-accent, #f59e0b)" fill-opacity="0.18"/>
    <text x="202" y="92" fill="var(--da-fg, #0f172a)" font-weight="700">x * x</text>
    <rect x="282" y="66" width="230" height="36" rx="6" fill="var(--da-primary, #6366f1)" fill-opacity="0.15"/>
    <text x="290" y="92" fill="var(--da-fg, #0f172a)">for x in sayilar</text>
    <rect x="524" y="66" width="180" height="36" rx="6" fill="var(--da-success, #10b981)" fill-opacity="0.18"/>
    <text x="532" y="92" fill="var(--da-fg, #0f172a)">if x % 2 == 0</text>
    <text x="712" y="92" fill="var(--da-fg, #0f172a)">]</text>
  </g>
  <g font-size="12" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="233" y="136">3. ifade (sonuç)</text>
    <text x="397" y="136">1. kaynak</text>
    <text x="614" y="136">2. filtre</text>
  </g>

  <text x="40" y="186" font-size="14" font-weight="600" fill="var(--da-muted, #64748b)">EŞDEĞER DÖNGÜ</text>
  <rect x="40" y="198" width="820" height="150" rx="14" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
  <g font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--da-fg, #0f172a)">
    <text x="64" y="228">kareler = []</text>
    <rect x="60" y="238" width="230" height="30" rx="6" fill="var(--da-primary, #6366f1)" fill-opacity="0.15"/>
    <text x="64" y="259">for x in sayilar:</text>
    <rect x="96" y="272" width="190" height="30" rx="6" fill="var(--da-success, #10b981)" fill-opacity="0.18"/>
    <text x="100" y="293">if x % 2 == 0:</text>
    <text x="136" y="327">kareler.append(</text>
    <rect x="300" y="306" width="64" height="30" rx="6" fill="var(--da-accent, #f59e0b)" fill-opacity="0.18"/>
    <text x="304" y="327" font-weight="700">x * x</text>
    <text x="366" y="327">)</text>
  </g>

  <g stroke="var(--da-muted, #64748b)" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#k09-ok)">
    <path d="M 397 142 C 397 200, 300 220, 290 250"/>
    <path d="M 614 142 C 614 230, 330 250, 288 285"/>
    <path d="M 233 142 C 520 190, 560 300, 366 318"/>
  </g>

  <text x="40" y="380" font-size="13" fill="var(--da-fg, #0f172a)">Okuma sırası soldan sağa, çalışma sırası ise: kaynaktan al, filtrele, en son ifadeyi hesapla.</text>
</svg>
