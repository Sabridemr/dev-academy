<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Bir fonksiyonun anatomisi</title>
  <desc id="desc">Solda def ile tanımlanan fonksiyon: ad, parametreler, gövde ve return. Sağda çağrı satırı: argümanlar parametrelere bağlanır, return değeri çağrının yerine geçer.</desc>
  <defs>
    <marker id="k06-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="k06-ok-donus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
  </defs>

  <!-- Tanım -->
  <text x="40" y="40" font-size="14" font-weight="600" fill="var(--da-muted, #64748b)">TANIM (bir kez çalışır, fonksiyon nesnesi oluşturur)</text>
  <rect x="40" y="56" width="430" height="230" rx="14" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
  <g font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="64" y="100" fill="var(--da-primary, #6366f1)">def</text>
    <text x="104" y="100" fill="var(--da-fg, #0f172a)" font-weight="700">kdv_ekle</text>
    <text x="190" y="100" fill="var(--da-fg, #0f172a)">(</text>
    <text x="200" y="100" fill="var(--da-accent, #f59e0b)" font-weight="700">tutar, oran=0.2</text>
    <text x="345" y="100" fill="var(--da-fg, #0f172a)">):</text>
    <text x="96" y="150" fill="var(--da-fg, #0f172a)">sonuc = tutar * (1 + oran)</text>
    <text x="96" y="200" fill="var(--da-success, #10b981)" font-weight="700">return</text>
    <text x="164" y="200" fill="var(--da-fg, #0f172a)">sonuc</text>
  </g>
  <rect x="84" y="128" width="300" height="32" rx="6" fill="none" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="5 4"/>
  <g font-size="12" fill="var(--da-muted, #64748b)">
    <text x="104" y="76">ad</text>
    <text x="200" y="76">parametreler (yerel isimler)</text>
    <text x="392" y="149">gövde</text>
    <text x="96" y="226">dönüş değeri; return yoksa None</text>
    <text x="64" y="262">Gövde girintiyle belirlenir; çağrılana kadar çalışmaz.</text>
  </g>

  <!-- Çağrı -->
  <text x="530" y="40" font-size="14" font-weight="600" fill="var(--da-muted, #64748b)">ÇAĞRI (her seferinde yeni çerçeve)</text>
  <rect x="530" y="56" width="330" height="90" rx="14" fill="var(--da-primary, #6366f1)" fill-opacity="0.1" stroke="var(--da-primary, #6366f1)" stroke-width="1.5"/>
  <g font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--da-fg, #0f172a)">
    <text x="552" y="108">fiyat = <tspan font-weight="700">kdv_ekle(</tspan><tspan fill="var(--da-accent, #f59e0b)" font-weight="700">30</tspan><tspan font-weight="700">)</tspan></text>
  </g>
  <text x="552" y="132" font-size="12" fill="var(--da-muted, #64748b)">30 bir argüman; oran varsayılanı kullanır</text>

  <rect x="530" y="196" width="330" height="90" rx="14" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
  <text x="552" y="226" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">kdv_ekle çerçevesi</text>
  <g font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="var(--da-fg, #0f172a)">
    <text x="552" y="252">tutar → 30   oran → 0.2</text>
    <text x="552" y="274">sonuc → 36.0</text>
  </g>

  <path d="M 630 146 L 630 194" stroke="var(--da-primary, #6366f1)" stroke-width="2" fill="none" marker-end="url(#k06-ok)"/>
  <text x="640" y="176" font-size="12" fill="var(--da-primary, #6366f1)">1. argüman → parametre</text>
  <path d="M 780 196 L 780 148" stroke="var(--da-success, #10b981)" stroke-width="2" fill="none" marker-end="url(#k06-ok-donus)"/>
  <text x="790" y="176" font-size="12" fill="var(--da-success, #10b981)">2. 36.0 döner</text>

  <path d="M 470 170 C 500 170, 500 240, 528 240" stroke="var(--da-muted, #64748b)" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#k06-ok)"/>
  <text x="490" y="226" font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">kod</text>
  <text x="40" y="330" font-size="13" fill="var(--da-fg, #0f172a)">Çağrı bitince çerçeve silinir: tutar, oran ve sonuc dışarıda yoktur.</text>
  <text x="40" y="356" font-size="13" fill="var(--da-fg, #0f172a)">Çağıran yalnızca dönen değeri görür; fiyat ismi 36.0'a bağlanır.</text>
</svg>
