<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Python'da üç eşzamanlılık modeli</title>
  <desc id="desc">Üç sütun: threading'de tek süreç içinde birden çok thread tek GIL'i paylaşır ve I/O beklemesinde sırayla çalışır. multiprocessing'de her süreç kendi yorumlayıcısı ve GIL'iyle ayrı çekirdekte gerçekten paralel çalışır. asyncio'da tek thread'deki olay döngüsü çok sayıda görevi await noktalarında sırayla ilerletir.</desc>

  <!-- threading -->
  <rect x="20" y="20" width="270" height="290" rx="14" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
  <text x="155" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="var(--da-fg, #0f172a)">threading</text>
  <rect x="44" y="64" width="222" height="190" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-muted, #64748b)" stroke-dasharray="5 4"/>
  <text x="56" y="84" font-size="12" fill="var(--da-muted, #64748b)">1 süreç, ortak bellek</text>
  <rect x="96" y="96" width="118" height="30" rx="8" fill="var(--da-accent, #f59e0b)" fill-opacity="0.18" stroke="var(--da-accent, #f59e0b)"/>
  <text x="155" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">tek GIL</text>
  <g fill="var(--da-primary, #6366f1)" fill-opacity="0.15" stroke="var(--da-primary, #6366f1)">
    <rect x="60" y="144" width="190" height="26" rx="6"/>
    <rect x="60" y="178" width="190" height="26" rx="6"/>
    <rect x="60" y="212" width="190" height="26" rx="6"/>
  </g>
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="72" y="162">Thread 1</text>
    <text x="72" y="196">Thread 2</text>
    <text x="72" y="230">Thread 3</text>
  </g>
  <text x="155" y="280" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">Sıra işletim sisteminde</text>
  <text x="155" y="298" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Uygun iş: I/O-bound, senkron kütüphane</text>

  <!-- multiprocessing -->
  <rect x="315" y="20" width="270" height="290" rx="14" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
  <text x="450" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="var(--da-fg, #0f172a)">multiprocessing</text>
  <g fill="var(--da-surface, #f8fafc)" stroke="var(--da-muted, #64748b)" stroke-dasharray="5 4">
    <rect x="335" y="64" width="230" height="56" rx="10"/>
    <rect x="335" y="128" width="230" height="56" rx="10"/>
    <rect x="335" y="192" width="230" height="56" rx="10"/>
  </g>
  <g fill="var(--da-accent, #f59e0b)" fill-opacity="0.18" stroke="var(--da-accent, #f59e0b)">
    <rect x="470" y="78" width="80" height="28" rx="6"/>
    <rect x="470" y="142" width="80" height="28" rx="6"/>
    <rect x="470" y="206" width="80" height="28" rx="6"/>
  </g>
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="349" y="90">Süreç 1</text><text x="349" y="106" fill="var(--da-muted, #64748b)">çekirdek 1</text>
    <text x="349" y="154">Süreç 2</text><text x="349" y="170" fill="var(--da-muted, #64748b)">çekirdek 2</text>
    <text x="349" y="218">Süreç 3</text><text x="349" y="234" fill="var(--da-muted, #64748b)">çekirdek 3</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <text x="510" y="97">kendi GIL</text>
    <text x="510" y="161">kendi GIL</text>
    <text x="510" y="225">kendi GIL</text>
  </g>
  <text x="450" y="280" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">Gerçek paralellik, ayrı bellek</text>
  <text x="450" y="298" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Uygun iş: CPU-bound hesaplama</text>

  <!-- asyncio -->
  <rect x="610" y="20" width="270" height="290" rx="14" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
  <text x="745" y="48" text-anchor="middle" font-size="16" font-weight="600" fill="var(--da-fg, #0f172a)">asyncio</text>
  <rect x="634" y="64" width="222" height="190" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-muted, #64748b)" stroke-dasharray="5 4"/>
  <text x="646" y="84" font-size="12" fill="var(--da-muted, #64748b)">1 süreç, 1 thread</text>
  <circle cx="745" cy="165" r="48" fill="var(--da-primary, #6366f1)" fill-opacity="0.12" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
  <text x="745" y="161" text-anchor="middle" font-size="13" font-weight="600" fill="var(--da-primary, #6366f1)">olay</text>
  <text x="745" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="var(--da-primary, #6366f1)">döngüsü</text>
  <g fill="var(--da-success, #10b981)" fill-opacity="0.2" stroke="var(--da-success, #10b981)">
    <rect x="650" y="100" width="44" height="22" rx="5"/>
    <rect x="796" y="100" width="44" height="22" rx="5"/>
    <rect x="650" y="210" width="44" height="22" rx="5"/>
    <rect x="796" y="210" width="44" height="22" rx="5"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <text x="672" y="115">görev</text><text x="818" y="115">görev</text>
    <text x="672" y="225">görev</text><text x="818" y="225">görev</text>
  </g>
  <text x="745" y="280" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">Sıra await noktalarında</text>
  <text x="745" y="298" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Uygun iş: binlerce bağlantı</text>

  <text x="450" y="350" text-anchor="middle" font-size="13" fill="var(--da-fg, #0f172a)">Soru her zaman aynı: işin zamanı nerede geçiyor, beklemede mi hesapta mı?</text>
  <text x="450" y="372" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Beklemede ise eşzamanlılık (thread, asyncio), hesapta ise paralellik (süreç) kazandırır.</text>
</svg>
