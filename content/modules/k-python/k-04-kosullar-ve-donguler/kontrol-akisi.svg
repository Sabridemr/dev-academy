<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Kontrol akışının iki temel biçimi: koşul ve döngü</title>
  <desc id="desc">Solda if, elif, else akışı: koşullar yukarıdan aşağı sırayla denenir, ilk doğru koşulun bloğu çalışır ve diğerleri atlanır; hiçbiri doğru değilse else bloğu çalışır; her yol aynı noktada birleşir. Sağda while döngüsü: koşul doğru olduğu sürece gövde çalışır ve akış tekrar koşula döner; koşul yanlış olunca döngüden çıkılır. Gövdedeki continue koşula geri döner, break ise doğrudan döngünün dışına çıkar.</desc>
  <defs>
    <marker id="k04-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <text x="220" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">Koşul: if / elif / else</text>
  <text x="660" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">Döngü: while</text>
  <line x1="450" y1="40" x2="450" y2="380" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="6 6"/>

  <!-- if/elif/else -->
  <g fill="var(--da-surface, #f8fafc)" stroke="var(--da-primary, #6366f1)" stroke-width="2">
    <polygon points="110,50 180,85 110,120 40,85"/>
    <polygon points="110,150 180,185 110,220 40,185"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <text x="110" y="90">koşul 1?</text>
    <text x="110" y="190">koşul 2?</text>
  </g>
  <g fill="var(--da-surface, #f8fafc)" stroke="var(--da-success, #10b981)" stroke-width="1.8">
    <rect x="250" y="62" width="150" height="46" rx="10"/>
    <rect x="250" y="162" width="150" height="46" rx="10"/>
    <rect x="35" y="250" width="150" height="46" rx="10"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <text x="325" y="90">if bloğu</text>
    <text x="325" y="190">elif bloğu</text>
    <text x="110" y="278">else bloğu</text>
  </g>
  <rect x="160" y="330" width="130" height="40" rx="20" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
  <text x="225" y="355" text-anchor="middle" font-size="13" fill="var(--da-fg, #0f172a)">sonraki satır</text>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.7" fill="none" marker-end="url(#k04-ok)">
    <path d="M 180 85 L 246 85"/>
    <path d="M 110 120 L 110 146"/>
    <path d="M 180 185 L 246 185"/>
    <path d="M 110 220 L 110 246"/>
    <path d="M 400 85 C 430 85, 430 340, 294 348"/>
    <path d="M 400 185 C 420 185, 420 340, 294 350"/>
    <path d="M 110 296 C 110 340, 130 350, 156 350"/>
  </g>
  <g font-size="11" fill="var(--da-muted, #64748b)">
    <text x="195" y="78">evet</text>
    <text x="118" y="138">hayır</text>
    <text x="195" y="178">evet</text>
    <text x="118" y="238">hayır</text>
  </g>
  <text x="225" y="392" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">ilk doğru koşulun bloğu çalışır, gerisi atlanır</text>

  <!-- while -->
  <polygon points="620,70 700,110 620,150 540,110" fill="var(--da-surface, #f8fafc)" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
  <text x="620" y="115" text-anchor="middle" font-size="13" fill="var(--da-fg, #0f172a)">koşul?</text>
  <rect x="545" y="190" width="150" height="70" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-success, #10b981)" stroke-width="1.8"/>
  <text x="620" y="218" text-anchor="middle" font-size="13" fill="var(--da-fg, #0f172a)">gövde</text>
  <text x="620" y="240" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">continue · break</text>
  <rect x="760" y="90" width="120" height="40" rx="20" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
  <text x="820" y="115" text-anchor="middle" font-size="13" fill="var(--da-fg, #0f172a)">döngü sonrası</text>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.7" fill="none" marker-end="url(#k04-ok)">
    <path d="M 620 150 L 620 186"/>
    <path d="M 700 110 L 756 110"/>
    <path d="M 545 225 C 480 225, 480 110, 536 110"/>
  </g>
  <path d="M 695 235 C 820 235, 830 180, 822 134" stroke="var(--da-danger, #ef4444)" stroke-width="1.7" fill="none" stroke-dasharray="5 4" marker-end="url(#k04-ok)"/>
  <g font-size="11" fill="var(--da-muted, #64748b)">
    <text x="628" y="172">doğru</text>
    <text x="712" y="102">yanlış</text>
    <text x="468" y="175">tur sonu / continue</text>
  </g>
  <text x="790" y="225" font-size="11" fill="var(--da-danger, #ef4444)">break</text>
  <text x="660" y="320" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">for da aynı kalıbı izler: "koşul?" yerine</text>
  <text x="660" y="340" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">"sıradaki eleman var mı?" sorusu sorulur</text>
</svg>
