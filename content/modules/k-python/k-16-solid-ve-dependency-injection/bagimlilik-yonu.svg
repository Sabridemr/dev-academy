<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Bağımlılığın tersine çevrilmesi</title>
  <desc id="desc">Solda klasik tasarım: SiparisServisi doğrudan PostgresDepo'ya bağımlı. Sağda tersine çevrilmiş tasarım: SiparisServisi ve SiparisDeposu protokolü iş katmanında; PostgresDepo ve SahteDepo protokole uyar, oklar iş katmanına doğru döner.</desc>
  <defs>
    <marker id="k16-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-fg, #0f172a)"/>
    </marker>
    <marker id="k16-ok-uyar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Sol: klasik -->
  <text x="170" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">Klasik: üst katman ayrıntıya bağlı</text>
  <rect x="70" y="80" width="200" height="60" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="170" y="115" text-anchor="middle" font-size="14" fill="var(--da-fg, #0f172a)">SiparisServisi</text>
  <path d="M 170 140 L 170 248" stroke="var(--da-danger, #ef4444)" stroke-width="2" fill="none" marker-end="url(#k16-ok)"/>
  <text x="182" y="198" font-size="12" fill="var(--da-danger, #ef4444)">PostgresDepo(...) oluşturur</text>
  <rect x="70" y="250" width="200" height="60" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="170" y="285" text-anchor="middle" font-size="14" fill="var(--da-fg, #0f172a)">PostgresDepo</text>
  <text x="170" y="350" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Test için gerçek veritabanı gerekir;</text>
  <text x="170" y="368" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">depoyu değiştirmek servisi değiştirmektir.</text>

  <line x1="350" y1="30" x2="350" y2="380" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="5 6"/>

  <!-- Sağ: DIP -->
  <text x="630" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">DIP: ikisi de soyutlamaya bağlı</text>
  <rect x="390" y="56" width="480" height="120" rx="14" fill="var(--da-primary, #6366f1)" fill-opacity="0.07" stroke="var(--da-primary, #6366f1)" stroke-dasharray="6 5"/>
  <text x="404" y="76" font-size="12" fill="var(--da-primary, #6366f1)">İş katmanı (sözleşmenin sahibi)</text>
  <rect x="410" y="96" width="180" height="60" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="500" y="122" text-anchor="middle" font-size="14" fill="var(--da-fg, #0f172a)">SiparisServisi</text>
  <text x="500" y="141" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">__init__(self, depo)</text>
  <rect x="660" y="96" width="190" height="60" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
  <text x="755" y="119" text-anchor="middle" font-size="11" fill="var(--da-primary, #6366f1)">«Protocol»</text>
  <text x="755" y="140" text-anchor="middle" font-size="14" fill="var(--da-fg, #0f172a)">SiparisDeposu</text>
  <path d="M 590 126 L 656 126" stroke="var(--da-fg, #0f172a)" stroke-width="1.8" fill="none" marker-end="url(#k16-ok)"/>
  <text x="623" y="117" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">kullanır</text>

  <rect x="560" y="260" width="150" height="56" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="635" y="293" text-anchor="middle" font-size="14" fill="var(--da-fg, #0f172a)">PostgresDepo</text>
  <rect x="730" y="260" width="140" height="56" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-success, #10b981)" stroke-width="1.5"/>
  <text x="800" y="293" text-anchor="middle" font-size="14" fill="var(--da-fg, #0f172a)">SahteDepo</text>
  <g stroke="var(--da-primary, #6366f1)" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#k16-ok-uyar)">
    <path d="M 635 260 L 735 160"/>
    <path d="M 800 260 L 770 160"/>
  </g>
  <text x="645" y="215" font-size="11" fill="var(--da-primary, #6366f1)">uyar</text>
  <text x="797" y="215" font-size="11" fill="var(--da-primary, #6366f1)">uyar</text>
  <text x="715" y="345" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Ayrıntılar iş katmanının koyduğu sözleşmeye uyar.</text>
  <text x="715" y="363" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Hangisinin verileceğine composition root karar verir.</text>
</svg>
