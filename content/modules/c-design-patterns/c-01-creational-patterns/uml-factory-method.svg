<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Factory Method UML sınıf diyagramı</title>
  <desc id="desc">Soyut NotificationCreator sınıfı notify şablon metodunu ve soyut createNotification fabrika metodunu tanımlar. EmailCreator ve SmsCreator alt sınıfları fabrika metodunu ezerek EmailNotification ve SmsNotification üretir; her ikisi de Notification arayüzünü uygular.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="60" y="40" width="230" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="175" y="58" text-anchor="middle" font-size="12" font-weight="700" font-style="italic" fill="var(--da-fg, #0f172a)">NotificationCreator</text>
  <line x1="60" y1="66" x2="290" y2="66" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="60" y1="89" x2="290" y2="89" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="66" y="105" font-size="10.5"  fill="var(--da-fg, #0f172a)">+notify(user, msg): void</text>
  <text x="66" y="120" font-size="10.5" font-style="italic" fill="var(--da-fg, #0f172a)">#createNotification(): Notification</text>
  <rect x="20" y="230" width="180" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="110" y="248" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">EmailCreator</text>
  <line x1="20" y1="256" x2="200" y2="256" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="26" y="272" font-size="10.5" fill="var(--da-fg, #0f172a)">-smtp: SmtpClient</text>
  <line x1="20" y1="279" x2="200" y2="279" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="26" y="295" font-size="10.5"  fill="var(--da-fg, #0f172a)">#createNotification()</text>
  <rect x="230" y="230" width="180" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="320" y="248" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">SmsCreator</text>
  <line x1="230" y1="256" x2="410" y2="256" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="236" y="272" font-size="10.5" fill="var(--da-fg, #0f172a)">-gateway: SmsGateway</text>
  <line x1="230" y1="279" x2="410" y2="279" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="236" y="295" font-size="10.5"  fill="var(--da-fg, #0f172a)">#createNotification()</text>
  <rect x="580" y="40" width="200" height="86" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.4"/>
  <text x="680" y="54" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">«interface»</text>
  <text x="680" y="70" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">Notification</text>
  <line x1="580" y1="80" x2="780" y2="80" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <line x1="580" y1="103" x2="780" y2="103" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <text x="586" y="119" font-size="10.5"  fill="var(--da-fg, #0f172a)">+send(user, msg): Promise&lt;void&gt;</text>
  <rect x="500" y="230" width="180" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="590" y="248" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">EmailNotification</text>
  <line x1="500" y1="256" x2="680" y2="256" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="506" y="272" font-size="10.5" fill="var(--da-fg, #0f172a)">-smtp</text>
  <line x1="500" y1="279" x2="680" y2="279" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="506" y="295" font-size="10.5"  fill="var(--da-fg, #0f172a)">+send()</text>
  <rect x="710" y="230" width="170" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="795" y="248" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">SmsNotification</text>
  <line x1="710" y1="256" x2="880" y2="256" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="716" y="272" font-size="10.5" fill="var(--da-fg, #0f172a)">-gateway</text>
  <line x1="710" y1="279" x2="880" y2="279" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="716" y="295" font-size="10.5"  fill="var(--da-fg, #0f172a)">+send()</text>
  <path d="M 110 230 L 175 127" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-tri)"/>
  <path d="M 320 230 L 175 127" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-tri)"/>
  <path d="M 590 230 L 680 126" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 795 230 L 680 126" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 290 83.5 L 580 83" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="435" y="78.25" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">kullanır</text>
  <path d="M 110 302 L 110 350 L 590 350 L 590 302" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="350" y="344" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">new</text>
  <path d="M 320 302 L 320 390 L 795 390 L 795 302" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="560" y="384" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">new</text>
  <path d="M 330 110 L 520 110 L 530 120 L 530 166 L 330 166 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="338" y="126" font-size="10.5" fill="var(--da-fg, #0f172a)">notify() şablondur:</text>
  <text x="338" y="140" font-size="10.5" fill="var(--da-fg, #0f172a)">const n = this.createNotification();</text>
  <text x="338" y="154" font-size="10.5" fill="var(--da-fg, #0f172a)">await n.send(user, msg);</text>
</svg>
