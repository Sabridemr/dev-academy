<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Singleton UML sınıf diyagramı</title>
  <desc id="desc">Singleton sınıfı özel statik instance alanı, özel kurucu ve statik getInstance metodu içerir; kendine instance ilişkisiyle bağlıdır. İki istemci sınıfı getInstance üzerinden aynı nesneyi kullanır.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="160" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="120" y="78" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">OrderService</text>
  <line x1="40" y1="86" x2="200" y2="86" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="40" y1="109" x2="200" y2="109" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="46" y="125" font-size="10.5"  fill="var(--da-fg, #0f172a)">+place(order)</text>
  <rect x="40" y="190" width="160" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="120" y="208" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">ReportJob</text>
  <line x1="40" y1="216" x2="200" y2="216" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="40" y1="239" x2="200" y2="239" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="46" y="255" font-size="10.5"  fill="var(--da-fg, #0f172a)">+run()</text>
  <rect x="330" y="60" width="230" height="117" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="445" y="78" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">ConfigService</text>
  <line x1="330" y1="86" x2="560" y2="86" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="336" y="102" font-size="10.5" fill="var(--da-fg, #0f172a)">-static instance: ConfigService</text>
  <text x="336" y="117" font-size="10.5" fill="var(--da-fg, #0f172a)">-values: Map&lt;string,string&gt;</text>
  <line x1="330" y1="124" x2="560" y2="124" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="336" y="140" font-size="10.5"  fill="var(--da-fg, #0f172a)">-constructor()</text>
  <text x="336" y="155" font-size="10.5"  fill="var(--da-fg, #0f172a)">+static getInstance(): ConfigService</text>
  <text x="336" y="170" font-size="10.5"  fill="var(--da-fg, #0f172a)">+get(key: string): string</text>
  <path d="M 200 96 L 330 118.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="265" y="102.25" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">getInstance()</text>
  <path d="M 200 226 L 290 220 L 290 150 L 330 118.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="290" y="180" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">getInstance()</text>
  <path d="M 560 118.5 L 640 150 L 640 250 L 445 250 L 445 177" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <text x="542.5" y="245" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">instance 0..1</text>
  <path d="M 600 60 L 730 60 L 740 70 L 740 116 L 600 116 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="608" y="76" font-size="10.5" fill="var(--da-fg, #0f172a)">kurucu private:</text>
  <text x="608" y="90" font-size="10.5" fill="var(--da-fg, #0f172a)">dışarıdan new yok</text>
  <text x="608" y="104" font-size="10.5" fill="var(--da-fg, #0f172a)">tek erişim noktası</text>
</svg>
