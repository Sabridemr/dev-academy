<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Builder UML sınıf diyagramı</title>
  <desc id="desc">HttpRequestBuilder sınıfı url, header, timeout ve body gibi zincirlenebilir metodlar ve build metodu içerir; build değişmez HttpRequest nesnesini üretir. RequestPresets (director) sık kullanılan kurulumları builder üzerinden hazırlar. İstemci builder ve presets kullanır.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="30" y="100" width="140" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="100" y="118" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">ApiClient</text>
  <line x1="30" y1="126" x2="170" y2="126" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="30" y1="149" x2="170" y2="149" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="165" font-size="10.5"  fill="var(--da-fg, #0f172a)">+fetchOrders()</text>
  <rect x="30" y="230" width="200" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="130" y="248" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">RequestPresets</text>
  <line x1="30" y1="256" x2="230" y2="256" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="30" y1="279" x2="230" y2="279" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="295" font-size="10.5"  fill="var(--da-fg, #0f172a)">+jsonGet(url): HttpRequestBuilder</text>
  <text x="36" y="310" font-size="10.5"  fill="var(--da-fg, #0f172a)">+authed(token): HttpRequestBuilder</text>
  <rect x="300" y="40" width="240" height="177" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="420" y="58" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">HttpRequestBuilder</text>
  <line x1="300" y1="66" x2="540" y2="66" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="82" font-size="10.5" fill="var(--da-fg, #0f172a)">-url?: string</text>
  <text x="306" y="97" font-size="10.5" fill="var(--da-fg, #0f172a)">-headers: Map</text>
  <text x="306" y="112" font-size="10.5" fill="var(--da-fg, #0f172a)">-timeoutMs = 30000</text>
  <text x="306" y="127" font-size="10.5" fill="var(--da-fg, #0f172a)">-body?: unknown</text>
  <line x1="300" y1="134" x2="540" y2="134" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="150" font-size="10.5"  fill="var(--da-fg, #0f172a)">+url(u): this</text>
  <text x="306" y="165" font-size="10.5"  fill="var(--da-fg, #0f172a)">+header(k, v): this</text>
  <text x="306" y="180" font-size="10.5"  fill="var(--da-fg, #0f172a)">+timeout(ms): this</text>
  <text x="306" y="195" font-size="10.5"  fill="var(--da-fg, #0f172a)">+body(b): this</text>
  <text x="306" y="210" font-size="10.5"  fill="var(--da-fg, #0f172a)">+build(): HttpRequest</text>
  <rect x="640" y="80" width="190" height="117" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="735" y="98" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">HttpRequest</text>
  <line x1="640" y1="106" x2="830" y2="106" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="646" y="122" font-size="10.5" fill="var(--da-fg, #0f172a)">+readonly url</text>
  <text x="646" y="137" font-size="10.5" fill="var(--da-fg, #0f172a)">+readonly headers</text>
  <text x="646" y="152" font-size="10.5" fill="var(--da-fg, #0f172a)">+readonly timeoutMs</text>
  <text x="646" y="167" font-size="10.5" fill="var(--da-fg, #0f172a)">+readonly body?</text>
  <line x1="640" y1="174" x2="830" y2="174" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <path d="M 170 136 L 230 125 L 300 128.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="265" y="121.75" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">zincirler</text>
  <path d="M 100 172 L 130 230" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <path d="M 230 273.5 L 270 265 L 270 200 L 300 128.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="270" y="227.5" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">kurar</text>
  <path d="M 540 128.5 L 640 138.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="590" y="128.5" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">build() → new</text>
  <path d="M 600 240 L 820 240 L 830 250 L 830 296 L 600 296 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="608" y="256" font-size="10.5" fill="var(--da-fg, #0f172a)">Ürün değişmez (immutable);</text>
  <text x="608" y="270" font-size="10.5" fill="var(--da-fg, #0f172a)">doğrulama build() içinde tek yerde:</text>
  <text x="608" y="284" font-size="10.5" fill="var(--da-fg, #0f172a)">url yoksa → hata.</text>
</svg>
