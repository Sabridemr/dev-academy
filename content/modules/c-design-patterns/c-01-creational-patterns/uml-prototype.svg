<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Prototype UML sınıf diyagramı</title>
  <desc id="desc">Prototype arayüzü clone metodunu tanımlar. DocumentTemplate sınıfı bu arayüzü uygular ve derin kopya üretir. PrototypeRegistry anahtar ile prototipleri saklar ve create çağrısında kayıtlı prototipin klonunu döner. İstemci registry üzerinden yeni belgeler alır.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="30" y="110" width="150" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="105" y="128" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">InvoiceService</text>
  <line x1="30" y1="136" x2="180" y2="136" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="30" y1="159" x2="180" y2="159" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="175" font-size="10.5"  fill="var(--da-fg, #0f172a)">+newInvoice()</text>
  <rect x="260" y="90" width="230" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="375" y="108" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">PrototypeRegistry</text>
  <line x1="260" y1="116" x2="490" y2="116" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="266" y="132" font-size="10.5" fill="var(--da-fg, #0f172a)">-items: Map&lt;string, Prototype&gt;</text>
  <line x1="260" y1="139" x2="490" y2="139" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="266" y="155" font-size="10.5"  fill="var(--da-fg, #0f172a)">+register(key, proto)</text>
  <text x="266" y="170" font-size="10.5"  fill="var(--da-fg, #0f172a)">+create(key): Prototype</text>
  <rect x="600" y="30" width="170" height="86" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.4"/>
  <text x="685" y="44" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">«interface»</text>
  <text x="685" y="60" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">Prototype&lt;T&gt;</text>
  <line x1="600" y1="70" x2="770" y2="70" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <line x1="600" y1="93" x2="770" y2="93" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <text x="606" y="109" font-size="10.5"  fill="var(--da-fg, #0f172a)">+clone(): T</text>
  <rect x="580" y="180" width="230" height="117" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="695" y="198" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">DocumentTemplate</text>
  <line x1="580" y1="206" x2="810" y2="206" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="586" y="222" font-size="10.5" fill="var(--da-fg, #0f172a)">-title: string</text>
  <text x="586" y="237" font-size="10.5" fill="var(--da-fg, #0f172a)">-styles: Style[]</text>
  <text x="586" y="252" font-size="10.5" fill="var(--da-fg, #0f172a)">-blocks: Block[]</text>
  <line x1="580" y1="259" x2="810" y2="259" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="586" y="275" font-size="10.5"  fill="var(--da-fg, #0f172a)">+clone(): DocumentTemplate</text>
  <text x="586" y="290" font-size="10.5"  fill="var(--da-fg, #0f172a)">+setTitle(t)</text>
  <path d="M 180 146 L 260 133.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="220" y="134.75" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">create("invoice")</text>
  <path d="M 490 133.5 L 540 150 L 540 72 L 600 73" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-start="url(#m-dia)" marker-end="url(#m-open)"/>
  <text x="540" y="106" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">0..*</text>
  <path d="M 695 180 L 685 116" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 490 133.5 L 540 160 L 540 240 L 580 238.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="540" y="195" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">clone()</text>
  <path d="M 30 230 L 240 230 L 250 240 L 250 286 L 30 286 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="38" y="246" font-size="10.5" fill="var(--da-fg, #0f172a)">Derin kopya: styles ve blocks</text>
  <text x="38" y="260" font-size="10.5" fill="var(--da-fg, #0f172a)">dizileri de kopyalanır; aksi</text>
  <text x="38" y="274" font-size="10.5" fill="var(--da-fg, #0f172a)">hâlde klonlar aynı diziyi paylaşır.</text>
</svg>
