<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Observer UML sınıf diyagramı</title>
  <desc id="desc">OrderEvents konu sınıfı gözlemci listesi tutar; subscribe, unsubscribe ve notify metodları vardır. OrderObserver arayüzü update metodunu tanımlar. EmailObserver ve AnalyticsObserver bu arayüzü uygular. Konu gözlemcilerin somut sınıflarını bilmez.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="240" height="102" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="160" y="78" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">OrderEvents</text>
  <line x1="40" y1="86" x2="280" y2="86" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="46" y="102" font-size="10.5" fill="var(--da-fg, #0f172a)">-observers: Set&lt;OrderObserver&gt;</text>
  <line x1="40" y1="109" x2="280" y2="109" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="46" y="125" font-size="10.5"  fill="var(--da-fg, #0f172a)">+subscribe(o: OrderObserver): () =&gt; void</text>
  <text x="46" y="140" font-size="10.5"  fill="var(--da-fg, #0f172a)">+unsubscribe(o)</text>
  <text x="46" y="155" font-size="10.5"  fill="var(--da-fg, #0f172a)">+notify(evt: OrderPaid)</text>
  <rect x="480" y="50" width="220" height="86" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.4"/>
  <text x="590" y="64" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">«interface»</text>
  <text x="590" y="80" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">OrderObserver</text>
  <line x1="480" y1="90" x2="700" y2="90" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <line x1="480" y1="113" x2="700" y2="113" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <text x="486" y="129" font-size="10.5"  fill="var(--da-fg, #0f172a)">+update(evt: OrderPaid): void</text>
  <rect x="400" y="230" width="180" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="490" y="248" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">EmailObserver</text>
  <line x1="400" y1="256" x2="580" y2="256" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="406" y="272" font-size="10.5" fill="var(--da-fg, #0f172a)">-mailer</text>
  <line x1="400" y1="279" x2="580" y2="279" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="406" y="295" font-size="10.5"  fill="var(--da-fg, #0f172a)">+update(evt)</text>
  <rect x="620" y="230" width="190" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="715" y="248" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">AnalyticsObserver</text>
  <line x1="620" y1="256" x2="810" y2="256" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="626" y="272" font-size="10.5" fill="var(--da-fg, #0f172a)">-tracker</text>
  <line x1="620" y1="279" x2="810" y2="279" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="626" y="295" font-size="10.5"  fill="var(--da-fg, #0f172a)">+update(evt)</text>
  <path d="M 280 111 L 480 93" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-start="url(#m-dia)" marker-end="url(#m-open)"/>
  <text x="380" y="97" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">observers 0..*</text>
  <path d="M 490 230 L 590 136" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 715 230 L 590 136" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 40 240 L 330 240 L 340 250 L 340 296 L 40 296 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="48" y="256" font-size="10.5" fill="var(--da-fg, #0f172a)">Konu, gözlemcilerin somut tipini bilmez.</text>
  <text x="48" y="270" font-size="10.5" fill="var(--da-fg, #0f172a)">subscribe() abonelik iptali için fonksiyon</text>
  <text x="48" y="284" font-size="10.5" fill="var(--da-fg, #0f172a)">döner: sızıntıya karşı mutlaka çağrılır.</text>
</svg>
