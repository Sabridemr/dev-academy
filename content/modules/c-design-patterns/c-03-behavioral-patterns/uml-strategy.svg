<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Strategy UML sınıf diyagramı</title>
  <desc id="desc">ShippingCalculator bağlamı bir PricingStrategy referansı tutar ve price çağrısını ona devreder. PricingStrategy arayüzünü FlatRate, ByWeight ve Express sınıfları uygular. Strateji çalışma zamanında değiştirilebilir.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="40" y="70" width="240" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="160" y="88" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">ShippingCalculator</text>
  <line x1="40" y1="96" x2="280" y2="96" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="46" y="112" font-size="10.5" fill="var(--da-fg, #0f172a)">-strategy: PricingStrategy</text>
  <line x1="40" y1="119" x2="280" y2="119" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="46" y="135" font-size="10.5"  fill="var(--da-fg, #0f172a)">+setStrategy(s)</text>
  <text x="46" y="150" font-size="10.5"  fill="var(--da-fg, #0f172a)">+price(parcel): Money</text>
  <rect x="480" y="50" width="220" height="86" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.4"/>
  <text x="590" y="64" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">«interface»</text>
  <text x="590" y="80" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">PricingStrategy</text>
  <line x1="480" y1="90" x2="700" y2="90" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <line x1="480" y1="113" x2="700" y2="113" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <text x="486" y="129" font-size="10.5"  fill="var(--da-fg, #0f172a)">+price(parcel: Parcel): Money</text>
  <rect x="360" y="230" width="140" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="430" y="248" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">FlatRate</text>
  <line x1="360" y1="256" x2="500" y2="256" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="366" y="272" font-size="10.5" fill="var(--da-fg, #0f172a)">-fee</text>
  <line x1="360" y1="279" x2="500" y2="279" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="366" y="295" font-size="10.5"  fill="var(--da-fg, #0f172a)">+price()</text>
  <rect x="520" y="230" width="140" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="590" y="248" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">ByWeight</text>
  <line x1="520" y1="256" x2="660" y2="256" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="526" y="272" font-size="10.5" fill="var(--da-fg, #0f172a)">-perKg</text>
  <line x1="520" y1="279" x2="660" y2="279" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="526" y="295" font-size="10.5"  fill="var(--da-fg, #0f172a)">+price()</text>
  <rect x="680" y="230" width="140" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="750" y="248" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">Express</text>
  <line x1="680" y1="256" x2="820" y2="256" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="686" y="272" font-size="10.5" fill="var(--da-fg, #0f172a)">-multiplier</text>
  <line x1="680" y1="279" x2="820" y2="279" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="686" y="295" font-size="10.5"  fill="var(--da-fg, #0f172a)">+price()</text>
  <path d="M 280 113.5 L 480 93" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-start="url(#m-dia)" marker-end="url(#m-open)"/>
  <text x="380" y="98.25" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">strategy 1</text>
  <path d="M 430 230 L 590 136" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 590 230 L 590 136" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 750 230 L 590 136" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 40 230 L 290 230 L 300 240 L 300 286 L 40 286 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="48" y="246" font-size="10.5" fill="var(--da-fg, #0f172a)">Bağlam algoritmayı seçmez, kullanır.</text>
  <text x="48" y="260" font-size="10.5" fill="var(--da-fg, #0f172a)">Seçim dışarıda (konfig, kullanıcı, kural).</text>
  <text x="48" y="274" font-size="10.5" fill="var(--da-fg, #0f172a)">TS/Python'da strateji çoğu zaman bir fonksiyondur.</text>
</svg>
