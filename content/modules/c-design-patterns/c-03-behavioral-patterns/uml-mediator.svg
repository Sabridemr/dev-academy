<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Mediator UML sınıf diyagramı</title>
  <desc id="desc">FormMediator arayüzü notify metodunu tanımlar; CheckoutFormMediator bunu uygular ve dört bileşene referans tutar: AddressField, ShippingSelector, PriceSummary ve SubmitButton. Bileşenler yalnızca mediator ile konuşur, birbirlerini bilmez.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="340" y="20" width="220" height="86" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.4"/>
  <text x="450" y="34" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">«interface»</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">FormMediator</text>
  <line x1="340" y1="60" x2="560" y2="60" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <line x1="340" y1="83" x2="560" y2="83" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <text x="346" y="99" font-size="10.5"  fill="var(--da-fg, #0f172a)">+notify(sender, event)</text>
  <rect x="300" y="150" width="300" height="102" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="450" y="168" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">CheckoutFormMediator</text>
  <line x1="300" y1="176" x2="600" y2="176" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="192" font-size="10.5" fill="var(--da-fg, #0f172a)">-address, shipping, price, submit</text>
  <line x1="300" y1="199" x2="600" y2="199" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="215" font-size="10.5"  fill="var(--da-fg, #0f172a)">+notify(sender, event)</text>
  <text x="306" y="230" font-size="10.5"  fill="var(--da-fg, #0f172a)">  address changed → shipping.reload()</text>
  <text x="306" y="245" font-size="10.5"  fill="var(--da-fg, #0f172a)">  shipping changed → price.recalc()</text>
  <rect x="40" y="300" width="160" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="120" y="318" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">AddressField</text>
  <line x1="40" y1="326" x2="200" y2="326" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="46" y="342" font-size="10.5" fill="var(--da-fg, #0f172a)">-mediator</text>
  <line x1="40" y1="349" x2="200" y2="349" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="46" y="365" font-size="10.5"  fill="var(--da-fg, #0f172a)">+onChange()</text>
  <rect x="240" y="300" width="170" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="325" y="318" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">ShippingSelector</text>
  <line x1="240" y1="326" x2="410" y2="326" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="246" y="342" font-size="10.5" fill="var(--da-fg, #0f172a)">-mediator</text>
  <line x1="240" y1="349" x2="410" y2="349" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="246" y="365" font-size="10.5"  fill="var(--da-fg, #0f172a)">+reload(opts)</text>
  <rect x="450" y="300" width="160" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="530" y="318" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">PriceSummary</text>
  <line x1="450" y1="326" x2="610" y2="326" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="456" y="342" font-size="10.5" fill="var(--da-fg, #0f172a)">-mediator</text>
  <line x1="450" y1="349" x2="610" y2="349" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="456" y="365" font-size="10.5"  fill="var(--da-fg, #0f172a)">+recalc()</text>
  <rect x="650" y="300" width="160" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="730" y="318" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">SubmitButton</text>
  <line x1="650" y1="326" x2="810" y2="326" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="656" y="342" font-size="10.5" fill="var(--da-fg, #0f172a)">-mediator</text>
  <line x1="650" y1="349" x2="810" y2="349" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="656" y="365" font-size="10.5"  fill="var(--da-fg, #0f172a)">+setEnabled(b)</text>
  <path d="M 450 150 L 450 106" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 120 300 L 120 70 L 340 63" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <text x="230" y="61.5" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">mediator</text>
  <path d="M 450 252 L 325 300" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <path d="M 450 252 L 530 300" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <path d="M 600 201 L 730 230 L 730 300" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <path d="M 640 30 L 870 30 L 880 40 L 880 100 L 640 100 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="648" y="46" font-size="10.5" fill="var(--da-fg, #0f172a)">N bileşen arası N² bağlantı yerine</text>
  <text x="648" y="60" font-size="10.5" fill="var(--da-fg, #0f172a)">N bağlantı. Koordinasyon mantığı</text>
  <text x="648" y="74" font-size="10.5" fill="var(--da-fg, #0f172a)">tek yerde: mediator "akıllı" olabilir,</text>
  <text x="648" y="88" font-size="10.5" fill="var(--da-fg, #0f172a)">bileşenler "aptal" kalır.</text>
</svg>
