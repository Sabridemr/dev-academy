<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Command UML sınıf diyagramı</title>
  <desc id="desc">Command arayüzü execute ve undo tanımlar. AddItemCommand ve RemoveItemCommand alıcı olan Cart nesnesine referans tutar. CommandHistory çağırıcı olarak komutları çalıştırır ve geri alma için yığında saklar. İstemci komutu oluşturup çağırıcıya verir.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="220" height="117" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="150" y="78" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">CommandHistory</text>
  <line x1="40" y1="86" x2="260" y2="86" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="46" y="102" font-size="10.5" fill="var(--da-fg, #0f172a)">-done: Command[]</text>
  <text x="46" y="117" font-size="10.5" fill="var(--da-fg, #0f172a)">-undone: Command[]</text>
  <line x1="40" y1="124" x2="260" y2="124" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="46" y="140" font-size="10.5"  fill="var(--da-fg, #0f172a)">+run(cmd: Command)</text>
  <text x="46" y="155" font-size="10.5"  fill="var(--da-fg, #0f172a)">+undo()</text>
  <text x="46" y="170" font-size="10.5"  fill="var(--da-fg, #0f172a)">+redo()</text>
  <rect x="380" y="40" width="180" height="101" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.4"/>
  <text x="470" y="54" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">«interface»</text>
  <text x="470" y="70" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">Command</text>
  <line x1="380" y1="80" x2="560" y2="80" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <line x1="380" y1="103" x2="560" y2="103" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <text x="386" y="119" font-size="10.5"  fill="var(--da-fg, #0f172a)">+execute(): void</text>
  <text x="386" y="134" font-size="10.5"  fill="var(--da-fg, #0f172a)">+undo(): void</text>
  <rect x="300" y="220" width="190" height="102" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="395" y="238" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">AddItemCommand</text>
  <line x1="300" y1="246" x2="490" y2="246" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="262" font-size="10.5" fill="var(--da-fg, #0f172a)">-cart: Cart</text>
  <text x="306" y="277" font-size="10.5" fill="var(--da-fg, #0f172a)">-sku, qty</text>
  <line x1="300" y1="284" x2="490" y2="284" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="300" font-size="10.5"  fill="var(--da-fg, #0f172a)">+execute() { cart.add }</text>
  <text x="306" y="315" font-size="10.5"  fill="var(--da-fg, #0f172a)">+undo() { cart.remove }</text>
  <rect x="520" y="220" width="200" height="102" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="620" y="238" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">RemoveItemCommand</text>
  <line x1="520" y1="246" x2="720" y2="246" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="526" y="262" font-size="10.5" fill="var(--da-fg, #0f172a)">-cart: Cart</text>
  <text x="526" y="277" font-size="10.5" fill="var(--da-fg, #0f172a)">-sku, prevQty</text>
  <line x1="520" y1="284" x2="720" y2="284" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="526" y="300" font-size="10.5"  fill="var(--da-fg, #0f172a)">+execute() { cart.remove }</text>
  <text x="526" y="315" font-size="10.5"  fill="var(--da-fg, #0f172a)">+undo() { cart.add(prevQty) }</text>
  <rect x="720" y="50" width="150" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="795" y="68" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">Cart</text>
  <line x1="720" y1="76" x2="870" y2="76" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="726" y="92" font-size="10.5" fill="var(--da-fg, #0f172a)">-lines: Map</text>
  <line x1="720" y1="99" x2="870" y2="99" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="726" y="115" font-size="10.5"  fill="var(--da-fg, #0f172a)">+add(sku, qty)</text>
  <text x="726" y="130" font-size="10.5"  fill="var(--da-fg, #0f172a)">+remove(sku)</text>
  <path d="M 260 118.5 L 380 90.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-start="url(#m-dia)" marker-end="url(#m-open)"/>
  <text x="320" y="99.5" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">done 0..*</text>
  <path d="M 395 220 L 470 141" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 620 220 L 470 141" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 490 271 L 795 280 L 795 137" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <text x="795" y="203.5" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">receiver</text>
  <path d="M 40 250 L 250 250 L 260 260 L 260 306 L 40 306 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="48" y="266" font-size="10.5" fill="var(--da-fg, #0f172a)">Komut = isteğin nesneleşmiş hâli.</text>
  <text x="48" y="280" font-size="10.5" fill="var(--da-fg, #0f172a)">Kuyruğa atılabilir, loglanabilir,</text>
  <text x="48" y="294" font-size="10.5" fill="var(--da-fg, #0f172a)">geri alınabilir, birleştirilebilir.</text>
</svg>
