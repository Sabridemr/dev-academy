<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Facade UML sınıf diyagramı</title>
  <desc id="desc">CheckoutFacade sınıfı placeOrder metoduyla basit bir arayüz sunar ve içinde InventoryService, PaymentGateway, ShippingService ve NotificationService alt sistemlerini tutar. İstemci yalnızca facade ile konuşur; alt sistemler istemciye görünmez.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="30" y="150" width="160" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="110" y="168" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">OrderController</text>
  <line x1="30" y1="176" x2="190" y2="176" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="30" y1="199" x2="190" y2="199" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="215" font-size="10.5"  fill="var(--da-fg, #0f172a)">+post(req)</text>
  <rect x="280" y="120" width="220" height="117" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="390" y="138" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">CheckoutFacade</text>
  <line x1="280" y1="146" x2="500" y2="146" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="286" y="162" font-size="10.5" fill="var(--da-fg, #0f172a)">-inventory</text>
  <text x="286" y="177" font-size="10.5" fill="var(--da-fg, #0f172a)">-payments</text>
  <text x="286" y="192" font-size="10.5" fill="var(--da-fg, #0f172a)">-shipping</text>
  <text x="286" y="207" font-size="10.5" fill="var(--da-fg, #0f172a)">-notifier</text>
  <line x1="280" y1="214" x2="500" y2="214" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="286" y="230" font-size="10.5"  fill="var(--da-fg, #0f172a)">+placeOrder(cart, card): OrderId</text>
  <rect x="640" y="20" width="220" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="750" y="38" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">InventoryService</text>
  <line x1="640" y1="46" x2="860" y2="46" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="640" y1="69" x2="860" y2="69" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="646" y="85" font-size="10.5"  fill="var(--da-fg, #0f172a)">+reserve(items): ReservationId</text>
  <text x="646" y="100" font-size="10.5"  fill="var(--da-fg, #0f172a)">+release(id)</text>
  <rect x="640" y="120" width="220" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="750" y="138" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">PaymentGateway</text>
  <line x1="640" y1="146" x2="860" y2="146" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="640" y1="169" x2="860" y2="169" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="646" y="185" font-size="10.5"  fill="var(--da-fg, #0f172a)">+charge(amount, card)</text>
  <text x="646" y="200" font-size="10.5"  fill="var(--da-fg, #0f172a)">+refund(paymentId)</text>
  <rect x="640" y="220" width="220" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="750" y="238" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">ShippingService</text>
  <line x1="640" y1="246" x2="860" y2="246" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="640" y1="269" x2="860" y2="269" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="646" y="285" font-size="10.5"  fill="var(--da-fg, #0f172a)">+schedule(address, items)</text>
  <rect x="640" y="310" width="220" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="750" y="328" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">NotificationService</text>
  <line x1="640" y1="336" x2="860" y2="336" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="640" y1="359" x2="860" y2="359" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="646" y="375" font-size="10.5"  fill="var(--da-fg, #0f172a)">+orderConfirmed(userId, id)</text>
  <path d="M 190 186 L 280 178.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="235" y="177.25" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">placeOrder()</text>
  <path d="M 500 178.5 L 640 63.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <path d="M 500 178.5 L 640 163.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <path d="M 500 178.5 L 640 256" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <path d="M 500 178.5 L 640 346" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <path d="M 30 280 L 250 280 L 260 290 L 260 350 L 30 350 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="38" y="296" font-size="10.5" fill="var(--da-fg, #0f172a)">Alt sistemler hâlâ doğrudan</text>
  <text x="38" y="310" font-size="10.5" fill="var(--da-fg, #0f172a)">kullanılabilir (facade zorunlu</text>
  <text x="38" y="324" font-size="10.5" fill="var(--da-fg, #0f172a)">kılmaz); facade yalnızca sık</text>
  <text x="38" y="338" font-size="10.5" fill="var(--da-fg, #0f172a)">kullanılan senaryoyu paketler.</text>
</svg>
