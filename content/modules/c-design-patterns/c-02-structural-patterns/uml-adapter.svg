<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Adapter UML sınıf diyagramı</title>
  <desc id="desc">CheckoutService istemcisi PaymentGateway arayüzüne bağımlıdır. BankSdkAdapter bu arayüzü uygular ve içinde uyumsuz arayüze sahip LegacyBankSdk nesnesini tutar; charge çağrısını makePayment çağrısına çevirir.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="30" y="100" width="160" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="110" y="118" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">CheckoutService</text>
  <line x1="30" y1="126" x2="190" y2="126" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="142" font-size="10.5" fill="var(--da-fg, #0f172a)">-gateway: PaymentGateway</text>
  <line x1="30" y1="149" x2="190" y2="149" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="165" font-size="10.5"  fill="var(--da-fg, #0f172a)">+pay(order)</text>
  <rect x="300" y="30" width="230" height="86" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.4"/>
  <text x="415" y="44" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">«interface»</text>
  <text x="415" y="60" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">PaymentGateway</text>
  <line x1="300" y1="70" x2="530" y2="70" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <line x1="300" y1="93" x2="530" y2="93" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <text x="306" y="109" font-size="10.5"  fill="var(--da-fg, #0f172a)">+charge(amountMinor, currency): Result</text>
  <rect x="300" y="190" width="230" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="415" y="208" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">BankSdkAdapter</text>
  <line x1="300" y1="216" x2="530" y2="216" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="232" font-size="10.5" fill="var(--da-fg, #0f172a)">-sdk: LegacyBankSdk</text>
  <line x1="300" y1="239" x2="530" y2="239" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="255" font-size="10.5"  fill="var(--da-fg, #0f172a)">+charge(amountMinor, currency)</text>
  <rect x="640" y="190" width="210" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="745" y="208" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">LegacyBankSdk</text>
  <line x1="640" y1="216" x2="850" y2="216" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="646" y="232" font-size="10.5" fill="var(--da-fg, #0f172a)">(3. parti, değiştirilemez)</text>
  <line x1="640" y1="239" x2="850" y2="239" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="646" y="255" font-size="10.5"  fill="var(--da-fg, #0f172a)">+makePayment(lira: number,</text>
  <text x="646" y="270" font-size="10.5"  fill="var(--da-fg, #0f172a)">   cardToken: string): Receipt</text>
  <path d="M 190 136 L 240 140 L 240 80 L 300 73" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <path d="M 415 190 L 415 116" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 530 226 L 640 233.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <text x="585" y="224.75" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">sarar (bileşim)</text>
  <path d="M 600 40 L 840 40 L 850 50 L 850 96 L 600 96 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="608" y="56" font-size="10.5" fill="var(--da-fg, #0f172a)">charge(1999, "TRY") →</text>
  <text x="608" y="70" font-size="10.5" fill="var(--da-fg, #0f172a)">sdk.makePayment(19.99, token)</text>
  <text x="608" y="84" font-size="10.5" fill="var(--da-fg, #0f172a)">kuruş → lira, Result ← Receipt</text>
</svg>
