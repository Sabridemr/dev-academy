<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Bridge UML sınıf diyagramı</title>
  <desc id="desc">Soyutlama tarafında Report ve alt sınıfları SalesReport ile InventoryReport; uygulama tarafında Exporter arayüzü ve PdfExporter ile HtmlExporter. Report, bir Exporter referansı tutar; iki hiyerarşi bağımsız büyür.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="80" y="30" width="230" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="195" y="48" text-anchor="middle" font-size="12" font-weight="700" font-style="italic" fill="var(--da-fg, #0f172a)">Report</text>
  <line x1="80" y1="56" x2="310" y2="56" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="86" y="72" font-size="10.5" fill="var(--da-fg, #0f172a)">#exporter: Exporter</text>
  <line x1="80" y1="79" x2="310" y2="79" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="86" y="95" font-size="10.5" font-style="italic" fill="var(--da-fg, #0f172a)">+render(data): Bytes</text>
  <rect x="20" y="210" width="170" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="105" y="228" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">SalesReport</text>
  <line x1="20" y1="236" x2="190" y2="236" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="20" y1="259" x2="190" y2="259" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="26" y="275" font-size="10.5"  fill="var(--da-fg, #0f172a)">+render(data)</text>
  <rect x="220" y="210" width="170" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="305" y="228" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">InventoryReport</text>
  <line x1="220" y1="236" x2="390" y2="236" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="220" y1="259" x2="390" y2="259" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="226" y="275" font-size="10.5"  fill="var(--da-fg, #0f172a)">+render(data)</text>
  <rect x="560" y="30" width="230" height="116" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.4"/>
  <text x="675" y="44" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">«interface»</text>
  <text x="675" y="60" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">Exporter</text>
  <line x1="560" y1="70" x2="790" y2="70" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <line x1="560" y1="93" x2="790" y2="93" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <text x="566" y="109" font-size="10.5"  fill="var(--da-fg, #0f172a)">+heading(text)</text>
  <text x="566" y="124" font-size="10.5"  fill="var(--da-fg, #0f172a)">+table(rows)</text>
  <text x="566" y="139" font-size="10.5"  fill="var(--da-fg, #0f172a)">+finish(): Bytes</text>
  <rect x="500" y="230" width="170" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="585" y="248" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">PdfExporter</text>
  <line x1="500" y1="256" x2="670" y2="256" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="500" y1="279" x2="670" y2="279" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="506" y="295" font-size="10.5"  fill="var(--da-fg, #0f172a)">+heading() +table()</text>
  <text x="506" y="310" font-size="10.5"  fill="var(--da-fg, #0f172a)">+finish()</text>
  <rect x="700" y="230" width="170" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="785" y="248" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">HtmlExporter</text>
  <line x1="700" y1="256" x2="870" y2="256" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="700" y1="279" x2="870" y2="279" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="706" y="295" font-size="10.5"  fill="var(--da-fg, #0f172a)">+heading() +table()</text>
  <text x="706" y="310" font-size="10.5"  fill="var(--da-fg, #0f172a)">+finish()</text>
  <path d="M 105 210 L 195 102" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-tri)"/>
  <path d="M 305 210 L 195 102" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-tri)"/>
  <path d="M 585 230 L 675 146" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 785 230 L 675 146" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 310 66 L 560 88" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-start="url(#m-dia)" marker-end="url(#m-open)"/>
  <text x="435" y="72" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">köprü: exporter 1</text>
  <path d="M 60 300 L 300 300 L 310 310 L 310 356 L 60 356 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="68" y="316" font-size="10.5" fill="var(--da-fg, #0f172a)">Kalıtımla: 2 rapor × 2 format = 4 sınıf,</text>
  <text x="68" y="330" font-size="10.5" fill="var(--da-fg, #0f172a)">3 × 3 = 9 sınıf... Bridge ile 2 + 2.</text>
  <text x="68" y="344" font-size="10.5" fill="var(--da-fg, #0f172a)">Soyutlama: NE; uygulama: NASIL.</text>
</svg>
