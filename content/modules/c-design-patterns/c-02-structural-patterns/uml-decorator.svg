<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Decorator UML sınıf diyagramı</title>
  <desc id="desc">Notifier arayüzünü hem somut EmailNotifier hem de soyut NotifierDecorator uygular. NotifierDecorator içinde sarılan bir Notifier tutar. RetryDecorator ve LoggingDecorator ondan türer ve send çağrısını sarılan nesneye iletmeden önce ya da sonra davranış ekler.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="340" y="30" width="200" height="86" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.4"/>
  <text x="440" y="44" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">«interface»</text>
  <text x="440" y="60" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">Notifier</text>
  <line x1="340" y1="70" x2="540" y2="70" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <line x1="340" y1="93" x2="540" y2="93" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <text x="346" y="109" font-size="10.5"  fill="var(--da-fg, #0f172a)">+send(msg): Promise&lt;void&gt;</text>
  <rect x="60" y="200" width="180" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="150" y="218" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">EmailNotifier</text>
  <line x1="60" y1="226" x2="240" y2="226" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="66" y="242" font-size="10.5" fill="var(--da-fg, #0f172a)">-smtp</text>
  <line x1="60" y1="249" x2="240" y2="249" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="66" y="265" font-size="10.5"  fill="var(--da-fg, #0f172a)">+send(msg)</text>
  <rect x="420" y="190" width="220" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="530" y="208" text-anchor="middle" font-size="12" font-weight="700" font-style="italic" fill="var(--da-fg, #0f172a)">NotifierDecorator</text>
  <line x1="420" y1="216" x2="640" y2="216" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="426" y="232" font-size="10.5" fill="var(--da-fg, #0f172a)">#inner: Notifier</text>
  <line x1="420" y1="239" x2="640" y2="239" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="426" y="255" font-size="10.5"  fill="var(--da-fg, #0f172a)">+send(msg) { inner.send(msg) }</text>
  <rect x="300" y="330" width="200" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="400" y="348" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">RetryDecorator</text>
  <line x1="300" y1="356" x2="500" y2="356" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="372" font-size="10.5" fill="var(--da-fg, #0f172a)">-attempts = 3</text>
  <line x1="300" y1="379" x2="500" y2="379" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="395" font-size="10.5"  fill="var(--da-fg, #0f172a)">+send(msg)</text>
  <rect x="560" y="330" width="200" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="660" y="348" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">LoggingDecorator</text>
  <line x1="560" y1="356" x2="760" y2="356" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="566" y="372" font-size="10.5" fill="var(--da-fg, #0f172a)">-logger</text>
  <line x1="560" y1="379" x2="760" y2="379" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="566" y="395" font-size="10.5"  fill="var(--da-fg, #0f172a)">+send(msg)</text>
  <path d="M 240 236 L 440 116" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 530 190 L 440 116" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 640 226 L 720 240 L 720 66 L 540 73" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-start="url(#m-dia)" marker-end="url(#m-open)"/>
  <text x="720" y="148" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">inner 1</text>
  <path d="M 400 330 L 530 262" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-tri)"/>
  <path d="M 660 330 L 530 262" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-tri)"/>
  <path d="M 40 40 L 280 40 L 290 50 L 290 124 L 40 124 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="48" y="56" font-size="10.5" fill="var(--da-fg, #0f172a)">Çalışma zamanında zincir:</text>
  <text x="48" y="70" font-size="10.5" fill="var(--da-fg, #0f172a)">new LoggingDecorator(</text>
  <text x="48" y="84" font-size="10.5" fill="var(--da-fg, #0f172a)">  new RetryDecorator(</text>
  <text x="48" y="98" font-size="10.5" fill="var(--da-fg, #0f172a)">    new EmailNotifier(smtp)))</text>
  <text x="48" y="112" font-size="10.5" fill="var(--da-fg, #0f172a)">Aynı arayüz, eklenen davranış.</text>
</svg>
