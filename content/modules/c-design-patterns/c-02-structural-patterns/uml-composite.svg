<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Composite UML sınıf diyagramı</title>
  <desc id="desc">FsNode arayüzü size ve name tanımlar. File yaprak olarak size döner. Directory hem FsNode uygular hem de çocuk FsNode listesi tutar; size çocukların toplamıdır. İstemci yaprak ve bileşik düğümleri aynı şekilde kullanır.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="30" y="120" width="170" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="115" y="138" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">DiskUsageReport</text>
  <line x1="30" y1="146" x2="200" y2="146" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="30" y1="169" x2="200" y2="169" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="185" font-size="10.5"  fill="var(--da-fg, #0f172a)">+print(root: FsNode)</text>
  <rect x="320" y="20" width="190" height="101" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.4"/>
  <text x="415" y="34" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">«interface»</text>
  <text x="415" y="50" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">FsNode</text>
  <line x1="320" y1="60" x2="510" y2="60" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <line x1="320" y1="83" x2="510" y2="83" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <text x="326" y="99" font-size="10.5"  fill="var(--da-fg, #0f172a)">+name: string</text>
  <text x="326" y="114" font-size="10.5"  fill="var(--da-fg, #0f172a)">+size(): number</text>
  <rect x="230" y="200" width="160" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="310" y="218" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">File</text>
  <line x1="230" y1="226" x2="390" y2="226" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="236" y="242" font-size="10.5" fill="var(--da-fg, #0f172a)">-bytes: number</text>
  <line x1="230" y1="249" x2="390" y2="249" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="236" y="265" font-size="10.5"  fill="var(--da-fg, #0f172a)">+size() { return bytes }</text>
  <rect x="440" y="200" width="250" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="565" y="218" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">Directory</text>
  <line x1="440" y1="226" x2="690" y2="226" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="446" y="242" font-size="10.5" fill="var(--da-fg, #0f172a)">-children: FsNode[]</text>
  <line x1="440" y1="249" x2="690" y2="249" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="446" y="265" font-size="10.5"  fill="var(--da-fg, #0f172a)">+add(node: FsNode)</text>
  <text x="446" y="280" font-size="10.5"  fill="var(--da-fg, #0f172a)">+size() { Σ children.size() }</text>
  <path d="M 200 156 L 260 160 L 260 60 L 320 70.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <path d="M 310 200 L 415 121" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 565 200 L 415 121" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 690 243.5 L 730 260 L 730 60 L 510 70.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-start="url(#m-diaf)" marker-end="url(#m-open)"/>
  <text x="690" y="160" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">children 0..*</text>
  <path d="M 30 230 L 190 230 L 200 240 L 200 286 L 30 286 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="38" y="246" font-size="10.5" fill="var(--da-fg, #0f172a)">Yaprak ve dal aynı tip:</text>
  <text x="38" y="260" font-size="10.5" fill="var(--da-fg, #0f172a)">istemci özyinelemeyi</text>
  <text x="38" y="274" font-size="10.5" fill="var(--da-fg, #0f172a)">bilmek zorunda değil.</text>
</svg>
