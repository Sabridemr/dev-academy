<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Transactional Outbox UML sınıf diyagramı</title>
  <desc id="desc">OrderService tek bir veritabanı transaction'ı içinde OrderRepository ve OutboxRepository'ye yazar. OutboxRelay periyodik olarak gönderilmemiş outbox satırlarını okur, MessageBroker'a yayınlar ve satırı gönderildi olarak işaretler. Tüketici idempotent olmalıdır çünkü teslim en az bir kezdir.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="30" y="60" width="200" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="130" y="78" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">OrderService</text>
  <line x1="30" y1="86" x2="230" y2="86" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="102" font-size="10.5" fill="var(--da-fg, #0f172a)">-db: Transaction</text>
  <line x1="30" y1="109" x2="230" y2="109" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="125" font-size="10.5"  fill="var(--da-fg, #0f172a)">+place(cmd)</text>
  <text x="36" y="140" font-size="10.5"  fill="var(--da-fg, #0f172a)">  tx { orders.insert; outbox.insert }</text>
  <rect x="300" y="30" width="200" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="400" y="48" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">OrderRepository</text>
  <line x1="300" y1="56" x2="500" y2="56" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="72" font-size="10.5" fill="var(--da-fg, #0f172a)">tablo: orders</text>
  <line x1="300" y1="79" x2="500" y2="79" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="95" font-size="10.5"  fill="var(--da-fg, #0f172a)">+insert(order, tx)</text>
  <rect x="300" y="150" width="200" height="117" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="400" y="168" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">OutboxRepository</text>
  <line x1="300" y1="176" x2="500" y2="176" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="192" font-size="10.5" fill="var(--da-fg, #0f172a)">tablo: outbox</text>
  <text x="306" y="207" font-size="10.5" fill="var(--da-fg, #0f172a)">id, type, payload, created_at, sent_at</text>
  <line x1="300" y1="214" x2="500" y2="214" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="230" font-size="10.5"  fill="var(--da-fg, #0f172a)">+insert(evt, tx)</text>
  <text x="306" y="245" font-size="10.5"  fill="var(--da-fg, #0f172a)">+pollUnsent(limit)</text>
  <text x="306" y="260" font-size="10.5"  fill="var(--da-fg, #0f172a)">+markSent(ids)</text>
  <rect x="580" y="150" width="180" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="670" y="168" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">OutboxRelay</text>
  <line x1="580" y1="176" x2="760" y2="176" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="586" y="192" font-size="10.5" fill="var(--da-fg, #0f172a)">-interval = 200ms</text>
  <text x="586" y="207" font-size="10.5" fill="var(--da-fg, #0f172a)">-batch = 100</text>
  <line x1="580" y1="214" x2="760" y2="214" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="586" y="230" font-size="10.5"  fill="var(--da-fg, #0f172a)">+tick()</text>
  <rect x="580" y="300" width="180" height="86" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.4"/>
  <text x="670" y="314" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">«interface»</text>
  <text x="670" y="330" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">MessageBroker</text>
  <line x1="580" y1="340" x2="760" y2="340" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <line x1="580" y1="363" x2="760" y2="363" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <text x="586" y="379" font-size="10.5"  fill="var(--da-fg, #0f172a)">+publish(topic, evt, key)</text>
  <rect x="30" y="300" width="200" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="130" y="318" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">Consumer (idempotent)</text>
  <line x1="30" y1="326" x2="230" y2="326" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="342" font-size="10.5" fill="var(--da-fg, #0f172a)">processed_ids tablosu</text>
  <line x1="30" y1="349" x2="230" y2="349" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="365" font-size="10.5"  fill="var(--da-fg, #0f172a)">+on(evt)</text>
  <path d="M 230 103.5 L 300 66" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <text x="265" y="79.75" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">aynı tx</text>
  <path d="M 230 103.5 L 260 200 L 300 208.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <text x="280" y="199.25" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">aynı tx</text>
  <path d="M 580 193.5 L 500 208.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="540" y="196" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">poll / markSent</text>
  <path d="M 670 237 L 670 300" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="670" y="263.5" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">publish</text>
  <path d="M 580 343 L 230 336" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="405" y="334.5" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">at-least-once</text>
  <path d="M 790 60 L 900 60 L 910 70 L 910 130 L 790 130 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="798" y="76" font-size="10.5" fill="var(--da-fg, #0f172a)">Alternatif relay:</text>
  <text x="798" y="90" font-size="10.5" fill="var(--da-fg, #0f172a)">CDC (Debezium)</text>
  <text x="798" y="104" font-size="10.5" fill="var(--da-fg, #0f172a)">WAL okur,</text>
  <text x="798" y="118" font-size="10.5" fill="var(--da-fg, #0f172a)">polling yok.</text>
</svg>
