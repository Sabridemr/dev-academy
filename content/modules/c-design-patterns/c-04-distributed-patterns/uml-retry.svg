<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Retry ve Exponential Backoff UML sınıf diyagramı</title>
  <desc id="desc">RetryPolicy sınıfı maksimum deneme, taban gecikme, üst sınır ve jitter stratejisini tutar; execute metodu yeniden denenebilir hataları ayırt eder. BackoffStrategy arayüzünü FullJitter ve DecorrelatedJitter uygular. İstemci politikayı idempotent çağrılara uygular.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="30" y="90" width="170" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="115" y="108" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">InventoryClient</text>
  <line x1="30" y1="116" x2="200" y2="116" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="132" font-size="10.5" fill="var(--da-fg, #0f172a)">-retry: RetryPolicy</text>
  <line x1="30" y1="139" x2="200" y2="139" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="155" font-size="10.5"  fill="var(--da-fg, #0f172a)">+reserve(items)  (idempotent)</text>
  <rect x="290" y="40" width="280" height="147" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="430" y="58" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">RetryPolicy</text>
  <line x1="290" y1="66" x2="570" y2="66" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="296" y="82" font-size="10.5" fill="var(--da-fg, #0f172a)">-maxAttempts = 4</text>
  <text x="296" y="97" font-size="10.5" fill="var(--da-fg, #0f172a)">-baseMs = 100</text>
  <text x="296" y="112" font-size="10.5" fill="var(--da-fg, #0f172a)">-capMs = 5000</text>
  <text x="296" y="127" font-size="10.5" fill="var(--da-fg, #0f172a)">-backoff: BackoffStrategy</text>
  <text x="296" y="142" font-size="10.5" fill="var(--da-fg, #0f172a)">-retryOn: (err) =&gt; boolean</text>
  <line x1="290" y1="149" x2="570" y2="149" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="296" y="165" font-size="10.5"  fill="var(--da-fg, #0f172a)">+execute&lt;T&gt;(fn): Promise&lt;T&gt;</text>
  <text x="296" y="180" font-size="10.5"  fill="var(--da-fg, #0f172a)">-delayFor(attempt): number</text>
  <rect x="650" y="40" width="200" height="86" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.4"/>
  <text x="750" y="54" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">«interface»</text>
  <text x="750" y="70" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">BackoffStrategy</text>
  <line x1="650" y1="80" x2="850" y2="80" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <line x1="650" y1="103" x2="850" y2="103" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
  <text x="656" y="119" font-size="10.5"  fill="var(--da-fg, #0f172a)">+delay(attempt, base, cap)</text>
  <rect x="600" y="220" width="140" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="670" y="238" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">FullJitter</text>
  <line x1="600" y1="246" x2="740" y2="246" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="600" y1="269" x2="740" y2="269" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="606" y="285" font-size="10.5"  fill="var(--da-fg, #0f172a)">rand(0, min(cap, base·2ⁿ))</text>
  <rect x="760" y="220" width="110" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="815" y="238" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">DecorrelatedJitter</text>
  <line x1="760" y1="246" x2="870" y2="246" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <line x1="760" y1="269" x2="870" y2="269" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="766" y="285" font-size="10.5"  fill="var(--da-fg, #0f172a)">rand(base, prev·3)</text>
  <path d="M 200 126 L 290 113.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <text x="245" y="114.75" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">execute(() =&gt; ...)</text>
  <path d="M 570 113.5 L 650 83" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-start="url(#m-dia)" marker-end="url(#m-open)"/>
  <text x="610" y="93.25" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">backoff</text>
  <path d="M 670 220 L 750 126" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 815 220 L 750 126" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-tri)"/>
  <path d="M 30 220 L 340 220 L 350 230 L 350 290 L 30 290 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="38" y="236" font-size="10.5" fill="var(--da-fg, #0f172a)">Yalnızca GEÇİCİ hatalar (503, timeout, 429) için;</text>
  <text x="38" y="250" font-size="10.5" fill="var(--da-fg, #0f172a)">400/404/401 için asla. Jitter olmadan tüm istemciler</text>
  <text x="38" y="264" font-size="10.5" fill="var(--da-fg, #0f172a)">aynı anda geri döner: thundering herd.</text>
  <text x="38" y="278" font-size="10.5" fill="var(--da-fg, #0f172a)">Retry bütçesi: toplam isteklerin %10'unu aşma.</text>
</svg>
