  <text x="145" y="190" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">OrderApp</text>
  <line x1="60" y1="200" x2="230" y2="200" stroke="var(--da-primary, #6366f1)" stroke-width="1"/>
