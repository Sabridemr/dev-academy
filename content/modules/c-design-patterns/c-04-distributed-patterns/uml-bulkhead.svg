<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Bulkhead UML sınıf diyagramı</title>
  <desc id="desc">Bulkhead sınıfı bir semafor ve bekleme kuyruğu ile eşzamanlı çağrı sayısını sınırlar. BulkheadRegistry bağımlılık başına ayrı bulkhead tutar: payments için 20, recommendations için 5 izin. OrderService her bağımlılığı kendi bölmesi üzerinden çağırır.</desc>
  <defs>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
    </marker>
    <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-diaf" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="var(--da-fg, #0f172a)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3"/>
    </marker>
    <marker id="m-primary" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="m-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="m-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="m-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>
  <rect x="30" y="100" width="170" height="72" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="115" y="118" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">OrderService</text>
  <line x1="30" y1="126" x2="200" y2="126" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="142" font-size="10.5" fill="var(--da-fg, #0f172a)">-bulkheads: BulkheadRegistry</text>
  <line x1="30" y1="149" x2="200" y2="149" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="36" y="165" font-size="10.5"  fill="var(--da-fg, #0f172a)">+place(order)</text>
  <rect x="290" y="40" width="230" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="405" y="58" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">BulkheadRegistry</text>
  <line x1="290" y1="66" x2="520" y2="66" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="296" y="82" font-size="10.5" fill="var(--da-fg, #0f172a)">-byName: Map&lt;string, Bulkhead&gt;</text>
  <line x1="290" y1="89" x2="520" y2="89" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="296" y="105" font-size="10.5"  fill="var(--da-fg, #0f172a)">+for(name): Bulkhead</text>
  <text x="296" y="120" font-size="10.5"  fill="var(--da-fg, #0f172a)">+metrics(): Map</text>
  <rect x="600" y="40" width="250" height="162" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="725" y="58" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">Bulkhead</text>
  <line x1="600" y1="66" x2="850" y2="66" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="606" y="82" font-size="10.5" fill="var(--da-fg, #0f172a)">-name: string</text>
  <text x="606" y="97" font-size="10.5" fill="var(--da-fg, #0f172a)">-maxConcurrent: number</text>
  <text x="606" y="112" font-size="10.5" fill="var(--da-fg, #0f172a)">-maxQueue: number</text>
  <text x="606" y="127" font-size="10.5" fill="var(--da-fg, #0f172a)">-inFlight = 0</text>
  <text x="606" y="142" font-size="10.5" fill="var(--da-fg, #0f172a)">-queue: Waiter[]</text>
  <line x1="600" y1="149" x2="850" y2="149" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="606" y="165" font-size="10.5"  fill="var(--da-fg, #0f172a)">+run&lt;T&gt;(fn): Promise&lt;T&gt;</text>
  <text x="606" y="180" font-size="10.5"  fill="var(--da-fg, #0f172a)">-acquire(): Promise&lt;void&gt;</text>
  <text x="606" y="195" font-size="10.5"  fill="var(--da-fg, #0f172a)">-release()</text>
  <rect x="300" y="240" width="200" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="400" y="258" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">payments: Bulkhead</text>
  <line x1="300" y1="266" x2="500" y2="266" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="306" y="282" font-size="10.5" fill="var(--da-fg, #0f172a)">maxConcurrent = 20</text>
  <text x="306" y="297" font-size="10.5" fill="var(--da-fg, #0f172a)">maxQueue = 50</text>
  <line x1="300" y1="304" x2="500" y2="304" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <rect x="560" y="240" width="220" height="87" rx="4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="670" y="258" text-anchor="middle" font-size="12" font-weight="700"  fill="var(--da-fg, #0f172a)">recommendations: Bulkhead</text>
  <line x1="560" y1="266" x2="780" y2="266" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <text x="566" y="282" font-size="10.5" fill="var(--da-fg, #0f172a)">maxConcurrent = 5</text>
  <text x="566" y="297" font-size="10.5" fill="var(--da-fg, #0f172a)">maxQueue = 0 (hemen reddet)</text>
  <line x1="560" y1="304" x2="780" y2="304" stroke="var(--da-fg, #0f172a)" stroke-width="1"/>
  <path d="M 200 136 L 290 83.5" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-end="url(#m-open)"/>
  <path d="M 520 83.5 L 600 121" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" marker-start="url(#m-diaf)" marker-end="url(#m-open)"/>
  <text x="560" y="97.25" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">1..*</text>
  <path d="M 400 240 L 725 202" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="562.5" y="216" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">örnek</text>
  <path d="M 670 240 L 725 202" stroke="var(--da-fg, #0f172a)" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#m-open)"/>
  <text x="697.5" y="216" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">örnek</text>
  <path d="M 30 230 L 260 230 L 270 240 L 270 300 L 30 300 z" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1"/>
  <text x="38" y="246" font-size="10.5" fill="var(--da-fg, #0f172a)">Gemi bölmeleri: bir bölme su alınca</text>
  <text x="38" y="260" font-size="10.5" fill="var(--da-fg, #0f172a)">gemi batmaz. Yavaş öneri servisi</text>
  <text x="38" y="274" font-size="10.5" fill="var(--da-fg, #0f172a)">ödeme iş parçacıklarını tüketemez.</text>
  <text x="38" y="288" font-size="10.5" fill="var(--da-fg, #0f172a)">Dolu bölme → hızlı ret + fallback.</text>
</svg>
