<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Sertifika zinciri ve TLS 1.3 anahtar akışı</title>
  <desc id="desc">Üst şeritte sertifika zinciri: sunucunun yaprak sertifikası ara CA tarafından, ara CA kök CA tarafından imzalanır; kök CA istemcinin güven deposunda önceden bulunur. Alt şeritte TLS 1.3 el sıkışması: istemci ve sunucu geçici ECDHE paylarını değiştirir, ortak sırdan simetrik oturum anahtarı türetilir; sunucunun uzun ömürlü anahtarı yalnızca imza için kullanılır ve veri AES-GCM ile şifrelenir.</desc>
  <defs>
    <marker id="o3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="o3-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
  </defs>

  <text x="480" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">Güven nereden gelir, anahtar nasıl üretilir?</text>

  <!-- ÜST ŞERİT: sertifika zinciri -->
  <text x="30" y="62" font-size="12" font-weight="600" fill="var(--da-primary, #6366f1)">1 · KİMLİK: sertifika zinciri</text>
  <g stroke="var(--da-border, #cbd5e1)" stroke-width="1.5" fill="var(--da-surface, #ffffff)">
    <rect x="30" y="76" width="230" height="112" rx="12"/>
    <rect x="365" y="76" width="230" height="112" rx="12"/>
  </g>
  <rect x="700" y="76" width="230" height="112" rx="12" fill="var(--da-success, #10b981)" opacity="0.12" stroke="var(--da-success, #10b981)" stroke-width="1.5"/>
  <g font-size="14" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="145" y="100">Yaprak sertifika</text>
    <text x="480" y="100">Ara CA</text>
    <text x="815" y="100">Kök CA</text>
  </g>
  <g font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="145" y="122">SAN: shop.example.com</text>
    <text x="145" y="138">açık anahtar (ECDSA)</text>
    <text x="145" y="154">notAfter: 2026-12-01</text>
    <text x="145" y="174" fill="var(--da-primary, #6366f1)">sunucu gönderir</text>
    <text x="480" y="122">yaprağı imzalar</text>
    <text x="480" y="138">kendisi kök tarafından imzalı</text>
    <text x="480" y="154">kısa ömürlü, değiştirilebilir</text>
    <text x="480" y="174" fill="var(--da-primary, #6366f1)">sunucu gönderir (fullchain)</text>
    <text x="815" y="122">kendi kendini imzalar</text>
    <text x="815" y="138">işletim sistemi / tarayıcı</text>
    <text x="815" y="154">güven deposunda hazır bekler</text>
    <text x="815" y="174" fill="var(--da-success, #10b981)">ağdan gelmez</text>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.8" fill="none" marker-end="url(#o3-arrow)">
    <path d="M 363 132 L 262 132"/>
    <path d="M 698 132 L 597 132"/>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="312" y="124">imzalar</text>
    <text x="647" y="124">imzalar</text>
  </g>
  <text x="480" y="214" text-anchor="middle" font-size="11" fill="var(--da-fg, #0f172a)">İstemci her halkada kontrol eder: imza tutuyor mu · tarih geçerli mi · alan adı SAN'da mı · zincir güvenilen bir köke varıyor mu</text>

  <line x1="30" y1="234" x2="930" y2="234" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="4 4"/>

  <!-- ALT ŞERİT: anahtar akışı -->
  <text x="30" y="262" font-size="12" font-weight="600" fill="var(--da-primary, #6366f1)">2 · ANAHTAR: asimetrik → simetrik</text>
  <g stroke="var(--da-border, #cbd5e1)" stroke-width="1.5" fill="var(--da-surface, #ffffff)">
    <rect x="30" y="278" width="190" height="96" rx="12"/>
    <rect x="740" y="278" width="190" height="96" rx="12"/>
  </g>
  <rect x="345" y="290" width="270" height="72" rx="12" fill="var(--da-accent, #f59e0b)" opacity="0.14" stroke="var(--da-accent, #f59e0b)" stroke-width="1.5"/>
  <g font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="125" y="302">İstemci</text>
    <text x="835" y="302">Sunucu</text>
    <text x="480" y="316">Ortak sır (ECDHE)</text>
  </g>
  <g font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="125" y="324">geçici özel pay a</text>
    <text x="125" y="340">açık pay A → gönderir</text>
    <text x="125" y="360" fill="var(--da-primary, #6366f1)">ClientHello + key share</text>
    <text x="835" y="324">geçici özel pay b</text>
    <text x="835" y="340">açık pay B → gönderir</text>
    <text x="835" y="360" fill="var(--da-primary, #6366f1)">ServerHello + key share</text>
    <text x="480" y="336">f(a, B) = f(b, A)</text>
    <text x="480" y="352">kablodan hiç geçmez</text>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.8" fill="none" marker-end="url(#o3-arrow)">
    <path d="M 222 326 L 343 326"/>
    <path d="M 738 326 L 617 326"/>
  </g>
  <path d="M 480 364 L 480 398" stroke="var(--da-success, #10b981)" stroke-width="2" fill="none" marker-end="url(#o3-arrow-ok)"/>
  <rect x="300" y="400" width="360" height="40" rx="10" fill="var(--da-success, #10b981)" opacity="0.14" stroke="var(--da-success, #10b981)" stroke-width="1.5"/>
  <text x="480" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-success, #10b981)">Simetrik oturum anahtarı → AES-GCM / ChaCha20 ile veri</text>
  <text x="835" y="398" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">uzun ömürlü anahtar yalnızca</text>
  <text x="835" y="412" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">el sıkışmayı İMZALAR</text>
  <text x="480" y="462" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">Geçici paylar bağlantı bitince silinir: özel anahtar sonradan çalınsa da eski trafik çözülemez (forward secrecy).</text>
</svg>
