<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">CQRS ve event sourcing veri akışı</title>
  <desc id="desc">Solda istemci. Komutlar üstteki yazma tarafına gider: komut işleyici, aggregate ve olayları ekleyen event store. Event store'dan olaylar bir projeksiyon bileşenine akar ve alttaki okuma modelini (denormalize tablo, arama indeksi, cache) günceller. Sorgular doğrudan okuma modelinden karşılanır. Event store'un yanında snapshot ve replay notları vardır.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
  </defs>

  <!-- Bölgeler -->
  <rect x="200" y="20" width="740" height="190" rx="14" fill="var(--da-primary, #6366f1)" fill-opacity="0.05" stroke="var(--da-primary, #6366f1)" stroke-dasharray="6 6"/>
  <text x="216" y="42" font-size="13" font-weight="700" fill="var(--da-primary, #6366f1)">YAZMA TARAFI (Command)</text>
  <rect x="200" y="250" width="740" height="170" rx="14" fill="var(--da-success, #10b981)" fill-opacity="0.05" stroke="var(--da-success, #10b981)" stroke-dasharray="6 6"/>
  <text x="216" y="272" font-size="13" font-weight="700" fill="var(--da-success, #10b981)">OKUMA TARAFI (Query)</text>

  <!-- İstemci -->
  <rect x="40" y="190" width="120" height="60" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="100" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">İstemci / BFF</text>
  <text x="100" y="234" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">komut + sorgu</text>

  <!-- Komut yolu -->
  <path d="M 160 205 C 190 205, 190 110, 238 110" stroke="var(--da-primary, #6366f1)" stroke-width="1.8" fill="none" marker-end="url(#arrow-p)"/>
  <text x="196" y="96" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">AddItem(order-42, sku-9)</text>

  <rect x="240" y="80" width="130" height="60" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="305" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Command Handler</text>
  <text x="305" y="122" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">doğrula, yetki, kural</text>

  <path d="M 370 110 L 428 110" stroke="var(--da-muted, #64748b)" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <rect x="430" y="80" width="130" height="60" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="495" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Order Aggregate</text>
  <text x="495" y="122" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">replay → karar → yeni olay</text>

  <path d="M 560 110 L 628 110" stroke="var(--da-primary, #6366f1)" stroke-width="1.8" fill="none" marker-end="url(#arrow-p)"/>
  <text x="594" y="100" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">append</text>

  <!-- Event store -->
  <rect x="630" y="60" width="200" height="130" rx="10" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1.5"/>
  <text x="730" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="var(--da-fg, #0f172a)">Event Store (append-only)</text>
  <g font-size="10" fill="var(--da-fg, #0f172a)">
    <text x="642" y="100">#1 OrderPlaced</text>
    <text x="642" y="116">#2 ItemAdded(sku-3)</text>
    <text x="642" y="132">#3 ItemAdded(sku-9)</text>
    <text x="642" y="148">#4 PaymentCaptured</text>
    <text x="642" y="164" fill="var(--da-muted, #64748b)">… snapshot @ #100</text>
  </g>
  <text x="730" y="182" text-anchor="middle" font-size="9.5" fill="var(--da-muted, #64748b)">tek doğruluk kaynağı · tam denetim izi</text>

  <!-- replay oku -->
  <path d="M 630 150 C 600 160, 540 160, 510 142" stroke="var(--da-accent, #f59e0b)" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-a)"/>
  <text x="565" y="170" text-anchor="middle" font-size="9.5" fill="var(--da-accent, #f59e0b)">replay (durumu yeniden kur)</text>

  <!-- Projeksiyon -->
  <path d="M 850 125 C 900 125, 900 310, 842 310" stroke="var(--da-accent, #f59e0b)" stroke-width="1.8" fill="none" marker-end="url(#arrow-a)"/>
  <text x="905" y="222" text-anchor="middle" font-size="10" fill="var(--da-accent, #f59e0b)">olay akışı</text>

  <rect x="700" y="285" width="140" height="56" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="770" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Projeksiyon</text>
  <text x="770" y="326" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">olay → okuma modeli</text>

  <path d="M 700 313 L 612 313" stroke="var(--da-success, #10b981)" stroke-width="1.8" fill="none" marker-end="url(#arrow-s)"/>
  <text x="656" y="304" text-anchor="middle" font-size="10" fill="var(--da-success, #10b981)">UPSERT</text>

  <!-- Okuma modelleri -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-success, #10b981)" stroke-width="1.5">
    <rect x="420" y="285" width="190" height="56" rx="10"/>
    <rect x="420" y="352" width="190" height="52" rx="10"/>
  </g>
  <text x="515" y="306" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">order_summary (SQL)</text>
  <text x="515" y="324" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">denormalize: ürün adı, kargo durumu</text>
  <text x="515" y="373" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Elasticsearch / Redis</text>
  <text x="515" y="391" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">arama, sayaçlar, son görüntülenenler</text>

  <!-- Sorgu yolu -->
  <path d="M 160 235 C 190 235, 190 330, 418 330" stroke="var(--da-success, #10b981)" stroke-width="1.8" fill="none" marker-end="url(#arrow-s)"/>
  <text x="290" y="320" text-anchor="middle" font-size="10" fill="var(--da-success, #10b981)">GET /orders?customer=…</text>

  <!-- Notlar -->
  <g font-size="10" fill="var(--da-fg, #0f172a)">
    <text x="216" y="372">• okuma modeli geride kalabilir</text>
    <text x="216" y="388">  (read-your-writes gerekir)</text>
    <text x="216" y="408">• bozuksa sil, olaylardan yeniden üret</text>
  </g>
  <text x="480" y="432" text-anchor="middle" font-size="10.5" fill="var(--da-muted, #64748b)">CQRS tek başına kullanılabilir (klasik tablo + denormalize kopya); event sourcing ise CQRS'i zorunlu kılar.</text>
</svg>
