<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Clean Architecture halkaları ve hexagonal port-adaptörler</title>
  <desc id="desc">İç içe dört halka: merkezde Domain, çevresinde Application, sonra Adapters, en dışta Frameworks. Solda sürücü adaptörler, sağda sürülen adaptörler. Bütün bağımlılık okları merkeze bakar. Altta bir isteğin yolu: adaptör, port, use case, port, adaptör.</desc>
  <defs>
    <marker id="hx-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="hx-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- Halkalar -->
  <circle cx="450" cy="200" r="185" fill="var(--da-muted, #64748b)" fill-opacity="0.06" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
  <circle cx="450" cy="200" r="135" fill="var(--da-accent, #0ea5e9)" fill-opacity="0.08" stroke="var(--da-accent, #0ea5e9)" stroke-width="1.5"/>
  <circle cx="450" cy="200" r="88" fill="var(--da-primary, #6366f1)" fill-opacity="0.10" stroke="var(--da-primary, #6366f1)" stroke-width="1.5"/>
  <circle cx="450" cy="200" r="44" fill="var(--da-success, #10b981)" fill-opacity="0.18" stroke="var(--da-success, #10b981)" stroke-width="1.8"/>

  <g text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <text x="450" y="196" font-size="13" font-weight="700">Domain</text>
    <text x="450" y="212" font-size="10" fill="var(--da-muted, #64748b)">gradeAnswer</text>
    <text x="450" y="138" font-size="12" font-weight="600">Application</text>
    <text x="450" y="152" font-size="10" fill="var(--da-muted, #64748b)">use case · port'lar</text>
    <text x="450" y="88" font-size="12" font-weight="600">Adapters</text>
    <text x="450" y="36" font-size="12" font-weight="600">Frameworks &amp; drivers</text>
    <text x="450" y="50" font-size="10" fill="var(--da-muted, #64748b)">NestJS · Prisma Client · PostgreSQL</text>
  </g>

  <!-- Port işaretleri -->
  <rect x="362" y="232" width="58" height="22" rx="5" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)"/>
  <text x="391" y="247" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">giriş port</text>
  <rect x="480" y="232" width="58" height="22" rx="5" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)"/>
  <text x="509" y="247" text-anchor="middle" font-size="10" fill="var(--da-primary, #6366f1)">çıkış port</text>

  <!-- Sürücü adaptörler (sol) -->
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="20" y="92" font-weight="700" font-size="13">Sürücü adaptörler</text>
    <rect x="20" y="104" width="190" height="34" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)"/>
    <text x="115" y="126" text-anchor="middle">HTTP controller (NestJS)</text>
    <rect x="20" y="150" width="190" height="34" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)"/>
    <text x="115" y="172" text-anchor="middle">Kuyruk tüketicisi</text>
    <rect x="20" y="196" width="190" height="34" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)"/>
    <text x="115" y="218" text-anchor="middle">Jest testi · CLI</text>
  </g>
  <g stroke="var(--da-primary, #6366f1)" stroke-width="2" fill="none" marker-end="url(#hx-in)">
    <path d="M 210 121 C 290 121, 330 222, 360 240"/>
    <path d="M 210 167 C 280 167, 330 232, 360 243"/>
    <path d="M 210 213 C 280 213, 330 242, 360 246"/>
  </g>

  <!-- Sürülen adaptörler (sağ) -->
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="880" y="92" font-weight="700" font-size="13" text-anchor="end">Sürülen adaptörler</text>
    <rect x="690" y="104" width="190" height="34" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)"/>
    <text x="785" y="126" text-anchor="middle">PrismaQuizRepository</text>
    <rect x="690" y="150" width="190" height="34" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-success, #10b981)" stroke-dasharray="5 3"/>
    <text x="785" y="172" text-anchor="middle">InMemoryQuizRepository</text>
    <rect x="690" y="196" width="190" height="34" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)"/>
    <text x="785" y="218" text-anchor="middle">E-posta / push istemcisi</text>
  </g>
  <!-- Bağımlılık: adaptör → port (içeri) -->
  <g stroke="var(--da-primary, #6366f1)" stroke-width="2" fill="none" marker-end="url(#hx-in)">
    <path d="M 690 121 C 610 121, 570 222, 540 240"/>
    <path d="M 690 167 C 620 167, 570 232, 540 243"/>
    <path d="M 690 213 C 620 213, 570 242, 540 246"/>
  </g>
  <text x="620" y="290" text-anchor="middle" font-size="11" fill="var(--da-primary, #6366f1)">"uygular" → içeri</text>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="var(--da-primary, #6366f1)">"çağırır" → içeri</text>

  <!-- Alt şerit: isteğin yolu -->
  <rect x="20" y="410" width="860" height="94" rx="14" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="40" y="434" font-size="12" font-weight="600" fill="var(--da-muted, #64748b)">İsteğin yolu (akış iki yönlü, bağımlılık içeri)</text>
  <g font-size="12" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <rect x="40" y="448" width="120" height="40" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)"/>
    <text x="100" y="473">Controller</text>
    <rect x="210" y="448" width="110" height="40" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)"/>
    <text x="265" y="473">giriş port'u</text>
    <rect x="370" y="448" width="160" height="40" rx="8" fill="var(--da-primary, #6366f1)" fill-opacity="0.12" stroke="var(--da-primary, #6366f1)"/>
    <text x="450" y="473">SubmitAttempt</text>
    <rect x="580" y="448" width="110" height="40" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)"/>
    <text x="635" y="473">çıkış port'u</text>
    <rect x="740" y="448" width="120" height="40" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)"/>
    <text x="800" y="473">Prisma → DB</text>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.8" fill="none" marker-end="url(#hx-flow)">
    <path d="M 160 468 L 206 468"/>
    <path d="M 320 468 L 366 468"/>
    <path d="M 530 468 L 576 468"/>
    <path d="M 690 468 L 736 468"/>
  </g>
</svg>
