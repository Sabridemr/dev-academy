<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">OAuth 2.0 rolleri, ön kanal ve arka kanal</title>
  <desc id="desc">Üst bantta ön kanal: kullanıcı tarayıcısı yetkilendirme sunucusuna yönlendirilir ve kodla geri döner. Alt bantta arka kanal: istemci kodu ve PKCE verifier'ı token ile takas eder. Access token kaynak sunucusuna, ID token yalnızca istemciye gider.</desc>
  <defs>
    <marker id="n03-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted)"/>
    </marker>
    <marker id="n03-arrow-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary)"/>
    </marker>
    <marker id="n03-arrow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success)"/>
    </marker>
  </defs>

  <!-- Bantlar -->
  <rect x="16" y="16" width="928" height="190" rx="14" fill="var(--da-surface)" stroke="var(--da-border)" stroke-dasharray="6 6"/>
  <text x="32" y="40" font-size="13" font-weight="600" fill="var(--da-danger)">Ön kanal · tarayıcı yönlendirmeleri (görünür, değiştirilebilir)</text>
  <rect x="16" y="226" width="928" height="218" rx="14" fill="var(--da-surface)" stroke="var(--da-border)"/>
  <text x="32" y="250" font-size="13" font-weight="600" fill="var(--da-success)">Arka kanal · sunucudan sunucuya HTTPS</text>

  <!-- Düğümler -->
  <rect x="50" y="80" width="190" height="80" rx="12" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="145" y="114" text-anchor="middle" font-size="14" fill="var(--da-fg)">Kaynak sahibi</text>
  <text x="145" y="134" text-anchor="middle" font-size="12" fill="var(--da-muted)">kullanıcı + tarayıcı</text>

  <rect x="690" y="80" width="220" height="80" rx="12" fill="var(--da-primary)" fill-opacity="0.12" stroke="var(--da-primary)" stroke-width="2"/>
  <text x="800" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-primary)">Yetkilendirme sunucusu</text>
  <text x="800" y="134" text-anchor="middle" font-size="12" fill="var(--da-fg)">giriş · onay · /token</text>

  <rect x="50" y="300" width="190" height="80" rx="12" fill="var(--da-accent)" fill-opacity="0.12" stroke="var(--da-accent)" stroke-width="2"/>
  <text x="145" y="332" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-accent)">İstemci</text>
  <text x="145" y="354" text-anchor="middle" font-size="12" fill="var(--da-fg)">verifier · state · nonce</text>

  <rect x="690" y="300" width="220" height="80" rx="12" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="800" y="332" text-anchor="middle" font-size="14" fill="var(--da-fg)">Kaynak sunucusu</text>
  <text x="800" y="354" text-anchor="middle" font-size="12" fill="var(--da-muted)">imza · aud · scope</text>

  <!-- Ön kanal okları -->
  <path d="M 242 105 L 688 105" stroke="var(--da-primary)" stroke-width="2" fill="none" marker-end="url(#n03-arrow-p)"/>
  <text x="465" y="96" text-anchor="middle" font-size="12" fill="var(--da-fg)">② /authorize · client_id · scope · state · code_challenge</text>
  <path d="M 688 140 L 242 140" stroke="var(--da-danger)" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#n03-arrow)"/>
  <text x="465" y="160" text-anchor="middle" font-size="12" fill="var(--da-fg)">③ 302 redirect_uri?code=…&amp;state=… (tek kullanımlık kod)</text>

  <!-- Tarayıcı ↔ istemci -->
  <path d="M 120 162 L 120 298" stroke="var(--da-muted)" stroke-width="1.5" fill="none" marker-end="url(#n03-arrow)"/>
  <path d="M 170 298 L 170 162" stroke="var(--da-muted)" stroke-width="1.5" fill="none" marker-end="url(#n03-arrow)"/>
  <text x="60" y="235" font-size="11" fill="var(--da-muted)">④ code</text>
  <text x="178" y="235" font-size="11" fill="var(--da-muted)">① 302</text>

  <!-- Arka kanal -->
  <path d="M 242 315 C 420 270, 600 230, 760 164" stroke="var(--da-success)" stroke-width="2" fill="none" marker-end="url(#n03-arrow-s)"/>
  <text x="470" y="262" text-anchor="middle" font-size="12" fill="var(--da-fg)">⑤ POST /token · code + code_verifier</text>
  <path d="M 840 164 C 860 230, 700 300, 300 300" stroke="var(--da-success)" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#n03-arrow-s)"/>
  <text x="560" y="292" text-anchor="middle" font-size="12" fill="var(--da-fg)">access · id · refresh</text>

  <path d="M 242 355 L 688 355" stroke="var(--da-primary)" stroke-width="2" fill="none" marker-end="url(#n03-arrow-p)"/>
  <text x="465" y="346" text-anchor="middle" font-size="12" fill="var(--da-fg)">⑥ Authorization: Bearer access_token</text>

  <g font-size="12" fill="var(--da-fg)">
    <text x="50" y="414"><tspan fill="var(--da-accent)" font-weight="600">ID token</tspan> → istemci (aud = client_id, "kim giriş yaptı?")</text>
    <text x="50" y="434"><tspan fill="var(--da-primary)" font-weight="600">Access token</tspan> → kaynak sunucusu (aud = API, "ne yapabilir?")</text>
    <text x="560" y="414" fill="var(--da-muted)">PKCE: challenge = SHA256(verifier)</text>
    <text x="560" y="434" fill="var(--da-muted)">çalınan kod, verifier olmadan işe yaramaz</text>
  </g>
</svg>
