<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">İstek katmanlarında OWASP riskleri ve savunmaları</title>
  <desc id="desc">Soldan sağa beş katman: tarayıcı, giriş uç noktası, uygulama, veri katmanı ve dış çağrılar. Her katmanın altında o katmandaki risk kırmızıyla, savunması yeşille yazılıdır: XSS ve CSRF karşısında CSP, kaçışlama ve SameSite; kaba kuvvet karşısında hız sınırı ve MFA; kırık erişim kontrolü ve güvensiz tasarım karşısında varsayılan ret ve tehdit modelleme; enjeksiyon karşısında parametreli sorgu; SSRF karşısında izin listesi.</desc>
  <defs>
    <marker id="n05-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted)"/>
    </marker>
  </defs>

  <text x="480" y="34" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg)">Güvenilmeyen veri her güven sınırında yeniden kontrol edilir</text>

  <!-- Katman kutuları -->
  <g text-anchor="middle">
    <rect x="20" y="60" width="168" height="80" rx="12" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
    <text x="104" y="96" font-size="14" font-weight="600" fill="var(--da-fg)">Tarayıcı</text>
    <text x="104" y="118" font-size="11" fill="var(--da-muted)">HTML · betik · çerez</text>

    <rect x="208" y="60" width="168" height="80" rx="12" fill="var(--da-accent)" fill-opacity="0.12" stroke="var(--da-accent)" stroke-width="2"/>
    <text x="292" y="96" font-size="14" font-weight="600" fill="var(--da-accent)">Giriş uç noktası</text>
    <text x="292" y="118" font-size="11" fill="var(--da-muted)">POST /login</text>

    <rect x="396" y="60" width="168" height="80" rx="12" fill="var(--da-primary)" fill-opacity="0.12" stroke="var(--da-primary)" stroke-width="2"/>
    <text x="480" y="96" font-size="14" font-weight="600" fill="var(--da-primary)">Uygulama</text>
    <text x="480" y="118" font-size="11" fill="var(--da-muted)">iş kuralları · yetki</text>

    <rect x="584" y="60" width="168" height="80" rx="12" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
    <text x="668" y="96" font-size="14" font-weight="600" fill="var(--da-fg)">Veri katmanı</text>
    <text x="668" y="118" font-size="11" fill="var(--da-muted)">SQL · kabuk · ORM</text>

    <rect x="772" y="60" width="168" height="80" rx="12" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
    <text x="856" y="96" font-size="14" font-weight="600" fill="var(--da-fg)">Dış çağrılar</text>
    <text x="856" y="118" font-size="11" fill="var(--da-muted)">webhook · önizleme</text>
  </g>
  <g stroke="var(--da-muted)" stroke-width="1.8" fill="none" marker-end="url(#n05-arrow)">
    <path d="M 188 100 L 206 100"/>
    <path d="M 376 100 L 394 100"/>
    <path d="M 564 100 L 582 100"/>
    <path d="M 752 100 L 770 100"/>
  </g>

  <!-- Risk satırı -->
  <text x="20" y="178" font-size="12" font-weight="600" fill="var(--da-danger)">RİSK</text>
  <g font-size="12" text-anchor="middle" fill="var(--da-fg)">
    <rect x="20" y="188" width="168" height="96" rx="10" fill="var(--da-danger)" fill-opacity="0.08" stroke="var(--da-danger)"/>
    <text x="104" y="214">XSS</text>
    <text x="104" y="234">CSRF</text>
    <text x="104" y="254" fill="var(--da-muted)">token sızıntısı</text>

    <rect x="208" y="188" width="168" height="96" rx="10" fill="var(--da-danger)" fill-opacity="0.08" stroke="var(--da-danger)"/>
    <text x="292" y="214">kaba kuvvet</text>
    <text x="292" y="234">kimlik bilgisi doldurma</text>
    <text x="292" y="254" fill="var(--da-muted)">hesap sorgulama</text>

    <rect x="396" y="188" width="168" height="96" rx="10" fill="var(--da-danger)" fill-opacity="0.08" stroke="var(--da-danger)"/>
    <text x="480" y="214">kırık erişim kontrolü</text>
    <text x="480" y="234">güvensiz tasarım</text>
    <text x="480" y="254" fill="var(--da-muted)">yanlış yapılandırma</text>

    <rect x="584" y="188" width="168" height="96" rx="10" fill="var(--da-danger)" fill-opacity="0.08" stroke="var(--da-danger)"/>
    <text x="668" y="214">SQL enjeksiyonu</text>
    <text x="668" y="234">komut enjeksiyonu</text>
    <text x="668" y="254" fill="var(--da-muted)">toplu atama</text>

    <rect x="772" y="188" width="168" height="96" rx="10" fill="var(--da-danger)" fill-opacity="0.08" stroke="var(--da-danger)"/>
    <text x="856" y="214">SSRF</text>
    <text x="856" y="234">meta veri uç noktası</text>
    <text x="856" y="254" fill="var(--da-muted)">açık yönlendirme</text>
  </g>

  <!-- Savunma satırı -->
  <text x="20" y="318" font-size="12" font-weight="600" fill="var(--da-success)">SAVUNMA</text>
  <g font-size="12" text-anchor="middle" fill="var(--da-fg)">
    <rect x="20" y="328" width="168" height="110" rx="10" fill="var(--da-success)" fill-opacity="0.08" stroke="var(--da-success)"/>
    <text x="104" y="354">kaçışlama + temizleme</text>
    <text x="104" y="374">CSP nonce</text>
    <text x="104" y="394">SameSite + Origin</text>
    <text x="104" y="414">HttpOnly çerez</text>

    <rect x="208" y="328" width="168" height="110" rx="10" fill="var(--da-success)" fill-opacity="0.08" stroke="var(--da-success)"/>
    <text x="292" y="354">IP + hesap hız sınırı</text>
    <text x="292" y="374">artan bekleme</text>
    <text x="292" y="394">genel hata · eşit süre</text>
    <text x="292" y="414">MFA</text>

    <rect x="396" y="328" width="168" height="110" rx="10" fill="var(--da-success)" fill-opacity="0.08" stroke="var(--da-success)"/>
    <text x="480" y="354">varsayılan ret</text>
    <text x="480" y="374">sahiplik sorguda</text>
    <text x="480" y="394">tehdit modelleme</text>
    <text x="480" y="414">güvenli varsayılanlar</text>

    <rect x="584" y="328" width="168" height="110" rx="10" fill="var(--da-success)" fill-opacity="0.08" stroke="var(--da-success)"/>
    <text x="668" y="354">parametreli sorgu</text>
    <text x="668" y="374">izin listesi (sütun)</text>
    <text x="668" y="394">şema doğrulama</text>
    <text x="668" y="414">kabuksuz API</text>

    <rect x="772" y="328" width="168" height="110" rx="10" fill="var(--da-success)" fill-opacity="0.08" stroke="var(--da-success)"/>
    <text x="856" y="354">hedef izin listesi</text>
    <text x="856" y="374">özel IP reddi</text>
    <text x="856" y="394">yönlendirme yok</text>
    <text x="856" y="414">ayrı çıkış katmanı</text>
  </g>

  <text x="480" y="462" text-anchor="middle" font-size="12" fill="var(--da-muted)">Tüm katmanlar boyunca: bağımlılık taraması · güvenlik olaylarını loglama ve alarm · gizli bilgileri loglamama</text>
</svg>
