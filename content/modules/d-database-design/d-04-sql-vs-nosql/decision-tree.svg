<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Veritabanı seçimi karar ağacı</title>
  <desc id="desc">Kökten başlayan karar ağacı: veri zaman damgalı ölçüm mü? evetse time-series. İlişkinin kendisi sorgulanıyor mu, çok atlama var mı? evetse graph. Çok tablolu ACID transaction ve ad-hoc sorgu gerekiyor mu? evetse ilişkisel. Yalnızca anahtarla erişim ve mikrosaniye gecikme mi? evetse key-value. Birlikte okunan iç içe veri ve esnek alanlar mı? evetse document. Saniyede yüz binlerce yazma, zaman sıralı akış, çok bölge mi? evetse wide-column; değilse yine ilişkisel.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- Karar düğümü stili: yuvarlak dikdörtgen; sonuç: dolu renkli -->
  <!-- Q1 -->
  <rect x="330" y="20" width="300" height="46" rx="23" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="480" y="48" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">Veri zaman damgalı ölçüm/olay akışı mı?</text>
  <!-- TS sonucu -->
  <rect x="740" y="20" width="190" height="46" rx="10" fill="var(--da-success, #10b981)" opacity="0.18" stroke="var(--da-success, #10b981)"/>
  <text x="835" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Time-series</text>
  <text x="835" y="56" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">TimescaleDB · InfluxDB · ClickHouse</text>

  <!-- Q2 -->
  <rect x="330" y="110" width="300" height="46" rx="23" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="480" y="131" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">Asıl sorgu ilişkinin kendisi mi?</text>
  <text x="480" y="146" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">(kim kimi, 2+ atlama, yol bulma)</text>
  <rect x="740" y="110" width="190" height="46" rx="10" fill="var(--da-success, #10b981)" opacity="0.18" stroke="var(--da-success, #10b981)"/>
  <text x="835" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Graph</text>
  <text x="835" y="146" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">Neo4j · Neptune</text>

  <!-- Q3 -->
  <rect x="330" y="200" width="300" height="46" rx="23" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="480" y="221" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">Çok tablolu ACID transaction ya da</text>
  <text x="480" y="236" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">ad-hoc sorgu / raporlama gerekiyor mu?</text>
  <rect x="740" y="200" width="190" height="46" rx="10" fill="var(--da-primary, #6366f1)" opacity="0.18" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
  <text x="835" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">İlişkisel (varsayılan)</text>
  <text x="835" y="236" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">PostgreSQL · MySQL · Aurora</text>

  <!-- Q4 -->
  <rect x="330" y="290" width="300" height="46" rx="23" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="480" y="311" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">Yalnızca anahtarla erişim,</text>
  <text x="480" y="326" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">mikrosaniye gecikme, TTL?</text>
  <rect x="740" y="290" width="190" height="46" rx="10" fill="var(--da-success, #10b981)" opacity="0.18" stroke="var(--da-success, #10b981)"/>
  <text x="835" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Key-value</text>
  <text x="835" y="326" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">Redis · DynamoDB · Memcached</text>

  <!-- Q5 -->
  <rect x="330" y="380" width="300" height="46" rx="23" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="480" y="401" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">Birlikte okunan iç içe veri,</text>
  <text x="480" y="416" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">kayıt başına değişen alanlar?</text>
  <rect x="740" y="380" width="190" height="46" rx="10" fill="var(--da-success, #10b981)" opacity="0.18" stroke="var(--da-success, #10b981)"/>
  <text x="835" y="400" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Document</text>
  <text x="835" y="416" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">MongoDB · Firestore · Couchbase</text>

  <!-- Q6 -->
  <rect x="330" y="470" width="300" height="46" rx="23" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="480" y="491" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">Saniyede 100k+ yazma, zaman sıralı akış,</text>
  <text x="480" y="506" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">çok bölgeli aktif-aktif?</text>
  <rect x="740" y="470" width="190" height="46" rx="10" fill="var(--da-success, #10b981)" opacity="0.18" stroke="var(--da-success, #10b981)"/>
  <text x="835" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Wide-column</text>
  <text x="835" y="506" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">Cassandra · ScyllaDB · Bigtable</text>

  <!-- Hayır dalı sonu: ilişkisel -->
  <rect x="40" y="470" width="220" height="46" rx="10" fill="var(--da-primary, #6366f1)" opacity="0.18" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
  <text x="150" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Yine ilişkisel</text>
  <text x="150" y="506" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">+ JSONB sütunu, read replica, partition</text>

  <!-- Oklar: evet (sağa), hayır (aşağı) -->
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M 630 43 L 740 43"/>
    <path d="M 630 133 L 740 133"/>
    <path d="M 630 223 L 740 223"/>
    <path d="M 630 313 L 740 313"/>
    <path d="M 630 403 L 740 403"/>
    <path d="M 630 493 L 740 493"/>
    <path d="M 480 66 L 480 110"/>
    <path d="M 480 156 L 480 200"/>
    <path d="M 480 246 L 480 290"/>
    <path d="M 480 336 L 480 380"/>
    <path d="M 480 426 L 480 470"/>
    <path d="M 330 493 L 260 493"/>
  </g>
  <g font-size="10" fill="var(--da-success, #10b981)" font-weight="600">
    <text x="672" y="37">evet</text>
    <text x="672" y="127">evet</text>
    <text x="672" y="217">evet</text>
    <text x="672" y="307">evet</text>
    <text x="672" y="397">evet</text>
    <text x="672" y="487">evet</text>
  </g>
  <g font-size="10" fill="var(--da-danger, #ef4444)" font-weight="600">
    <text x="488" y="92">hayır</text>
    <text x="488" y="182">hayır</text>
    <text x="488" y="272">hayır</text>
    <text x="488" y="362">hayır</text>
    <text x="488" y="452">hayır</text>
    <text x="280" y="487">hayır</text>
  </g>

  <!-- Sol not -->
  <rect x="40" y="20" width="240" height="120" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="5 5"/>
  <text x="52" y="42" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Nasıl kullanılır?</text>
  <g font-size="10" fill="var(--da-muted, #64748b)">
    <text x="52" y="62">Her soru bir erişim deseni sorusudur.</text>
    <text x="52" y="78">Cevap "bilmiyorum" ise aşağı inin:</text>
    <text x="52" y="94">varsayılan ilişkiseldir.</text>
    <text x="52" y="116">Birden fazla "evet" → polyglot:</text>
    <text x="52" y="130">doğruluk kaynağı + özel depo(lar).</text>
  </g>
  <rect x="40" y="200" width="240" height="90" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="5 5"/>
  <text x="52" y="222" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Ayrılmak için ölçülmüş gerekçe</text>
  <g font-size="10" fill="var(--da-muted, #64748b)">
    <text x="52" y="242">· yazma hacmi (QPS) ve veri boyutu</text>
    <text x="52" y="258">· gecikme hedefi (p99)</text>
    <text x="52" y="274">· bölge sayısı ve tutarlılık ihtiyacı</text>
  </g>
</svg>
