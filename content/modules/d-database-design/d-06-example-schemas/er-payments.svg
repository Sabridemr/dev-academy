<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Ödeme sistemi ER diyagramı</title>
  <desc id="desc">Tablolar: accounts, transfers, ledger_entries, payment_intents, idempotency_keys, webhooks_inbox. Her transfer, ledger_entries tablosuna biri borç biri alacak iki satır ekler; ledger_entries yalnızca eklenir. transfers idempotency_key ile tekilleştirilir; webhooks_inbox sağlayıcıdan gelen olayları provider_event_id ile bir kez işler. Bakiye account_balances görünümüyle defterden türetilir.</desc>
  <defs>
    <marker id="many" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M 2 2 L 18 10 L 2 18 M 2 10 L 18 10" fill="none" stroke="var(--da-primary, #6366f1)" stroke-width="1.6"/>
    </marker>
    <marker id="one" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M 12 2 L 12 18 M 2 10 L 18 10" fill="none" stroke="var(--da-primary, #6366f1)" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- accounts -->
  <rect x="40" y="60" width="200" height="108" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="40" y="60" width="200" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="140" y="78" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">accounts</text>
  <text x="50" y="104" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> id</text>
  <text x="50" y="120" fill="var(--da-fg, #0f172a)" font-size="11px">owner_id, currency char(3)</text>
  <text x="50" y="136" fill="var(--da-fg, #0f172a)" font-size="11px">kind (user, merchant, fees, settlement)</text>
  <text x="50" y="152" fill="var(--da-fg, #0f172a)" font-size="11px">status (active, frozen)</text>

  <!-- payment_intents -->
  <rect x="40" y="240" width="200" height="124" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="40" y="240" width="200" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="140" y="258" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">payment_intents</text>
  <text x="50" y="284" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> id (pi_…)</text>
  <text x="50" y="300" fill="var(--da-fg, #0f172a)" font-size="11px">customer_id, amount_cents, currency</text>
  <text x="50" y="316" fill="var(--da-fg, #0f172a)" font-size="11px">status (requires_payment →</text>
  <text x="50" y="332" fill="var(--da-fg, #0f172a)" font-size="11px">  processing → succeeded / failed)</text>
  <text x="50" y="348" fill="var(--da-fg, #0f172a)" font-size="11px">provider_ref, created_at</text>

  <!-- idempotency_keys -->
  <rect x="40" y="410" width="200" height="92" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="40" y="410" width="200" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="140" y="428" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">idempotency_keys</text>
  <text x="50" y="454" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> (customer_id, key)</text>
  <text x="50" y="470" fill="var(--da-fg, #0f172a)" font-size="11px">response_code, response_body</text>
  <text x="50" y="486" fill="var(--da-fg, #0f172a)" font-size="11px">expires_at (24 s)</text>

  <!-- transfers -->
  <rect x="380" y="60" width="210" height="140" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="380" y="60" width="210" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="485" y="78" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">transfers</text>
  <text x="390" y="104" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> id uuid (istemci üretir)</text>
  <text x="390" y="120" fill="var(--da-fg, #0f172a)" font-size="11px">idempotency_key UNIQUE</text>
  <text x="390" y="136" fill="var(--da-fg, #0f172a)" font-size="11px">amount_cents bigint &gt; 0, currency</text>
  <text x="390" y="152" fill="var(--da-fg, #0f172a)" font-size="11px">status (pending → posted /</text>
  <text x="390" y="168" fill="var(--da-fg, #0f172a)" font-size="11px">  failed → reversed)</text>
  <text x="390" y="184" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> payment_intent_id (opsiyonel)</text>

  <!-- ledger_entries -->
  <rect x="380" y="260" width="210" height="140" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="380" y="260" width="210" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="485" y="278" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">ledger_entries  (append-only)</text>
  <text x="390" y="304" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> id bigint identity</text>
  <text x="390" y="320" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> transfer_id</text>
  <text x="390" y="336" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> account_id</text>
  <text x="390" y="352" fill="var(--da-fg, #0f172a)" font-size="11px">direction (debit, credit)</text>
  <text x="390" y="368" fill="var(--da-fg, #0f172a)" font-size="11px">amount_cents &gt; 0, created_at</text>
  <text x="390" y="384" fill="var(--da-fg, #0f172a)" font-size="11px">IDX (account_id, created_at DESC)</text>

  <!-- webhooks_inbox -->
  <rect x="730" y="60" width="200" height="108" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="730" y="60" width="200" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="830" y="78" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">webhooks_inbox</text>
  <text x="740" y="104" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> provider_event_id</text>
  <text x="740" y="120" fill="var(--da-fg, #0f172a)" font-size="11px">event_type, payload jsonb</text>
  <text x="740" y="136" fill="var(--da-fg, #0f172a)" font-size="11px">received_at, processed_at</text>
  <text x="740" y="152" fill="var(--da-fg, #0f172a)" font-size="11px">en az bir kez gelir, bir kez işlenir</text>

  <!-- account_balances view -->
  <rect x="730" y="260" width="200" height="108" rx="8" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="5 4"/>
  <text x="830" y="278" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">account_balances (VIEW)</text>
  <text x="740" y="304" fill="var(--da-fg, #0f172a)" font-size="11px">account_id</text>
  <text x="740" y="320" fill="var(--da-fg, #0f172a)" font-size="11px">balance_cents = Σ credit − Σ debit</text>
  <text x="740" y="336" fill="var(--da-fg, #0f172a)" font-size="11px">türetilmiş; sık okuma için</text>
  <text x="740" y="352" fill="var(--da-fg, #0f172a)" font-size="11px">günlük snapshot + delta</text>

  <!-- Örnek çift kayıt -->
  <rect x="380" y="430" width="550" height="72" rx="8" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="390" y="450" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">Örnek: 100,00 TRY ödeme, %2 komisyon → bir transfer, üç defter satırı</text>
  <text x="390" y="470" font-family="monospace" fill="var(--da-fg, #0f172a)" font-size="11px">debit   user:ayse        10000</text>
  <text x="390" y="486" font-family="monospace" fill="var(--da-fg, #0f172a)" font-size="11px">credit  merchant:kitapci  9800   credit  fees:platform  200   → toplam 0</text>

  <!-- İlişkiler -->
  <path d="M 240 114 C 300 114, 320 330, 380 330" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 485 200 L 485 260" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 240 300 C 300 300, 320 170, 380 170" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 140 364 L 140 410" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 730 130 C 680 130, 660 300, 730 300" stroke-dasharray="4 3" marker-start="url(#one)" marker-end="url(#one)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 590 330 L 730 330" stroke-dasharray="4 3" marker-start="url(#many)" marker-end="url(#one)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>

  <text x="290" y="222" fill="var(--da-muted, #64748b)" font-size="10px">posted to 1:N</text>
  <text x="495" y="236" fill="var(--da-muted, #64748b)" font-size="10px">2+ satır / transfer</text>
  <text x="290" y="190" fill="var(--da-muted, #64748b)" font-size="10px">settles 1:N</text>
  <text x="150" y="392" fill="var(--da-muted, #64748b)" font-size="10px">dedupes</text>
  <text x="640" y="322" fill="var(--da-muted, #64748b)" font-size="10px">SUM</text>
  <text x="650" y="218" fill="var(--da-muted, #64748b)" font-size="10px">webhook → intent güncelle</text>

  <text x="480" y="516" text-anchor="middle" fill="var(--da-muted, #64748b)" font-size="10px">Kural: ledger_entries üzerinde UPDATE/DELETE yetkisi yoktur; düzeltme = ters kayıt. Her transfer için debit toplamı = credit toplamı.</text>
</svg>
