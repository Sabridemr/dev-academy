<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Mesajlaşma ER diyagramı</title>
  <desc id="desc">Tablolar: users, conversations, participants, messages, message_receipts (opsiyonel), attachments. Bir konuşmanın çok katılımcısı ve çok mesajı vardır; mesajlar conversation_id ve konuşma içi seq ile anahtarlanır. Okundu bilgisi participants tablosunda last_read_seq olarak tutulur; message_receipts yalnızca grup sohbetlerinde kişi bazlı okundu listesi gerekiyorsa kullanılır. attachments mesajın dosyalarını nesne depolamadaki URL ile tutar.</desc>
  <defs>
    <marker id="many" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M 2 2 L 18 10 L 2 18 M 2 10 L 18 10" fill="none" stroke="var(--da-primary, #6366f1)" stroke-width="1.6"/>
    </marker>
    <marker id="one" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M 12 2 L 12 18 M 2 10 L 18 10" fill="none" stroke="var(--da-primary, #6366f1)" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- users -->
  <rect x="40" y="60" width="190" height="92" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="40" y="60" width="190" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="135" y="78" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">users</text>
  <text x="50" y="104" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> id</text>
  <text x="50" y="120" fill="var(--da-fg, #0f172a)" font-size="11px">phone / handle UNIQUE</text>
  <text x="50" y="136" fill="var(--da-fg, #0f172a)" font-size="11px">public_key (E2EE), last_seen_at</text>

  <!-- conversations -->
  <rect x="380" y="60" width="210" height="108" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="380" y="60" width="210" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="485" y="78" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">conversations</text>
  <text x="390" y="104" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> id</text>
  <text x="390" y="120" fill="var(--da-fg, #0f172a)" font-size="11px">kind (direct, group), title</text>
  <text x="390" y="136" fill="var(--da-fg, #0f172a)" font-size="11px">last_seq bigint  (atomik sayaç)</text>
  <text x="390" y="152" fill="var(--da-fg, #0f172a)" font-size="11px">created_at</text>

  <!-- participants -->
  <rect x="40" y="240" width="190" height="124" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="40" y="240" width="190" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="135" y="258" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">participants</text>
  <text x="50" y="284" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> <tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> conversation_id</text>
  <text x="50" y="300" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> <tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> user_id</text>
  <text x="50" y="316" fill="var(--da-fg, #0f172a)" font-size="11px">role (member, admin)</text>
  <text x="50" y="332" fill="var(--da-fg, #0f172a)" font-size="11px">last_read_seq  (okundu işareti)</text>
  <text x="50" y="348" fill="var(--da-fg, #0f172a)" font-size="11px">muted_until, joined_at</text>

  <!-- messages -->
  <rect x="380" y="240" width="210" height="156" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="380" y="240" width="210" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="485" y="258" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">messages</text>
  <text x="390" y="284" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> <tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> conversation_id</text>
  <text x="390" y="300" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> seq bigint  (konuşma içi sıra)</text>
  <text x="390" y="316" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> sender_id</text>
  <text x="390" y="332" fill="var(--da-fg, #0f172a)" font-size="11px">body text / ciphertext bytea</text>
  <text x="390" y="348" fill="var(--da-fg, #0f172a)" font-size="11px">sent_at (bilgi, sıra değil)</text>
  <text x="390" y="364" fill="var(--da-fg, #0f172a)" font-size="11px">deleted_at, edited_at</text>
  <text x="390" y="380" fill="var(--da-fg, #0f172a)" font-size="11px">PARTITION BY HASH (conversation_id)</text>

  <!-- attachments -->
  <rect x="730" y="240" width="200" height="108" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="730" y="240" width="200" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="830" y="258" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">attachments</text>
  <text x="740" y="284" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> id</text>
  <text x="740" y="300" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> (conversation_id, seq)</text>
  <text x="740" y="316" fill="var(--da-fg, #0f172a)" font-size="11px">object_url (S3), mime, size</text>
  <text x="740" y="332" fill="var(--da-fg, #0f172a)" font-size="11px">thumbnail_url</text>

  <!-- message_receipts (opsiyonel) -->
  <rect x="730" y="60" width="200" height="108" rx="8" stroke-dasharray="5 4" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="730" y="60" width="200" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="830" y="78" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">message_receipts (ops.)</text>
  <text x="740" y="104" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> (conversation_id, seq, user_id)</text>
  <text x="740" y="120" fill="var(--da-fg, #0f172a)" font-size="11px">delivered_at, read_at</text>
  <text x="740" y="136" fill="var(--da-fg, #0f172a)" font-size="11px">yalnızca grup "kim okudu" listesi</text>
  <text x="740" y="152" fill="var(--da-fg, #0f172a)" font-size="11px">mesaj × katılımcı satır → pahalı</text>

  <!-- İlişkiler -->
  <path d="M 135 152 L 135 240" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 380 130 C 300 130, 280 300, 230 300" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 485 168 L 485 240" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 230 100 L 380 100" stroke-dasharray="4 3" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 590 300 L 730 300" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 590 270 C 650 270, 660 120, 730 120" stroke-dasharray="4 3" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>

  <text x="145" y="200" fill="var(--da-muted, #64748b)" font-size="10px">member of 1:N</text>
  <text x="250" y="236" fill="var(--da-muted, #64748b)" font-size="10px">has 1:N</text>
  <text x="495" y="208" fill="var(--da-muted, #64748b)" font-size="10px">contains 1:N (seq ↑)</text>
  <text x="270" y="92" fill="var(--da-muted, #64748b)" font-size="10px">sender</text>
  <text x="640" y="292" fill="var(--da-muted, #64748b)" font-size="10px">0..N files</text>
  <text x="640" y="190" fill="var(--da-muted, #64748b)" font-size="10px">per-user receipts</text>

  <!-- Alt notlar -->
  <rect x="40" y="420" width="890" height="64" rx="8" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="52" y="440" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">seq üretimi:</tspan> UPDATE conversations SET last_seq = last_seq + 1 WHERE id = $1 RETURNING last_seq  →  INSERT messages (…, seq)</text>
  <text x="52" y="458" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">okunmamış:</tspan> conversations.last_seq − participants.last_read_seq  (COUNT yok, tablo taraması yok)</text>
  <text x="52" y="476" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">ölçek:</tspan> messages → Cassandra: PRIMARY KEY ((conversation_id), seq) WITH CLUSTERING ORDER BY (seq DESC); son 50 mesaj = tek partition okuması</text>
</svg>
