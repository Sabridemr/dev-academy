<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Sosyal medya ER diyagramı</title>
  <desc id="desc">Tablolar: users, follows, posts, likes, comments, feed_items. follows tablosu users ile users arasındaki çoka-çok takip ilişkisini çözer. Bir kullanıcının çok gönderisi, bir gönderinin çok beğenisi ve yorumu vardır. feed_items her kullanıcı için önceden hesaplanmış akış satırlarını tutar. users ve posts tablolarında denormalize sayaçlar bulunur.</desc>
  <defs>
    <marker id="many" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M 2 2 L 18 10 L 2 18 M 2 10 L 18 10" fill="none" stroke="var(--da-primary, #6366f1)" stroke-width="1.6"/>
    </marker>
    <marker id="one" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M 12 2 L 12 18 M 2 10 L 18 10" fill="none" stroke="var(--da-primary, #6366f1)" stroke-width="1.6"/>
    </marker>
  </defs>

  <!-- users -->
  <rect x="40" y="60" width="200" height="140" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="40" y="60" width="200" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="140" y="78" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">users</text>
  <text x="50" y="104" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> id bigint (Snowflake)</text>
  <text x="50" y="120" fill="var(--da-fg, #0f172a)" font-size="11px">handle citext UNIQUE</text>
  <text x="50" y="136" fill="var(--da-fg, #0f172a)" font-size="11px">display_name, bio, avatar_url</text>
  <text x="50" y="152" fill="var(--da-success, #10b981)" font-size="11px">follower_count  (denormalize)</text>
  <text x="50" y="168" fill="var(--da-success, #10b981)" font-size="11px">following_count (denormalize)</text>
  <text x="50" y="184" fill="var(--da-fg, #0f172a)" font-size="11px">created_at</text>

  <!-- follows -->
  <rect x="40" y="280" width="200" height="108" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="40" y="280" width="200" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="140" y="298" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">follows</text>
  <text x="50" y="324" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> <tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> follower_id</text>
  <text x="50" y="340" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> <tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> followee_id</text>
  <text x="50" y="356" fill="var(--da-fg, #0f172a)" font-size="11px">created_at</text>
  <text x="50" y="372" fill="var(--da-fg, #0f172a)" font-size="11px">IDX (followee_id, created_at)</text>

  <!-- posts -->
  <rect x="380" y="60" width="210" height="156" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="380" y="60" width="210" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="485" y="78" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">posts</text>
  <text x="390" y="104" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> id bigint (Snowflake)</text>
  <text x="390" y="120" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> author_id</text>
  <text x="390" y="136" fill="var(--da-fg, #0f172a)" font-size="11px">body text (≤ 500), media jsonb</text>
  <text x="390" y="152" fill="var(--da-success, #10b981)" font-size="11px">like_count, reply_count</text>
  <text x="390" y="168" fill="var(--da-fg, #0f172a)" font-size="11px">deleted_at (soft delete)</text>
  <text x="390" y="184" fill="var(--da-fg, #0f172a)" font-size="11px">created_at</text>
  <text x="390" y="200" fill="var(--da-fg, #0f172a)" font-size="11px">IDX (author_id, created_at DESC)</text>

  <!-- likes -->
  <rect x="380" y="280" width="210" height="92" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="380" y="280" width="210" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="485" y="298" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">likes</text>
  <text x="390" y="324" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> <tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> post_id</text>
  <text x="390" y="340" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> <tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> user_id</text>
  <text x="390" y="356" fill="var(--da-fg, #0f172a)" font-size="11px">created_at</text>

  <!-- comments -->
  <rect x="380" y="410" width="210" height="92" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="380" y="410" width="210" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="485" y="428" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">comments</text>
  <text x="390" y="454" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> id</text>
  <text x="390" y="470" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> post_id, <tspan fill="var(--da-accent, #f59e0b)" font-weight="600">FK</tspan> author_id</text>
  <text x="390" y="486" fill="var(--da-fg, #0f172a)" font-size="11px">body, parent_id (thread), created_at</text>

  <!-- feed_items -->
  <rect x="730" y="60" width="210" height="124" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/><rect x="730" y="60" width="210" height="26" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.14"/>
  <text x="835" y="78" text-anchor="middle" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">feed_items</text>
  <text x="740" y="104" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> user_id  (akış sahibi)</text>
  <text x="740" y="120" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> created_at DESC</text>
  <text x="740" y="136" fill="var(--da-fg, #0f172a)" font-size="11px"><tspan font-weight="600">PK</tspan> post_id</text>
  <text x="740" y="152" fill="var(--da-fg, #0f172a)" font-size="11px">fan-out on write ile doldurulur</text>
  <text x="740" y="168" fill="var(--da-fg, #0f172a)" font-size="11px">Redis/Cassandra'ya taşınabilir</text>

  <!-- not kutusu -->
  <rect x="730" y="280" width="210" height="150" rx="8" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="4 4"/>
  <text x="740" y="300" fill="var(--da-fg, #0f172a)" font-size="13px" font-weight="600">Tasarım kararları</text>
  <text x="740" y="320" fill="var(--da-muted, #64748b)" font-size="10px">· sayaçlar yazmayla aynı tx'te ya da</text>
  <text x="740" y="334" fill="var(--da-muted, #64748b)" font-size="10px">  olayla güncellenir; gece yeniden sayım</text>
  <text x="740" y="354" fill="var(--da-muted, #64748b)" font-size="10px">· ünlü hesaplar: fan-out on read</text>
  <text x="740" y="374" fill="var(--da-muted, #64748b)" font-size="10px">· soft delete: akış referansı kırılmaz</text>
  <text x="740" y="394" fill="var(--da-muted, #64748b)" font-size="10px">· shard key: user_id (profil = tek shard)</text>
  <text x="740" y="414" fill="var(--da-muted, #64748b)" font-size="10px">· likes milyarlarca satır → Cassandra</text>

  <!-- İlişkiler -->
  <path d="M 100 200 L 100 280" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 180 200 L 180 280" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 240 110 L 380 110" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 485 216 L 485 280" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 540 216 C 560 300, 600 380, 560 410" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 240 150 C 300 150, 320 330, 380 330" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 590 120 L 730 120" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>
  <path d="M 240 90 C 320 20, 700 20, 760 60" marker-start="url(#one)" marker-end="url(#many)" stroke="var(--da-primary, #6366f1)" stroke-width="1.6" fill="none"/>

  <text x="60" y="250" fill="var(--da-muted, #64748b)" font-size="10px">follower</text>
  <text x="190" y="250" fill="var(--da-muted, #64748b)" font-size="10px">followee</text>
  <text x="290" y="102" fill="var(--da-muted, #64748b)" font-size="10px">authors 1:N</text>
  <text x="495" y="252" fill="var(--da-muted, #64748b)" font-size="10px">liked 1:N</text>
  <text x="600" y="330" fill="var(--da-muted, #64748b)" font-size="10px">commented 1:N</text>
  <text x="290" y="320" fill="var(--da-muted, #64748b)" font-size="10px">user likes N</text>
  <text x="640" y="112" fill="var(--da-muted, #64748b)" font-size="10px">appears in</text>
  <text x="450" y="34" fill="var(--da-muted, #64748b)" font-size="10px">owner's feed 1:N</text>

  <text x="480" y="512" text-anchor="middle" fill="var(--da-muted, #64748b)" font-size="10px">follows = users × users (N:M) ara tablosu; iki yönlü sorgu için PK (follower, followee) + ikincil indeks (followee). Sayaçlar bilinçli denormalizasyondur.</text>
</svg>
