<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">B-tree indeks yapısı ve composite indeks önek kuralı</title>
  <desc id="desc">Üstte üç seviyeli bir B-tree: kök sayfa, üç iç düğüm ve birbirine bağlı yaprak sayfalar; bir yaprak girdisi altta heap tablosundaki satıra işaret eder. Sağda (customer_id, status, created_at) composite indeksi için hangi sorgu önekinin kullanılabildiğini gösteren küçük bir tablo vardır.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
  </defs>

  <text x="300" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-fg, #0f172a)">B-tree indeks: orders(customer_id)</text>

  <!-- Kök -->
  <rect x="200" y="50" width="200" height="40" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.15" stroke="var(--da-primary, #6366f1)" stroke-width="1.5"/>
  <text x="300" y="75" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">3000  ·  6000</text>
  <text x="420" y="75" font-size="11" fill="var(--da-muted, #64748b)">kök (seviye 0)</text>

  <!-- İç düğümler -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3">
    <rect x="60" y="140" width="140" height="36" rx="8"/>
    <rect x="230" y="140" width="140" height="36" rx="8"/>
    <rect x="400" y="140" width="140" height="36" rx="8"/>
  </g>
  <g font-size="12" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="130" y="163">1000 · 2000</text>
    <text x="300" y="163">3750 · 4500 · 5250</text>
    <text x="470" y="163">7000 · 8500</text>
  </g>
  <text x="556" y="163" font-size="11" fill="var(--da-muted, #64748b)">iç düğümler</text>

  <!-- Yapraklar -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3">
    <rect x="30" y="230" width="120" height="44" rx="8"/>
    <rect x="165" y="230" width="120" height="44" rx="8"/>
    <rect x="300" y="230" width="120" height="44" rx="8" stroke="var(--da-success, #10b981)" stroke-width="2"/>
    <rect x="435" y="230" width="120" height="44" rx="8"/>
  </g>
  <g font-size="11" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="90" y="248">3000 … 3749</text>
    <text x="225" y="248">3750 … 4499</text>
    <text x="360" y="248">4500 … 5249</text>
    <text x="495" y="248">5250 … 5999</text>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="90" y="264">anahtar → TID</text>
    <text x="225" y="264">anahtar → TID</text>
    <text x="360" y="264" fill="var(--da-success, #10b981)">4821 → (812, 4)</text>
    <text x="495" y="264">anahtar → TID</text>
  </g>
  <text x="570" y="252" font-size="11" fill="var(--da-muted, #64748b)">yapraklar (bağlı liste)</text>

  <!-- Ağaç okları -->
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <path d="M 240 90 L 140 140"/>
    <path d="M 300 90 L 300 140"/>
    <path d="M 360 90 L 460 140"/>
    <path d="M 260 176 L 100 230"/>
    <path d="M 285 176 L 230 230"/>
    <path d="M 315 176 L 355 230" stroke="var(--da-success, #10b981)" stroke-width="2"/>
    <path d="M 340 176 L 480 230"/>
  </g>
  <!-- Yaprak zinciri -->
  <g stroke="var(--da-accent, #f59e0b)" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)">
    <path d="M 150 252 L 165 252"/>
    <path d="M 285 252 L 300 252"/>
    <path d="M 420 252 L 435 252"/>
  </g>

  <!-- Heap -->
  <rect x="30" y="330" width="525" height="70" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="42" y="350" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">orders heap (tablo dosyası, 9.346 sayfa)</text>
  <g font-size="11" fill="var(--da-muted, #64748b)">
    <text x="42" y="372">sayfa 0</text>
    <text x="120" y="372">sayfa 1</text>
    <text x="200" y="372">…</text>
    <text x="300" y="372" fill="var(--da-success, #10b981)" font-weight="600">sayfa 812: slot 4 → {id: 90817, customer_id: 4821, status: 'paid'}</text>
    <text x="42" y="390">İndeks yaprağındaki TID doğrudan bu sayfaya götürür; sıralı tarama 9.346 sayfanın hepsini okurdu.</text>
  </g>
  <path d="M 360 274 L 360 330" stroke="var(--da-success, #10b981)" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Composite önek tablosu -->
  <rect x="600" y="50" width="280" height="350" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="740" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">Composite indeks önek kuralı</text>
  <text x="740" y="94" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">INDEX ON orders (customer_id, status, created_at)</text>
  <line x1="612" y1="106" x2="868" y2="106" stroke="var(--da-border, #cbd5e1)"/>
  <g font-size="11" fill="var(--da-fg, #0f172a)">
    <text x="612" y="130">WHERE customer_id = 7</text>
    <text x="612" y="160">… AND status = 'paid'</text>
    <text x="612" y="190">… AND status = 'paid' AND created_at &gt; t</text>
    <text x="612" y="220">customer_id = 7 AND created_at &gt; t</text>
    <text x="612" y="250">WHERE status = 'paid'</text>
    <text x="612" y="280">WHERE created_at &gt; t</text>
  </g>
  <g font-size="12" font-weight="600" text-anchor="end">
    <text x="866" y="130" fill="var(--da-success, #10b981)">✓</text>
    <text x="866" y="160" fill="var(--da-success, #10b981)">✓</text>
    <text x="866" y="190" fill="var(--da-success, #10b981)">✓ tam</text>
    <text x="866" y="220" fill="var(--da-accent, #f59e0b)">kısmi</text>
    <text x="866" y="250" fill="var(--da-danger, #ef4444)">✗</text>
    <text x="866" y="280" fill="var(--da-danger, #ef4444)">✗</text>
  </g>
  <line x1="612" y1="296" x2="868" y2="296" stroke="var(--da-border, #cbd5e1)"/>
  <g font-size="11" fill="var(--da-muted, #64748b)">
    <text x="612" y="318">Sıralama: eşitlik sütunları önce,</text>
    <text x="612" y="334">aralık sütunu en sonda.</text>
    <text x="612" y="358">Aralıktan sonraki sütunlar artık</text>
    <text x="612" y="374">sıralı değildir; yalnızca filtre olur.</text>
  </g>

  <text x="450" y="470" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Arama yolu: kök → iç düğüm → yaprak → heap = 3–4 sayfa okuma; tablo 1000 kat büyüse ağaç bir seviye daha derinleşir.</text>
</svg>
