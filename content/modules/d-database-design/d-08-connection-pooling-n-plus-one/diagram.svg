<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">N+1 deseni ve bağlantı havuzu</title>
  <desc id="desc">Solda N+1: uygulamadan veritabanına bir liste sorgusu ve ardından her satır için bir sorgu, toplam 1+N gidiş-dönüş. Sağda aynı veri: include ile iki sorgu (IN) ya da JOIN ile tek sorgu. Altta beş bağlantılı havuzun tamamı dolu, üç istek kuyrukta bekliyor.</desc>
  <defs>
    <marker id="d08-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- Sol: N+1 -->
  <rect x="20" y="20" width="420" height="250" rx="14" fill="var(--da-surface, #f8fafc)" stroke="var(--da-danger, #ef4444)"/>
  <text x="40" y="48" font-size="15" font-weight="600" fill="var(--da-danger, #ef4444)">N+1: 1 + N gidiş-dönüş</text>
  <rect x="45" y="70" width="90" height="180" rx="10" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="90" y="165" font-size="13" text-anchor="middle" fill="var(--da-fg, #0f172a)">API</text>
  <rect x="320" y="70" width="100" height="180" rx="10" fill="none" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="370" y="165" font-size="13" text-anchor="middle" fill="var(--da-fg, #0f172a)">PostgreSQL</text>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.4" marker-end="url(#d08-arrow)">
    <line x1="135" y1="90" x2="318" y2="90" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
    <line x1="135" y1="122" x2="318" y2="122"/>
    <line x1="135" y1="148" x2="318" y2="148"/>
    <line x1="135" y1="174" x2="318" y2="174"/>
    <line x1="135" y1="200" x2="318" y2="200"/>
    <line x1="135" y1="234" x2="318" y2="234"/>
  </g>
  <g font-size="11" fill="var(--da-fg, #0f172a)">
    <text x="150" y="84">1 · SELECT lessons</text>
    <text x="150" y="116">progress WHERE lessonId = 'd-01'</text>
    <text x="150" y="142">progress WHERE lessonId = 'd-02'</text>
    <text x="150" y="168">progress WHERE lessonId = 'd-03'</text>
    <text x="150" y="194">…</text>
    <text x="150" y="228">progress WHERE lessonId = 'd-N'</text>
  </g>

  <!-- Sağ: düzeltmeler -->
  <rect x="460" y="20" width="420" height="250" rx="14" fill="var(--da-surface, #f8fafc)" stroke="var(--da-success, #10b981)"/>
  <text x="480" y="48" font-size="15" font-weight="600" fill="var(--da-success, #10b981)">Aynı veri: 2 sorgu ya da 1 sorgu</text>
  <text x="480" y="80" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">include (varsayılan strateji)</text>
  <g font-size="12" fill="var(--da-fg, #0f172a)" font-family="ui-monospace, monospace">
    <text x="490" y="104">SELECT … FROM "Lesson" WHERE "moduleId" = $1</text>
    <text x="490" y="124">SELECT … FROM "Progress"</text>
    <text x="490" y="142">  WHERE "lessonId" IN ($1, $2, … $N)</text>
  </g>
  <text x="480" y="180" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">relationLoadStrategy: 'join'</text>
  <g font-size="12" fill="var(--da-fg, #0f172a)" font-family="ui-monospace, monospace">
    <text x="490" y="204">SELECT … FROM "Lesson" l</text>
    <text x="490" y="222">  LEFT JOIN LATERAL (… "Progress" …)</text>
  </g>
  <text x="480" y="254" font-size="12" fill="var(--da-muted, #64748b)">Sorgu sayısı liste uzunluğundan bağımsız</text>

  <!-- Alt: havuz -->
  <text x="20" y="310" font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">Havuz paylaşılan bir kaynaktır</text>
  <g stroke-width="1.5">
    <rect x="20" y="330" width="140" height="120" rx="12" fill="none" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="5 4"/>
    <rect x="190" y="330" width="380" height="120" rx="12" fill="var(--da-accent, #f59e0b)" fill-opacity="0.10" stroke="var(--da-accent, #f59e0b)"/>
    <rect x="610" y="330" width="270" height="120" rx="12" fill="var(--da-surface, #f8fafc)" stroke="var(--da-fg, #0f172a)"/>
  </g>
  <text x="90" y="352" font-size="12" text-anchor="middle" fill="var(--da-muted, #64748b)">Kuyruk</text>
  <g fill="var(--da-muted, #64748b)">
    <rect x="45" y="365" width="90" height="18" rx="5"/>
    <rect x="45" y="390" width="90" height="18" rx="5"/>
    <rect x="45" y="415" width="90" height="18" rx="5"/>
  </g>
  <text x="380" y="352" font-size="12" text-anchor="middle" fill="var(--da-fg, #0f172a)">connection_limit = 5 (5/5 meşgul)</text>
  <g fill="var(--da-danger, #ef4444)" fill-opacity="0.75">
    <rect x="210" y="368" width="58" height="56" rx="8"/>
    <rect x="281" y="368" width="58" height="56" rx="8"/>
    <rect x="352" y="368" width="58" height="56" rx="8"/>
    <rect x="423" y="368" width="58" height="56" rx="8"/>
    <rect x="494" y="368" width="58" height="56" rx="8"/>
  </g>
  <g font-size="11" fill="var(--da-surface, #ffffff)" text-anchor="middle">
    <text x="239" y="400">1+N</text>
    <text x="310" y="400">1+N</text>
    <text x="381" y="400">1+N</text>
    <text x="452" y="400">1+N</text>
    <text x="523" y="400">1+N</text>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.6" fill="none" marker-end="url(#d08-arrow)">
    <path d="M 160 390 L 188 390"/>
    <path d="M 570 390 L 608 390"/>
  </g>
  <text x="745" y="370" font-size="13" text-anchor="middle" fill="var(--da-fg, #0f172a)">PostgreSQL</text>
  <text x="745" y="395" font-size="11" text-anchor="middle" fill="var(--da-muted, #64748b)">bağlantı başına bir süreç</text>
  <text x="745" y="418" font-size="11" text-anchor="middle" fill="var(--da-muted, #64748b)">pool_timeout aşılırsa → P2024</text>
</svg>
