<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">EXPLAIN plan ağacının anatomisi</title>
  <desc id="desc">Kökte Limit, altında Sort, onun altında Hash Join. Hash Join'in bir kolunda büyük tablonun Seq Scan'i (probe), diğer kolunda Hash düğümü ve altında Bitmap Heap Scan ile Bitmap Index Scan (build). Sağdaki kutu bir düğüm satırındaki cost, rows, actual ve loops alanlarını açıklar.</desc>
  <defs>
    <marker id="d07-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- Okuma yönü -->
  <text x="20" y="30" font-size="13" fill="var(--da-muted, #64748b)">Satırlar aşağıdan yukarı akar → plan içten dışa okunur</text>
  <path d="M 30 440 L 30 60" stroke="var(--da-muted, #64748b)" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#d07-arrow)"/>

  <!-- Düğümler -->
  <g stroke-width="1.6">
    <rect x="200" y="50" width="200" height="44" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-fg, #0f172a)"/>
    <rect x="200" y="122" width="200" height="44" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-fg, #0f172a)"/>
    <rect x="200" y="194" width="200" height="44" rx="10" fill="var(--da-primary, #6366f1)" fill-opacity="0.12" stroke="var(--da-primary, #6366f1)"/>
    <rect x="60" y="290" width="190" height="44" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-danger, #ef4444)"/>
    <rect x="320" y="270" width="170" height="40" rx="10" fill="var(--da-accent, #f59e0b)" fill-opacity="0.12" stroke="var(--da-accent, #f59e0b)"/>
    <rect x="310" y="335" width="190" height="40" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-success, #10b981)"/>
    <rect x="310" y="400" width="190" height="40" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-success, #10b981)"/>
  </g>
  <g font-size="14" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="300" y="77">Limit</text>
    <text x="300" y="149">Sort (top-N heapsort)</text>
    <text x="300" y="221">Hash Join</text>
    <text x="155" y="317">Seq Scan "Progress"</text>
    <text x="405" y="295">Hash</text>
    <text x="405" y="360">Bitmap Heap Scan</text>
    <text x="405" y="425">Bitmap Index Scan</text>
  </g>
  <g font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="155" y="350">probe tarafı (büyük girdi)</text>
    <text x="580" y="295">build tarafı (küçük girdi)</text>
    <text x="580" y="360">Recheck Cond</text>
    <text x="580" y="425">GIN indeksi</text>
  </g>

  <!-- Kenarlar: alt düğüm → üst düğüm -->
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.6" fill="none" marker-end="url(#d07-arrow)">
    <path d="M 300 122 L 300 96"/>
    <path d="M 300 194 L 300 168"/>
    <path d="M 155 290 C 155 260, 230 250, 260 240"/>
    <path d="M 405 270 C 405 255, 360 250, 340 240"/>
    <path d="M 405 335 L 405 312"/>
    <path d="M 405 400 L 405 377"/>
  </g>

  <!-- Açıklama kutusu -->
  <rect x="610" y="50" width="270" height="200" rx="12" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="625" y="76" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">Bir düğüm satırı nasıl okunur?</text>
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="625" y="102">cost=<tspan fill="var(--da-primary, #6366f1)">0.42</tspan>..<tspan fill="var(--da-primary, #6366f1)">8.61</tspan></text>
    <text x="635" y="120" fill="var(--da-muted, #64748b)">başlangıç .. toplam (sayfa birimi)</text>
    <text x="625" y="146">rows=<tspan fill="var(--da-accent, #f59e0b)">12</tspan>  actual rows=<tspan fill="var(--da-accent, #f59e0b)">11</tspan></text>
    <text x="635" y="164" fill="var(--da-muted, #64748b)">tahmin ile gerçek: 10x fark → ANALYZE</text>
    <text x="625" y="190">loops=<tspan fill="var(--da-danger, #ef4444)">400</tspan></text>
    <text x="635" y="208" fill="var(--da-muted, #64748b)">süre ve satır döngü başına; ×400</text>
    <text x="625" y="234">Buffers: shared hit / read</text>
  </g>

  <!-- Maliyet birimleri -->
  <rect x="610" y="275" width="270" height="165" rx="12" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="625" y="301" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">Maliyet birimleri (varsayılan)</text>
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="625" y="326">seq_page_cost = 1.0</text>
    <text x="625" y="348">random_page_cost = 4.0</text>
    <text x="625" y="370">cpu_tuple_cost = 0.01</text>
    <text x="625" y="392">cpu_index_tuple_cost = 0.005</text>
    <text x="625" y="414">cpu_operator_cost = 0.0025</text>
  </g>
</svg>
