<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Veritabanı ölçekleme katmanları: havuz, replika, shard</title>
  <desc id="desc">Üstte uygulama pod'ları PgBouncer havuzuna bağlanır. Havuz yazmaları birincile, okumaları iki read replica'ya yönlendirir; birincilden replikalara WAL akışı okları vardır. Altta aynı yapı dört shard'a bölünmüştür; her shard kendi birincil ve replikasına sahiptir ve kullanıcı kimliğinin hash'ine göre seçilir.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
  </defs>

  <!-- Katman 1: uygulama -->
  <text x="30" y="30" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">1 · Okuma duvarı → read replica   ·   2 · Bağlantı duvarı → havuz</text>
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3">
    <rect x="30" y="60" width="90" height="40" rx="8"/>
    <rect x="130" y="60" width="90" height="40" rx="8"/>
    <rect x="230" y="60" width="90" height="40" rx="8"/>
  </g>
  <g font-size="11" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="75" y="84">pod ×100</text>
    <text x="175" y="84">pod ×100</text>
    <text x="275" y="84">pod ×100</text>
  </g>
  <text x="175" y="118" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">300 pod × 10 istemci bağlantısı = 3.000</text>

  <!-- PgBouncer -->
  <rect x="100" y="150" width="150" height="50" rx="10" fill="var(--da-accent, #f59e0b)" opacity="0.16" stroke="var(--da-accent, #f59e0b)" stroke-width="1.6"/>
  <text x="175" y="171" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">PgBouncer</text>
  <text x="175" y="188" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">transaction pooling · 3.000 → 20</text>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.3" fill="none" marker-end="url(#arr)">
    <path d="M 75 100 L 140 150"/>
    <path d="M 175 100 L 175 150"/>
    <path d="M 275 100 L 210 150"/>
  </g>

  <!-- Primary + replikalar -->
  <rect x="420" y="60" width="150" height="56" rx="10" fill="var(--da-primary, #6366f1)" opacity="0.14" stroke="var(--da-primary, #6366f1)" stroke-width="1.6"/>
  <text x="495" y="83" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Primary</text>
  <text x="495" y="101" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">tüm yazmalar · WAL</text>

  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3">
    <rect x="660" y="60" width="130" height="50" rx="10"/>
    <rect x="660" y="140" width="130" height="50" rx="10"/>
  </g>
  <g font-size="12" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="725" y="80">Replica 1</text>
    <text x="725" y="160">Replica 2</text>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="725" y="97">lag 8 ms</text>
    <text x="725" y="177">lag 3 s (rapor)</text>
  </g>
  <!-- WAL okları -->
  <g stroke="var(--da-success, #10b981)" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-s)">
    <path d="M 570 80 L 660 82"/>
    <path d="M 570 100 C 610 110, 620 160, 660 162"/>
  </g>
  <text x="600" y="70" font-size="10" fill="var(--da-success, #10b981)">WAL akışı (asenkron)</text>
  <!-- Havuz → DB okları -->
  <g stroke="var(--da-primary, #6366f1)" stroke-width="1.8" fill="none" marker-end="url(#arr-p)">
    <path d="M 250 165 C 330 165, 340 88, 420 88"/>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M 250 175 C 400 175, 480 75, 660 70" stroke-dasharray="2 3"/>
    <path d="M 250 185 C 400 190, 500 165, 660 165" stroke-dasharray="2 3"/>
  </g>
  <text x="330" y="150" font-size="10" fill="var(--da-primary, #6366f1)">INSERT / UPDATE / DELETE</text>
  <text x="330" y="212" font-size="10" fill="var(--da-muted, #64748b)">SELECT (round-robin, LSN kontrolü)</text>

  <!-- Not kutusu -->
  <rect x="810" y="60" width="110" height="130" rx="8" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="4 4"/>
  <g font-size="10" fill="var(--da-muted, #64748b)">
    <text x="818" y="80">okuma: ×N</text>
    <text x="818" y="96">yazma: ×1</text>
    <text x="818" y="118">read-your-writes:</text>
    <text x="818" y="132">yazma sonrası 5 s</text>
    <text x="818" y="146">birincil, ya da</text>
    <text x="818" y="160">LSN bekleme</text>
  </g>

  <!-- Ayırıcı -->
  <line x1="30" y1="240" x2="920" y2="240" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="6 6"/>

  <!-- Katman 3: sharding -->
  <text x="30" y="270" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">3 · Yazma duvarı → sharding (shard key: user_id)</text>
  <rect x="30" y="300" width="180" height="60" rx="10" fill="var(--da-accent, #f59e0b)" opacity="0.16" stroke="var(--da-accent, #f59e0b)" stroke-width="1.6"/>
  <text x="120" y="323" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Shard router</text>
  <text x="120" y="341" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">hash(user_id) → mantıksal shard</text>
  <text x="120" y="354" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">→ fiziksel sunucu (4096 → 4)</text>

  <g>
    <!-- 4 shard kutusu -->
    <g fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)">
      <rect x="260" y="290" width="150" height="110" rx="10"/>
      <rect x="430" y="290" width="150" height="110" rx="10"/>
      <rect x="600" y="290" width="150" height="110" rx="10"/>
      <rect x="770" y="290" width="150" height="110" rx="10"/>
    </g>
    <g font-size="11" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
      <text x="335" y="308">Shard 0</text>
      <text x="505" y="308">Shard 1</text>
      <text x="675" y="308">Shard 2</text>
      <text x="845" y="308">Shard 3</text>
    </g>
    <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
      <text x="335" y="322">mantıksal 0–1023</text>
      <text x="505" y="322">1024–2047</text>
      <text x="675" y="322">2048–3071</text>
      <text x="845" y="322">3072–4095</text>
    </g>
    <!-- her shard: primary + replica -->
    <g fill="var(--da-primary, #6366f1)" opacity="0.14" stroke="var(--da-primary, #6366f1)">
      <rect x="272" y="334" width="60" height="26" rx="6"/>
      <rect x="442" y="334" width="60" height="26" rx="6"/>
      <rect x="612" y="334" width="60" height="26" rx="6"/>
      <rect x="782" y="334" width="60" height="26" rx="6"/>
    </g>
    <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)">
      <rect x="340" y="334" width="58" height="26" rx="6"/>
      <rect x="510" y="334" width="58" height="26" rx="6"/>
      <rect x="680" y="334" width="58" height="26" rx="6"/>
      <rect x="850" y="334" width="58" height="26" rx="6"/>
    </g>
    <g font-size="9" fill="var(--da-fg, #0f172a)" text-anchor="middle">
      <text x="302" y="351">primary</text>
      <text x="369" y="351">replica</text>
      <text x="472" y="351">primary</text>
      <text x="539" y="351">replica</text>
      <text x="642" y="351">primary</text>
      <text x="709" y="351">replica</text>
      <text x="812" y="351">primary</text>
      <text x="879" y="351">replica</text>
    </g>
    <g font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">
      <text x="335" y="380">users, orders, carts</text>
      <text x="505" y="380">users, orders, carts</text>
      <text x="675" y="380">users, orders, carts</text>
      <text x="845" y="380">users, orders, carts</text>
      <text x="335" y="393">(user_id ∈ shard 0)</text>
      <text x="505" y="393">(user_id ∈ shard 1)</text>
      <text x="675" y="393">(user_id ∈ shard 2)</text>
      <text x="845" y="393">(user_id ∈ shard 3)</text>
    </g>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <path d="M 210 320 L 260 320"/>
    <path d="M 210 326 C 300 326, 330 300, 430 304" stroke-dasharray="3 3"/>
    <path d="M 210 334 C 350 340, 420 300, 600 304" stroke-dasharray="3 3"/>
    <path d="M 210 342 C 400 360, 500 300, 770 304" stroke-dasharray="3 3"/>
  </g>

  <!-- Alt notlar -->
  <g font-size="11" fill="var(--da-muted, #64748b)">
    <text x="30" y="440">İyi shard key: yüksek kardinalite · düzgün dağılım · sık sorgular tek shard'da · sıcak nokta yok</text>
    <text x="30" y="462">Gizli maliyetler: cross-shard JOIN yok · cross-shard transaction (2PC/saga) · küresel benzersiz id (Snowflake/UUIDv7) · resharding</text>
    <text x="30" y="484">Mantıksal shard sayısını baştan büyük tutun (4096); fiziksel sunucu eklemek yalnızca eşlemeyi değiştirir.</text>
  </g>
  <text x="475" y="535" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)" font-weight="600">Sıra: indeks → read replica → cache → connection pool → sharding (en pahalı, en son)</text>
</svg>
