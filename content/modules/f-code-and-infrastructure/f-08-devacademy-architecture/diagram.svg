<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">DevAcademy mimarisi</title>
  <desc id="desc">Monorepo içinde shared, backend, web, mobile paketleri ve content klasörü. Web ve mobil istemciler NestJS API'ye bağlanır; API PostgreSQL, Redis ve S3 uyumlu depolamayı kullanır. Content klasörü CI'da doğrulanır ve seed ile veritabanına yüklenir.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- Monorepo çerçevesi -->
  <rect x="16" y="16" width="928" height="140" rx="16" fill="none" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="6 6"/>
  <text x="32" y="40" font-size="13" font-weight="600" fill="var(--da-muted, #64748b)">monorepo (pnpm workspaces + Turborepo)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="36" y="58" width="160" height="80" rx="12" fill="var(--da-primary, #6366f1)" opacity="0.14" stroke="var(--da-primary, #6366f1)"/>
    <text x="116" y="88" font-weight="600" fill="var(--da-primary, #6366f1)">packages/shared</text>
    <text x="116" y="106" font-size="11" fill="var(--da-fg, #0f172a)">şemalar · DTO · oynatıcı</text>
    <text x="116" y="122" font-size="11" fill="var(--da-fg, #0f172a)">simülatör mantığı</text>

    <rect x="216" y="58" width="160" height="80" rx="12" fill="var(--da-surface, #fff)" stroke="var(--da-border, #cbd5e1)"/>
    <text x="296" y="94" font-weight="600" fill="var(--da-fg, #0f172a)">backend/</text>
    <text x="296" y="112" font-size="11" fill="var(--da-muted, #64748b)">NestJS · Prisma</text>

    <rect x="396" y="58" width="160" height="80" rx="12" fill="var(--da-surface, #fff)" stroke="var(--da-border, #cbd5e1)"/>
    <text x="476" y="94" font-weight="600" fill="var(--da-fg, #0f172a)">web/</text>
    <text x="476" y="112" font-size="11" fill="var(--da-muted, #64748b)">Next.js · Framer Motion</text>

    <rect x="576" y="58" width="160" height="80" rx="12" fill="var(--da-surface, #fff)" stroke="var(--da-border, #cbd5e1)"/>
    <text x="656" y="94" font-weight="600" fill="var(--da-fg, #0f172a)">mobile/</text>
    <text x="656" y="112" font-size="11" fill="var(--da-muted, #64748b)">Expo · Reanimated</text>

    <rect x="756" y="58" width="168" height="80" rx="12" fill="var(--da-accent, #f59e0b)" opacity="0.14" stroke="var(--da-accent, #f59e0b)"/>
    <text x="840" y="94" font-weight="600" fill="var(--da-fg, #0f172a)">content/</text>
    <text x="840" y="112" font-size="11" fill="var(--da-muted, #64748b)">Markdown + JSON + SVG</text>
  </g>

  <!-- Çalışma zamanı -->
  <g font-size="13" text-anchor="middle">
    <rect x="60" y="230" width="150" height="64" rx="12" fill="var(--da-surface, #fff)" stroke="var(--da-fg, #0f172a)"/>
    <text x="135" y="258" font-weight="600" fill="var(--da-fg, #0f172a)">Web tarayıcı</text>
    <text x="135" y="276" font-size="11" fill="var(--da-muted, #64748b)">SSR/ISR + istemci</text>

    <rect x="60" y="330" width="150" height="64" rx="12" fill="var(--da-surface, #fff)" stroke="var(--da-fg, #0f172a)"/>
    <text x="135" y="358" font-weight="600" fill="var(--da-fg, #0f172a)">iOS / Android</text>
    <text x="135" y="376" font-size="11" fill="var(--da-muted, #64748b)">SQLite offline</text>

    <rect x="330" y="270" width="190" height="90" rx="14" fill="var(--da-primary, #6366f1)" opacity="0.14" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
    <text x="425" y="304" font-weight="600" fill="var(--da-primary, #6366f1)">NestJS API</text>
    <text x="425" y="322" font-size="11" fill="var(--da-fg, #0f172a)">REST /api/v1 · WebSocket /ws</text>
    <text x="425" y="338" font-size="11" fill="var(--da-fg, #0f172a)">JWT · rate limit · ETag</text>

    <rect x="640" y="210" width="160" height="60" rx="12" fill="var(--da-success, #10b981)" opacity="0.14" stroke="var(--da-success, #10b981)"/>
    <text x="720" y="238" font-weight="600" fill="var(--da-fg, #0f172a)">PostgreSQL</text>
    <text x="720" y="255" font-size="11" fill="var(--da-muted, #64748b)">sürümlü içerik · ilerleme</text>

    <rect x="640" y="290" width="160" height="60" rx="12" fill="var(--da-danger, #ef4444)" opacity="0.12" stroke="var(--da-danger, #ef4444)"/>
    <text x="720" y="318" font-weight="600" fill="var(--da-fg, #0f172a)">Redis</text>
    <text x="720" y="335" font-size="11" fill="var(--da-muted, #64748b)">cache · rate limit sayaçları</text>

    <rect x="640" y="370" width="160" height="60" rx="12" fill="var(--da-surface, #fff)" stroke="var(--da-border, #cbd5e1)"/>
    <text x="720" y="398" font-weight="600" fill="var(--da-fg, #0f172a)">S3 / MinIO</text>
    <text x="720" y="415" font-size="11" fill="var(--da-muted, #64748b)">medya dosyaları</text>
  </g>

  <g stroke="var(--da-muted, #64748b)" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M210 262 C270 262 280 300 328 305"/>
    <path d="M210 362 C270 362 280 330 328 325"/>
    <path d="M520 300 C580 300 590 240 638 240"/>
    <path d="M520 315 L638 318"/>
    <path d="M520 330 C580 330 590 400 638 400"/>
  </g>

  <!-- İçerik hattı -->
  <g font-size="12" text-anchor="middle">
    <rect x="300" y="460" width="150" height="50" rx="10" fill="var(--da-surface, #fff)" stroke="var(--da-border, #cbd5e1)"/>
    <text x="375" y="490" fill="var(--da-fg, #0f172a)">CI: content:validate</text>
    <rect x="490" y="460" width="130" height="50" rx="10" fill="var(--da-surface, #fff)" stroke="var(--da-border, #cbd5e1)"/>
    <text x="555" y="490" fill="var(--da-fg, #0f172a)">db:seed</text>
  </g>
  <g stroke="var(--da-accent, #f59e0b)" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)">
    <path d="M840 138 C840 200 900 480 860 485 L452 485"/>
    <path d="M450 485 L488 485"/>
    <path d="M620 485 C680 485 720 460 720 432"/>
  </g>
  <text x="880" y="300" font-size="11" fill="var(--da-accent, #f59e0b)" text-anchor="middle" transform="rotate(90 880 300)">içerik hattı</text>
  <text x="480" y="540" font-size="12" text-anchor="middle" fill="var(--da-muted, #64748b)">Ortak paket sayesinde sahne şeması, API tipleri ve oynatıcı mantığı üç katmanda da aynıdır.</text>
</svg>
