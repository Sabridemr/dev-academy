<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Veri merkezi → Availability Zone → Region hiyerarşisi</title>
  <desc id="desc">Büyük bir region kutusu (eu-central-1, Frankfurt) içinde üç availability zone kutusu bulunur. Her AZ'de bir ya da iki veri merkezi binası, içlerinde sunucu rack'leri vardır. AZ'ler özel fiberle birbirine bağlıdır ve 1–2 ms gecikme ile işaretlenmiştir. Sağ altta ikinci bir region (eu-west-1, İrlanda) ve aradaki 20–25 ms gecikme gösterilir. Altta katman başına patlama yarıçapı listelenir.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- Region kutusu -->
  <rect x="20" y="40" width="660" height="330" rx="18" fill="var(--da-primary, #6366f1)" opacity="0.06" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
  <text x="36" y="66" font-size="15" font-weight="600" fill="var(--da-primary, #6366f1)">Region: eu-central-1 (Frankfurt)</text>
  <text x="36" y="84" font-size="11" fill="var(--da-muted, #64748b)">≥ 3 AZ · veri region dışına yalnızca siz isterseniz çıkar</text>

  <!-- AZ kutuları -->
  <g stroke="var(--da-border, #cbd5e1)" stroke-dasharray="6 5" fill="var(--da-surface, #ffffff)">
    <rect x="40" y="100" width="190" height="230" rx="12"/>
    <rect x="255" y="100" width="190" height="230" rx="12"/>
    <rect x="470" y="100" width="190" height="230" rx="12"/>
  </g>
  <g font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="135" y="122">AZ-a · eu-central-1a</text>
    <text x="350" y="122">AZ-b · eu-central-1b</text>
    <text x="565" y="122">AZ-c · eu-central-1c</text>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="135" y="138">ayrı şebeke · ayrı soğutma</text>
    <text x="350" y="138">ayrı şebeke · ayrı soğutma</text>
    <text x="565" y="138">ayrı şebeke · ayrı soğutma</text>
  </g>

  <!-- Veri merkezi binaları (AZ-a: 2 bina, AZ-b: 1, AZ-c: 2) -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4">
    <rect x="55" y="150" width="75" height="110" rx="6"/>
    <rect x="145" y="150" width="75" height="110" rx="6"/>
    <rect x="300" y="150" width="100" height="110" rx="6"/>
    <rect x="485" y="150" width="75" height="110" rx="6"/>
    <rect x="575" y="150" width="75" height="110" rx="6"/>
  </g>
  <!-- Rack'ler (küçük dikdörtgenler) -->
  <g fill="var(--da-primary, #6366f1)" opacity="0.55">
    <rect x="62" y="172" width="12" height="70" rx="2"/><rect x="80" y="172" width="12" height="70" rx="2"/><rect x="98" y="172" width="12" height="70" rx="2"/><rect x="116" y="172" width="8" height="70" rx="2"/>
    <rect x="152" y="172" width="12" height="70" rx="2"/><rect x="170" y="172" width="12" height="70" rx="2"/><rect x="188" y="172" width="12" height="70" rx="2"/><rect x="206" y="172" width="8" height="70" rx="2"/>
    <rect x="308" y="172" width="12" height="70" rx="2"/><rect x="326" y="172" width="12" height="70" rx="2"/><rect x="344" y="172" width="12" height="70" rx="2"/><rect x="362" y="172" width="12" height="70" rx="2"/><rect x="380" y="172" width="12" height="70" rx="2"/>
    <rect x="492" y="172" width="12" height="70" rx="2"/><rect x="510" y="172" width="12" height="70" rx="2"/><rect x="528" y="172" width="12" height="70" rx="2"/><rect x="546" y="172" width="8" height="70" rx="2"/>
    <rect x="582" y="172" width="12" height="70" rx="2"/><rect x="600" y="172" width="12" height="70" rx="2"/><rect x="618" y="172" width="12" height="70" rx="2"/><rect x="636" y="172" width="8" height="70" rx="2"/>
  </g>
  <g font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="92" y="162">veri merkezi 1</text>
    <text x="182" y="162">veri merkezi 2</text>
    <text x="350" y="162">veri merkezi 3</text>
    <text x="522" y="162">veri merkezi 4</text>
    <text x="612" y="162">veri merkezi 5</text>
    <text x="92" y="254">binlerce sunucu</text>
    <text x="182" y="254">jeneratör + UPS</text>
    <text x="350" y="254">rack · ToR switch</text>
    <text x="522" y="254">binlerce sunucu</text>
    <text x="612" y="254">jeneratör + UPS</text>
  </g>

  <!-- AZ'ler arası fiber -->
  <g stroke="var(--da-success, #10b981)" stroke-width="2" fill="none" marker-start="url(#arr)" marker-end="url(#arr)">
    <path d="M 232 290 L 253 290"/>
    <path d="M 447 290 L 468 290"/>
    <path d="M 135 322 C 135 350, 565 350, 565 322"/>
  </g>
  <g font-size="10" fill="var(--da-success, #10b981)" text-anchor="middle">
    <text x="135" y="300">özel fiber</text>
    <text x="350" y="300">1–2 ms · onlarca km</text>
    <text x="565" y="300">özel fiber</text>
  </g>

  <!-- İkinci region -->
  <rect x="720" y="150" width="220" height="150" rx="14" fill="var(--da-accent, #f59e0b)" opacity="0.08" stroke="var(--da-accent, #f59e0b)" stroke-width="2"/>
  <text x="830" y="176" font-size="13" font-weight="600" fill="var(--da-accent, #f59e0b)" text-anchor="middle">Region: eu-west-1 (İrlanda)</text>
  <g stroke="var(--da-border, #cbd5e1)" stroke-dasharray="4 4" fill="var(--da-surface, #ffffff)">
    <rect x="735" y="192" width="58" height="90" rx="8"/>
    <rect x="801" y="192" width="58" height="90" rx="8"/>
    <rect x="867" y="192" width="58" height="90" rx="8"/>
  </g>
  <g font-size="10" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="764" y="242">AZ-a</text>
    <text x="830" y="242">AZ-b</text>
    <text x="896" y="242">AZ-c</text>
  </g>

  <!-- Region'lar arası bağlantı -->
  <path d="M 680 225 L 718 225" stroke="var(--da-muted, #64748b)" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="700" y="212" font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">~1.100 km</text>
  <text x="700" y="248" font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">20–25 ms</text>
  <text x="830" y="322" font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">asenkron replikasyon · DNS failover</text>

  <!-- Alt: patlama yarıçapı merdiveni -->
  <text x="36" y="405" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">Patlama yarıçapı (blast radius)</text>
  <g font-size="11" fill="var(--da-fg, #0f172a)">
    <rect x="36" y="418" width="150" height="26" rx="6" fill="var(--da-success, #10b981)" opacity="0.18"/>
    <text x="111" y="435" text-anchor="middle">host → anti-affinity</text>
    <rect x="196" y="418" width="150" height="26" rx="6" fill="var(--da-success, #10b981)" opacity="0.3"/>
    <text x="271" y="435" text-anchor="middle">rack → placement</text>
    <rect x="356" y="418" width="150" height="26" rx="6" fill="var(--da-accent, #f59e0b)" opacity="0.3"/>
    <text x="431" y="435" text-anchor="middle">AZ → multi-AZ</text>
    <rect x="516" y="418" width="150" height="26" rx="6" fill="var(--da-danger, #ef4444)" opacity="0.3"/>
    <text x="591" y="435" text-anchor="middle">region → multi-region</text>
  </g>
  <path d="M 36 458 L 666 458" stroke="var(--da-muted, #64748b)" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="36" y="476" font-size="10" fill="var(--da-muted, #64748b)">daha küçük hata alanı, daha ucuz koruma</text>
  <text x="666" y="476" font-size="10" fill="var(--da-muted, #64748b)" text-anchor="end">daha büyük hata alanı, daha pahalı koruma</text>
  <text x="480" y="505" font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">Kural: multi-AZ varsayılan; multi-region yalnızca RTO/RPO ya da veri egemenliği gerektirdiğinde.</text>
</svg>
