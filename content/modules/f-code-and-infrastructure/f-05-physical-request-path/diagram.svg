<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Bir isteğin fiziksel yolu: İstanbul'dan Frankfurt'a</title>
  <desc id="desc">Solda İstanbul: kullanıcı telefonu, ISP DNS resolver'ı ve internet değişim noktasındaki CDN edge PoP'u. Ortada 1.900 kilometrelik fiber bağlantı ve 30 ms gidiş-dönüş etiketi. Sağda Frankfurt region'ı: üç AZ sütunu. AZ-a'da gateway pod'u, cart-service pod'u (node ip-10-0-12-34), Redis düğümü ve RDS primary; AZ-b'de ALB düğümü, gateway pod'u, Redis replikası ve RDS standby; AZ-c'de ALB düğümü, servis pod'u ve read replica. Altta katman başına gecikme bütçesi şeridi.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- İstanbul alanı -->
  <rect x="20" y="30" width="260" height="400" rx="14" fill="var(--da-accent, #f59e0b)" opacity="0.07" stroke="var(--da-accent, #f59e0b)" stroke-dasharray="6 5"/>
  <text x="36" y="54" font-size="14" font-weight="600" fill="var(--da-accent, #f59e0b)">İstanbul</text>
  <text x="36" y="70" font-size="10" fill="var(--da-muted, #64748b)">kullanıcıya en yakın katmanlar</text>

  <!-- Kullanıcı -->
  <rect x="40" y="300" width="100" height="60" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="90" y="324" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">Kullanıcı</text>
  <text x="90" y="340" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">telefon · 4G · Kadıköy</text>

  <!-- DNS -->
  <rect x="40" y="100" width="110" height="60" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="95" y="122" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">DNS</text>
  <text x="95" y="136" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">ISP resolver (İstanbul)</text>
  <text x="95" y="149" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">→ Route 53 anycast PoP</text>
  <path d="M 90 298 L 90 162" stroke="var(--da-muted, #64748b)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-m)"/>
  <text x="100" y="235" font-size="9" fill="var(--da-muted, #64748b)">① A? → anycast IP</text>

  <!-- Edge PoP -->
  <rect x="160" y="280" width="110" height="100" rx="10" fill="var(--da-accent, #f59e0b)" opacity="0.18" stroke="var(--da-accent, #f59e0b)" stroke-width="2"/>
  <text x="215" y="302" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">CDN edge PoP</text>
  <text x="215" y="318" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">IX yakını kiralık kafes</text>
  <text x="215" y="331" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">SSD + RAM · TLS sonlanır</text>
  <text x="215" y="344" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">WAF · DDoS filtresi</text>
  <text x="215" y="366" font-size="9" fill="var(--da-success, #10b981)" text-anchor="middle">statik: HIT · /api/cart: MISS</text>
  <path d="M 142 330 L 158 330" stroke="var(--da-primary, #6366f1)" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="150" y="322" font-size="9" fill="var(--da-primary, #6366f1)" text-anchor="middle">②</text>

  <!-- Fiber bağlantı -->
  <path d="M 272 330 C 300 330, 310 200, 350 200" stroke="var(--da-primary, #6366f1)" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="312" y="255" font-size="10" font-weight="600" fill="var(--da-primary, #6366f1)" text-anchor="middle">③ 1.900 km</text>
  <text x="312" y="268" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">özel omurga</text>
  <text x="312" y="280" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">30 ms RTT</text>

  <!-- Frankfurt region -->
  <rect x="340" y="30" width="620" height="400" rx="14" fill="var(--da-primary, #6366f1)" opacity="0.06" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
  <text x="356" y="54" font-size="14" font-weight="600" fill="var(--da-primary, #6366f1)">Region: eu-central-1 (Frankfurt)</text>
  <text x="356" y="70" font-size="10" fill="var(--da-muted, #64748b)">VPC 10.0.0.0/16 · AZ'ler arası 1–2 ms · çapraz AZ trafiği ücretli</text>

  <!-- AZ sütunları -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="5 4">
    <rect x="355" y="85" width="190" height="330" rx="10"/>
    <rect x="560" y="85" width="190" height="330" rx="10"/>
    <rect x="765" y="85" width="180" height="330" rx="10"/>
  </g>
  <g font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="450" y="104">AZ-a · eu-central-1a</text>
    <text x="655" y="104">AZ-b · eu-central-1b</text>
    <text x="855" y="104">AZ-c · eu-central-1c</text>
  </g>

  <!-- ALB düğümleri -->
  <g fill="var(--da-primary, #6366f1)" opacity="0.15" stroke="var(--da-primary, #6366f1)" stroke-width="1.5">
    <rect x="370" y="118" width="160" height="40" rx="8"/>
    <rect x="575" y="118" width="160" height="40" rx="8"/>
    <rect x="780" y="118" width="150" height="40" rx="8"/>
  </g>
  <g font-size="10" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="450" y="135">ALB düğümü (AWS filosu)</text>
    <text x="655" y="135">ALB düğümü (AWS filosu)</text>
    <text x="855" y="135">ALB düğümü (AWS filosu)</text>
  </g>
  <g font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="450" y="150">④ sağlıklı hedefe, aynı AZ tercihli</text>
    <text x="655" y="150">görünmeyen VM'ler</text>
    <text x="855" y="150">DNS 3 IP döner</text>
  </g>

  <!-- Gateway pod'ları -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.2">
    <rect x="370" y="172" width="160" height="40" rx="8"/>
    <rect x="575" y="172" width="160" height="40" rx="8"/>
  </g>
  <g font-size="10" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="450" y="188">API gateway pod (Envoy)</text>
    <text x="655" y="188">API gateway pod (Envoy)</text>
  </g>
  <g font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="450" y="203">EKS · node ip-10-0-11-5</text>
    <text x="655" y="203">EKS · node ip-10-0-21-7 · JWT, rate limit</text>
  </g>

  <!-- Servis pod'ları -->
  <rect x="370" y="226" width="160" height="48" rx="8" fill="var(--da-success, #10b981)" opacity="0.18" stroke="var(--da-success, #10b981)" stroke-width="1.5"/>
  <text x="450" y="244" font-size="10" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">⑤ cart-service pod</text>
  <text x="450" y="258" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">node ip-10-0-12-34 · m6g.large</text>
  <text x="450" y="269" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">container · 250m CPU</text>
  <rect x="780" y="226" width="150" height="48" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.2"/>
  <text x="855" y="244" font-size="10" fill="var(--da-fg, #0f172a)" text-anchor="middle">cart-service pod</text>
  <text x="855" y="258" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">node ip-10-0-31-9 (replika)</text>

  <!-- Redis -->
  <rect x="370" y="290" width="160" height="44" rx="8" fill="var(--da-accent, #f59e0b)" opacity="0.18" stroke="var(--da-accent, #f59e0b)" stroke-width="1.5"/>
  <text x="450" y="307" font-size="10" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">⑥ Redis primary</text>
  <text x="450" y="321" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">ElastiCache cache.r6g.large · RAM · 0,4 ms</text>
  <rect x="575" y="290" width="160" height="44" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.2"/>
  <text x="655" y="307" font-size="10" fill="var(--da-fg, #0f172a)" text-anchor="middle">Redis replika</text>
  <text x="655" y="321" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">async · failover 15–30 sn</text>

  <!-- Veritabanı -->
  <rect x="370" y="350" width="160" height="52" rx="8" fill="var(--da-danger, #ef4444)" opacity="0.14" stroke="var(--da-danger, #ef4444)" stroke-width="1.5"/>
  <text x="450" y="368" font-size="10" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">⑦ RDS primary (Postgres)</text>
  <text x="450" y="382" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">db.r6g.xlarge · NVMe EBS</text>
  <text x="450" y="394" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">indeksli sorgu 2–5 ms</text>
  <rect x="575" y="350" width="160" height="52" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.2"/>
  <text x="655" y="368" font-size="10" fill="var(--da-fg, #0f172a)" text-anchor="middle">RDS standby</text>
  <text x="655" y="382" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">senkron · her commit burada da</text>
  <text x="655" y="394" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">failover 30–60 sn</text>
  <rect x="780" y="350" width="150" height="52" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.2"/>
  <text x="855" y="368" font-size="10" fill="var(--da-fg, #0f172a)" text-anchor="middle">Read replica</text>
  <text x="855" y="382" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">asenkron · raporlama</text>

  <!-- Akış okları -->
  <g stroke="var(--da-primary, #6366f1)" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 450 160 L 450 170"/>
    <path d="M 450 214 L 450 224"/>
    <path d="M 450 276 L 450 288"/>
    <path d="M 450 336 L 450 348"/>
  </g>
  <!-- replikasyon okları -->
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-m)">
    <path d="M 530 312 L 573 312"/>
    <path d="M 530 376 L 573 376"/>
    <path d="M 735 376 L 778 376"/>
  </g>

  <!-- Gecikme bütçesi şeridi -->
  <text x="30" y="458" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Gecikme bütçesi (cache miss, İstanbul → Frankfurt): ≈ 80 ms</text>
  <g font-size="10" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <rect x="30" y="470" width="50" height="26" rx="5" fill="var(--da-border, #cbd5e1)" opacity="0.5"/><text x="55" y="487">DNS 5</text>
    <rect x="84" y="470" width="150" height="26" rx="5" fill="var(--da-accent, #f59e0b)" opacity="0.45"/><text x="159" y="487">TLS @ edge 30</text>
    <rect x="238" y="470" width="150" height="26" rx="5" fill="var(--da-primary, #6366f1)" opacity="0.45"/><text x="313" y="487">fiber gidiş-dönüş 30</text>
    <rect x="392" y="470" width="40" height="26" rx="5" fill="var(--da-border, #cbd5e1)" opacity="0.5"/><text x="412" y="487">LB+GW 3</text>
    <rect x="436" y="470" width="60" height="26" rx="5" fill="var(--da-success, #10b981)" opacity="0.45"/><text x="466" y="487">servis 8</text>
    <rect x="500" y="470" width="20" height="26" rx="5" fill="var(--da-accent, #f59e0b)" opacity="0.45"/><text x="510" y="487">1</text>
    <rect x="524" y="470" width="40" height="26" rx="5" fill="var(--da-danger, #ef4444)" opacity="0.4"/><text x="544" y="487">DB 4</text>
  </g>
  <text x="510" y="512" font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">Redis</text>
  <text x="30" y="530" font-size="10" fill="var(--da-muted, #64748b)">Mesafeye bağlı kalemler (TLS + fiber) ≈ 60 ms: kod optimizasyonuyla değil, edge cache ve yakın region ile düşer.</text>
  <text x="30" y="546" font-size="10" fill="var(--da-muted, #64748b)">Aynı istek Frankfurt'taki kullanıcı için ≈ 40 ms, São Paulo için ≈ 250 ms.</text>
</svg>
