<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Trunk-based development ile Gitflow karşılaştırması</title>
  <desc id="desc">Üst yarıda trunk-based development: tek bir main çizgisi üzerinde kısa ömürlü dallar birkaç saat içinde geri birleşir ve her merge deploy edilebilir bir noktadır. Alt yarıda Gitflow: main, develop, release ve feature dalları haftalarca paralel yaşar, birleşmeler seyrek ve büyüktür.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- ======== Trunk-based ======== -->
  <rect x="20" y="20" width="920" height="190" rx="14" fill="var(--da-success, #10b981)" opacity="0.06" stroke="var(--da-success, #10b981)"/>
  <text x="36" y="46" font-size="15" font-weight="600" fill="var(--da-success, #10b981)">Trunk-based development</text>
  <text x="36" y="64" font-size="11" fill="var(--da-muted, #64748b)">dallar saatler–1-2 gün yaşar · günde birçok merge · her merge deploy edilebilir · yarım özellikler feature flag arkasında</text>

  <!-- main çizgisi -->
  <line x1="60" y1="140" x2="900" y2="140" stroke="var(--da-fg, #0f172a)" stroke-width="3"/>
  <text x="62" y="128" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">main</text>

  <!-- kısa dallar -->
  <g stroke="var(--da-primary, #6366f1)" stroke-width="2" fill="none">
    <path d="M 120 140 C 140 110, 160 110, 180 140"/>
    <path d="M 220 140 C 245 105, 275 105, 300 140"/>
    <path d="M 330 140 C 345 115, 360 115, 375 140"/>
    <path d="M 420 140 C 450 100, 490 100, 520 140"/>
    <path d="M 560 140 C 575 115, 590 115, 605 140"/>
    <path d="M 650 140 C 680 105, 710 105, 740 140"/>
    <path d="M 780 140 C 795 115, 810 115, 825 140"/>
  </g>
  <!-- commit noktaları -->
  <g fill="var(--da-primary, #6366f1)">
    <circle cx="150" cy="118" r="4"/><circle cx="260" cy="114" r="4"/><circle cx="352" cy="121" r="4"/><circle cx="455" cy="110" r="4"/><circle cx="485" cy="110" r="4"/><circle cx="582" cy="121" r="4"/><circle cx="695" cy="114" r="4"/><circle cx="802" cy="121" r="4"/>
  </g>
  <!-- merge noktaları (deploy edilebilir) -->
  <g fill="var(--da-success, #10b981)" stroke="var(--da-surface, #ffffff)" stroke-width="2">
    <circle cx="180" cy="140" r="7"/><circle cx="300" cy="140" r="7"/><circle cx="375" cy="140" r="7"/><circle cx="520" cy="140" r="7"/><circle cx="605" cy="140" r="7"/><circle cx="740" cy="140" r="7"/><circle cx="825" cy="140" r="7"/>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="150" y="104">fix/cart-null</text>
    <text x="260" y="100">feat/coupon (flag)</text>
    <text x="470" y="96">feat/search-v2 (flag)</text>
    <text x="695" y="100">chore/deps</text>
  </g>
  <g font-size="10" fill="var(--da-success, #10b981)" text-anchor="middle">
    <text x="180" y="165">deploy</text><text x="300" y="165">deploy</text><text x="375" y="165">deploy</text><text x="520" y="165">deploy</text><text x="605" y="165">deploy</text><text x="740" y="165">deploy</text><text x="825" y="165">deploy</text>
  </g>
  <line x1="60" y1="190" x2="900" y2="190" stroke="var(--da-border, #cbd5e1)" marker-end="url(#arrow)"/>
  <text x="60" y="204" font-size="10" fill="var(--da-muted, #64748b)">Pazartesi</text>
  <text x="900" y="204" font-size="10" fill="var(--da-muted, #64748b)" text-anchor="end">Cuma (aynı hafta)</text>

  <!-- ======== Gitflow ======== -->
  <rect x="20" y="230" width="920" height="215" rx="14" fill="var(--da-accent, #f59e0b)" opacity="0.06" stroke="var(--da-accent, #f59e0b)"/>
  <text x="36" y="256" font-size="15" font-weight="600" fill="var(--da-accent, #f59e0b)">Gitflow</text>
  <text x="36" y="274" font-size="11" fill="var(--da-muted, #64748b)">uzun ömürlü develop / release / hotfix dalları · seyrek ve büyük merge'ler · sürüm bazlı teslimat</text>

  <!-- dal çizgileri -->
  <line x1="60" y1="300" x2="900" y2="300" stroke="var(--da-fg, #0f172a)" stroke-width="3"/>
  <text x="62" y="290" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">main</text>
  <line x1="60" y1="360" x2="900" y2="360" stroke="var(--da-primary, #6366f1)" stroke-width="2.5"/>
  <text x="62" y="350" font-size="12" font-weight="600" fill="var(--da-primary, #6366f1)">develop</text>
  <line x1="560" y1="330" x2="800" y2="330" stroke="var(--da-accent, #f59e0b)" stroke-width="2"/>
  <text x="565" y="322" font-size="11" fill="var(--da-accent, #f59e0b)">release/1.4</text>

  <!-- feature dalları (uzun) -->
  <g stroke="var(--da-muted, #64748b)" stroke-width="2" fill="none">
    <path d="M 120 360 C 140 400, 160 410, 200 410 L 380 410 C 420 410, 440 400, 460 360"/>
    <path d="M 240 360 C 255 390, 270 395, 300 395 L 560 395 C 600 395, 620 385, 640 360"/>
  </g>
  <text x="290" y="426" font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">feature/coupon — 3 hafta</text>
  <text x="470" y="390" font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">feature/search-v2 — 5 hafta</text>

  <!-- develop → release → main -->
  <g stroke="var(--da-accent, #f59e0b)" stroke-width="2" fill="none">
    <path d="M 560 360 L 560 330"/>
    <path d="M 800 330 L 800 300"/>
  </g>
  <!-- hotfix -->
  <path d="M 340 300 C 350 280, 370 280, 380 300" stroke="var(--da-danger, #ef4444)" stroke-width="2" fill="none"/>
  <text x="360" y="276" font-size="10" fill="var(--da-danger, #ef4444)" text-anchor="middle">hotfix</text>
  <path d="M 380 300 C 400 320, 420 340, 440 360" stroke="var(--da-danger, #ef4444)" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

  <!-- merge çatışması uyarısı -->
  <g fill="var(--da-danger, #ef4444)" stroke="var(--da-surface, #ffffff)" stroke-width="2">
    <circle cx="460" cy="360" r="7"/><circle cx="640" cy="360" r="7"/>
  </g>
  <text x="550" y="378" font-size="10" fill="var(--da-danger, #ef4444)" text-anchor="middle">büyük merge → çatışma riski</text>
  <g fill="var(--da-success, #10b981)" stroke="var(--da-surface, #ffffff)" stroke-width="2">
    <circle cx="800" cy="300" r="7"/>
  </g>
  <text x="800" y="290" font-size="10" fill="var(--da-success, #10b981)" text-anchor="middle">v1.4 deploy</text>
  <text x="900" y="290" font-size="10" fill="var(--da-muted, #64748b)" text-anchor="end">6 haftada 1 sürüm</text>
</svg>
