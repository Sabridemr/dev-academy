<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Notification servisi mimarisi</title>
  <desc id="desc">Solda üretici servisler ve giriş kuyruğu; ortada tekilleştirme, tercih servisi ve şablon servisi ile notification çekirdeği; sağda işlemsel ve pazarlama için ayrı push, e-posta ve SMS kuyrukları, işçi havuzları, sağlayıcı rate limiter'ları ve sağlayıcılar; altta retry, DLQ ve durum takibi.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
    <marker id="arrow-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
  </defs>

  <!-- Üreticiler -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3">
    <rect x="20" y="70" width="100" height="34" rx="8"/>
    <rect x="20" y="114" width="100" height="34" rx="8"/>
    <rect x="20" y="158" width="100" height="34" rx="8"/>
  </g>
  <g font-size="10.5" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="70" y="91">Sipariş servisi</text>
    <text x="70" y="135">Ödeme (OTP)</text>
    <text x="70" y="179">Pazarlama</text>
  </g>

  <!-- Giriş kuyruğu -->
  <rect x="150" y="105" width="100" height="50" rx="8" fill="var(--da-accent, #f59e0b)" opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1.4"/>
  <text x="200" y="125" text-anchor="middle" font-size="10.5" fill="var(--da-fg, #0f172a)">Kafka</text>
  <text x="200" y="140" text-anchor="middle" font-size="8.5" fill="var(--da-muted, #64748b)">olay ya da POST /notify</text>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <path d="M 120 87 C 135 87, 135 120, 150 122"/>
    <path d="M 120 131 L 150 131"/>
    <path d="M 120 175 C 135 175, 135 142, 150 140"/>
  </g>

  <!-- Çekirdek -->
  <rect x="280" y="90" width="150" height="80" rx="10" fill="var(--da-primary, #6366f1)" opacity="0.12" stroke="var(--da-primary, #6366f1)" stroke-width="1.6"/>
  <text x="355" y="111" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--da-fg, #0f172a)">Notification servisi</text>
  <g font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="355" y="128">1. idempotency (eventId+user+kanal)</text>
    <text x="355" y="142">2. tercih · sessiz saat · kota</text>
    <text x="355" y="156">3. şablon render (i18n, versiyonlu)</text>
  </g>
  <g stroke="var(--da-accent, #f59e0b)" stroke-width="1.4" fill="none" marker-end="url(#arrow-a)">
    <path d="M 250 130 L 280 130"/>
  </g>

  <!-- Tercih ve şablon -->
  <rect x="280" y="18" width="70" height="40" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.3"/>
  <text x="315" y="35" text-anchor="middle" font-size="10" fill="var(--da-fg, #0f172a)">Tercihler</text>
  <text x="315" y="48" text-anchor="middle" font-size="8" fill="var(--da-muted, #64748b)">cache 60 s</text>
  <rect x="360" y="18" width="70" height="40" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.3"/>
  <text x="395" y="35" text-anchor="middle" font-size="10" fill="var(--da-fg, #0f172a)">Şablonlar</text>
  <text x="395" y="48" text-anchor="middle" font-size="8" fill="var(--da-muted, #64748b)">v3 · tr/en</text>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow)">
    <path d="M 330 90 L 318 58"/>
    <path d="M 380 90 L 392 58"/>
  </g>
  <rect x="280" y="200" width="150" height="34" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.3"/>
  <text x="355" y="215" text-anchor="middle" font-size="10" fill="var(--da-fg, #0f172a)">Idempotency tablosu</text>
  <text x="355" y="228" text-anchor="middle" font-size="8" fill="var(--da-muted, #64748b)">key → sonuç · TTL 24 sa</text>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arrow)">
    <path d="M 355 170 L 355 200"/>
  </g>

  <!-- Kanal kuyrukları -->
  <g fill="var(--da-accent, #f59e0b)" opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1.4">
    <rect x="470" y="40" width="110" height="34" rx="8"/>
    <rect x="470" y="82" width="110" height="34" rx="8"/>
    <rect x="470" y="140" width="110" height="34" rx="8"/>
    <rect x="470" y="182" width="110" height="34" rx="8"/>
  </g>
  <g font-size="9.5" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="525" y="61">push · işlemsel</text>
    <text x="525" y="103">push · pazarlama</text>
    <text x="525" y="161">e-posta</text>
    <text x="525" y="203">SMS</text>
  </g>
  <text x="525" y="130" text-anchor="middle" font-size="8.5" fill="var(--da-muted, #64748b)">öncelik: ayrı kuyruk</text>
  <g stroke="var(--da-accent, #f59e0b)" stroke-width="1.3" fill="none" marker-end="url(#arrow-a)">
    <path d="M 430 110 C 450 100, 450 60, 470 57"/>
    <path d="M 430 120 C 450 115, 450 100, 470 99"/>
    <path d="M 430 140 C 450 145, 450 156, 470 157"/>
    <path d="M 430 150 C 450 170, 450 198, 470 199"/>
  </g>

  <!-- İşçi havuzları + limiter -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.3">
    <rect x="620" y="40" width="110" height="34" rx="8"/>
    <rect x="620" y="82" width="110" height="34" rx="8"/>
    <rect x="620" y="140" width="110" height="34" rx="8"/>
    <rect x="620" y="182" width="110" height="34" rx="8"/>
  </g>
  <g font-size="9.5" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="675" y="61">işçi · limiter 5 K/s</text>
    <text x="675" y="103">işçi · limiter 2 K/s</text>
    <text x="675" y="161">işçi · limiter 1 K/s</text>
    <text x="675" y="203">işçi · limiter 100/s</text>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <path d="M 580 57 L 620 57"/>
    <path d="M 580 99 L 620 99"/>
    <path d="M 580 157 L 620 157"/>
    <path d="M 580 199 L 620 199"/>
  </g>

  <!-- Sağlayıcılar -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.3">
    <rect x="770" y="40" width="110" height="34" rx="8"/>
    <rect x="770" y="82" width="110" height="34" rx="8"/>
    <rect x="770" y="140" width="110" height="34" rx="8"/>
    <rect x="770" y="182" width="110" height="34" rx="8"/>
  </g>
  <g font-size="9.5" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="825" y="61">APNs / FCM</text>
    <text x="825" y="103">APNs / FCM</text>
    <text x="825" y="161">SES</text>
    <text x="825" y="203">Twilio</text>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
    <path d="M 730 57 L 770 57"/>
    <path d="M 730 99 L 770 99"/>
    <path d="M 730 157 L 770 157"/>
    <path d="M 730 199 L 770 199"/>
  </g>

  <!-- Retry / DLQ / durum -->
  <rect x="470" y="250" width="180" height="60" rx="10" fill="var(--da-danger, #ef4444)" opacity="0.08" stroke="var(--da-danger, #ef4444)" stroke-width="1.4"/>
  <text x="560" y="270" text-anchor="middle" font-size="10.5" fill="var(--da-fg, #0f172a)">Retry → DLQ</text>
  <text x="560" y="285" text-anchor="middle" font-size="8.5" fill="var(--da-muted, #64748b)">5xx: backoff 1 s · 4 s · 16 s (+jitter)</text>
  <text x="560" y="298" text-anchor="middle" font-size="8.5" fill="var(--da-muted, #64748b)">3 deneme → DLQ → alarm → yeniden oynat</text>
  <g stroke="var(--da-danger, #ef4444)" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-d)">
    <path d="M 675 216 C 660 240, 620 250, 600 250"/>
  </g>
  <text x="648" y="240" font-size="8.5" fill="var(--da-danger, #ef4444)">503</text>

  <rect x="690" y="250" width="190" height="60" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.3"/>
  <text x="785" y="270" text-anchor="middle" font-size="10.5" fill="var(--da-fg, #0f172a)">Durum takibi</text>
  <text x="785" y="285" text-anchor="middle" font-size="8.5" fill="var(--da-muted, #64748b)">QUEUED → SENT → DELIVERED / FAILED</text>
  <text x="785" y="298" text-anchor="middle" font-size="8.5" fill="var(--da-muted, #64748b)">"bildirimim nerede?" · metrikler</text>

  <text x="20" y="300" font-size="9.5" fill="var(--da-muted, #64748b)">Garanti: en az bir kez taşıma + idempotency = çift gönderim yok · pazarlama patlaması OTP'yi geciktiremez</text>
</svg>
