<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">İkili arama ağacı ve arama yolu</title>
  <desc id="desc">Kökü 8 olan dokuz düğümlü bir BST. 7 aranırken 8, 3, 6 ve 7 düğümlerinden geçilir. Altta inorder sırası: 1 3 4 6 7 8 10 13 14.</desc>
  <line x1="400" y1="60" x2="220" y2="150" stroke="var(--da-primary)" stroke-width="3"/>
  <line x1="400" y1="60" x2="580" y2="150" stroke="var(--da-border)" stroke-width="2"/>
  <line x1="220" y1="150" x2="120" y2="240" stroke="var(--da-border)" stroke-width="2"/>
  <line x1="220" y1="150" x2="320" y2="240" stroke="var(--da-primary)" stroke-width="3"/>
  <line x1="580" y1="150" x2="680" y2="240" stroke="var(--da-border)" stroke-width="2"/>
  <line x1="320" y1="240" x2="260" y2="330" stroke="var(--da-border)" stroke-width="2"/>
  <line x1="320" y1="240" x2="380" y2="330" stroke="var(--da-primary)" stroke-width="3"/>
  <line x1="680" y1="240" x2="620" y2="330" stroke="var(--da-border)" stroke-width="2"/>
  <circle cx="400" cy="60" r="24" fill="var(--da-surface)" stroke="var(--da-primary)" stroke-width="3"/>
  <text x="400" y="66" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-primary)">8</text>
  <circle cx="220" cy="150" r="24" fill="var(--da-surface)" stroke="var(--da-primary)" stroke-width="3"/>
  <text x="220" y="156" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-primary)">3</text>
  <circle cx="580" cy="150" r="24" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="580" y="156" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">10</text>
  <circle cx="120" cy="240" r="24" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="120" y="246" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">1</text>
  <circle cx="320" cy="240" r="24" fill="var(--da-surface)" stroke="var(--da-primary)" stroke-width="3"/>
  <text x="320" y="246" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-primary)">6</text>
  <circle cx="680" cy="240" r="24" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="680" y="246" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">14</text>
  <circle cx="260" cy="330" r="24" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="260" y="336" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">4</text>
  <circle cx="380" cy="330" r="24" fill="var(--da-surface)" stroke="var(--da-primary)" stroke-width="3"/>
  <text x="380" y="336" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-primary)">7</text>
  <circle cx="620" cy="330" r="24" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="620" y="336" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">13</text>
  <circle cx="380" cy="330" r="31" fill="none" stroke="var(--da-success)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="430" y="372" font-size="13" font-family="inherit" fill="var(--da-success)">bulundu: 7</text>
  <text x="200" y="110" text-anchor="end" font-size="13" font-family="inherit" fill="var(--da-primary)">7 &lt; 8 → sol</text>
  <text x="290" y="200" text-anchor="start" font-size="13" font-family="inherit" fill="var(--da-primary)">7 &gt; 3 → sağ</text>
  <text x="356" y="292" text-anchor="start" font-size="13" font-family="inherit" fill="var(--da-primary)">7 &gt; 6 → sağ</text>
  <text x="600" y="60" font-size="13" font-family="inherit" fill="var(--da-muted)">kök (derinlik 0)</text>
  <text x="720" y="330" font-size="13" font-family="inherit" fill="var(--da-muted)">yükseklik = 3</text>
  <rect x="60" y="396" width="680" height="48" rx="10" fill="var(--da-surface)" stroke="var(--da-border)"/>
  <text x="80" y="426" font-size="14" font-family="inherit" fill="var(--da-muted)">inorder:</text>
  <text x="180" y="426" text-anchor="middle" font-size="16" font-weight="600" font-family="inherit" fill="var(--da-accent)">1</text>
  <text x="242" y="426" text-anchor="middle" font-size="16" font-weight="600" font-family="inherit" fill="var(--da-accent)">3</text>
  <text x="304" y="426" text-anchor="middle" font-size="16" font-weight="600" font-family="inherit" fill="var(--da-accent)">4</text>
  <text x="366" y="426" text-anchor="middle" font-size="16" font-weight="600" font-family="inherit" fill="var(--da-accent)">6</text>
  <text x="428" y="426" text-anchor="middle" font-size="16" font-weight="600" font-family="inherit" fill="var(--da-accent)">7</text>
  <text x="490" y="426" text-anchor="middle" font-size="16" font-weight="600" font-family="inherit" fill="var(--da-accent)">8</text>
  <text x="552" y="426" text-anchor="middle" font-size="16" font-weight="600" font-family="inherit" fill="var(--da-accent)">10</text>
  <text x="614" y="426" text-anchor="middle" font-size="16" font-weight="600" font-family="inherit" fill="var(--da-accent)">13</text>
  <text x="676" y="426" text-anchor="middle" font-size="16" font-weight="600" font-family="inherit" fill="var(--da-accent)">14</text>
</svg>
