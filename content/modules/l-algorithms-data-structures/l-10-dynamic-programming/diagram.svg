<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">fib(5) çağrı ağacı ve memo tablosu</title>
  <desc id="desc">Solda saf özyinelemeli fib(5) çağrı ağacı; fib(3) iki kez, fib(2) üç kez tekrarlanır ve vurgulanır. Sağda memoization sözlüğü ve aşağıdan yukarıya doldurulan tabulation dizisi.</desc>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary)"/>
    </marker>
  </defs>
  <text x="270" y="30" font-size="15" font-weight="600" text-anchor="middle" fill="var(--da-fg)" font-family="inherit">Saf özyineleme: 15 çağrı</text>
  <g stroke="var(--da-border)" stroke-width="1.5">
    <line x1="270" y1="70" x2="150" y2="140"/><line x1="270" y1="70" x2="390" y2="140"/>
    <line x1="150" y1="140" x2="80" y2="210"/><line x1="150" y1="140" x2="220" y2="210"/>
    <line x1="390" y1="140" x2="340" y2="210"/><line x1="390" y1="140" x2="440" y2="210"/>
    <line x1="80" y1="210" x2="45" y2="280"/><line x1="80" y1="210" x2="115" y2="280"/>
    <line x1="220" y1="210" x2="190" y2="280"/><line x1="220" y1="210" x2="250" y2="280"/>
    <line x1="340" y1="210" x2="310" y2="280"/><line x1="340" y1="210" x2="370" y2="280"/>
    <line x1="45" y1="280" x2="25" y2="350"/><line x1="45" y1="280" x2="65" y2="350"/>
  </g>
  <g font-size="12" text-anchor="middle" font-family="inherit">
    <rect x="235" y="56" width="70" height="28" rx="14" fill="var(--da-surface)" stroke="var(--da-fg)"/><text x="270" y="75" fill="var(--da-fg)">fib(5)</text>
    <rect x="115" y="126" width="70" height="28" rx="14" fill="var(--da-surface)" stroke="var(--da-fg)"/><text x="150" y="145" fill="var(--da-fg)">fib(4)</text>
    <rect x="355" y="126" width="70" height="28" rx="14" fill="var(--da-danger)" fill-opacity="0.18" stroke="var(--da-danger)"/><text x="390" y="145" fill="var(--da-fg)">fib(3)</text>
    <rect x="45" y="196" width="70" height="28" rx="14" fill="var(--da-danger)" fill-opacity="0.18" stroke="var(--da-danger)"/><text x="80" y="215" fill="var(--da-fg)">fib(3)</text>
    <rect x="185" y="196" width="70" height="28" rx="14" fill="var(--da-accent)" fill-opacity="0.22" stroke="var(--da-accent)"/><text x="220" y="215" fill="var(--da-fg)">fib(2)</text>
    <rect x="305" y="196" width="70" height="28" rx="14" fill="var(--da-accent)" fill-opacity="0.22" stroke="var(--da-accent)"/><text x="340" y="215" fill="var(--da-fg)">fib(2)</text>
    <rect x="410" y="196" width="60" height="28" rx="14" fill="var(--da-surface)" stroke="var(--da-border)"/><text x="440" y="215" fill="var(--da-muted)">fib(1)</text>
    <rect x="12" y="266" width="66" height="28" rx="14" fill="var(--da-accent)" fill-opacity="0.22" stroke="var(--da-accent)"/><text x="45" y="285" fill="var(--da-fg)">fib(2)</text>
    <rect x="88" y="266" width="54" height="28" rx="14" fill="var(--da-surface)" stroke="var(--da-border)"/><text x="115" y="285" fill="var(--da-muted)">fib(1)</text>
    <rect x="163" y="266" width="54" height="28" rx="14" fill="var(--da-surface)" stroke="var(--da-border)"/><text x="190" y="285" fill="var(--da-muted)">fib(1)</text>
    <rect x="223" y="266" width="54" height="28" rx="14" fill="var(--da-surface)" stroke="var(--da-border)"/><text x="250" y="285" fill="var(--da-muted)">fib(0)</text>
    <rect x="283" y="266" width="54" height="28" rx="14" fill="var(--da-surface)" stroke="var(--da-border)"/><text x="310" y="285" fill="var(--da-muted)">fib(1)</text>
    <rect x="343" y="266" width="54" height="28" rx="14" fill="var(--da-surface)" stroke="var(--da-border)"/><text x="370" y="285" fill="var(--da-muted)">fib(0)</text>
    <rect x="2" y="336" width="46" height="28" rx="14" fill="var(--da-surface)" stroke="var(--da-border)"/><text x="25" y="355" fill="var(--da-muted)">f(1)</text>
    <rect x="44" y="336" width="46" height="28" rx="14" fill="var(--da-surface)" stroke="var(--da-border)"/><text x="67" y="355" fill="var(--da-muted)">f(0)</text>
  </g>
  <text x="270" y="400" font-size="12" text-anchor="middle" fill="var(--da-danger)" font-family="inherit">Aynı renk = aynı alt problem tekrar hesaplanıyor → O(2ⁿ)</text>

  <line x1="510" y1="40" x2="510" y2="400" stroke="var(--da-border)" stroke-dasharray="5 5"/>

  <text x="700" y="30" font-size="15" font-weight="600" text-anchor="middle" fill="var(--da-fg)" font-family="inherit">Memoization: her n bir kez</text>
  <g font-size="13" font-family="inherit">
    <rect x="560" y="50" width="280" height="150" rx="10" fill="var(--da-surface)" stroke="var(--da-primary)"/>
    <text x="580" y="76" fill="var(--da-primary)" font-weight="600">memo = {</text>
    <text x="600" y="100" fill="var(--da-fg)">2: 1,  3: 2,</text>
    <text x="600" y="124" fill="var(--da-fg)">4: 3,  5: 5</text>
    <text x="580" y="148" fill="var(--da-primary)" font-weight="600">}</text>
    <text x="580" y="180" fill="var(--da-success)" font-size="12">fib(3) ikinci kez → tablodan oku</text>
  </g>

  <text x="700" y="245" font-size="15" font-weight="600" text-anchor="middle" fill="var(--da-fg)" font-family="inherit">Tabulation: soldan sağa doldur</text>
  <g stroke="var(--da-border)" stroke-width="1.5" fill="var(--da-surface)">
    <rect x="550" y="265" width="48" height="40" rx="5"/><rect x="598" y="265" width="48" height="40" rx="5"/>
    <rect x="646" y="265" width="48" height="40" rx="5"/><rect x="694" y="265" width="48" height="40" rx="5"/>
    <rect x="742" y="265" width="48" height="40" rx="5"/><rect x="790" y="265" width="48" height="40" rx="5" fill="var(--da-success)" fill-opacity="0.22" stroke="var(--da-success)"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="var(--da-fg)" font-family="inherit">
    <text x="574" y="290">0</text><text x="622" y="290">1</text><text x="670" y="290">1</text>
    <text x="718" y="290">2</text><text x="766" y="290">3</text><text x="814" y="290">5</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="var(--da-muted)" font-family="inherit">
    <text x="574" y="322">t[0]</text><text x="622" y="322">t[1]</text><text x="670" y="322">t[2]</text>
    <text x="718" y="322">t[3]</text><text x="766" y="322">t[4]</text><text x="814" y="322">t[5]</text>
  </g>
  <path d="M 718 340 C 740 365, 790 365, 810 340" fill="none" stroke="var(--da-primary)" stroke-width="1.5" marker-end="url(#ok)"/>
  <path d="M 766 340 C 780 355, 800 355, 812 340" fill="none" stroke="var(--da-primary)" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="700" y="390" font-size="12" text-anchor="middle" fill="var(--da-muted)" font-family="inherit">t[i] = t[i-1] + t[i-2] → O(n) süre, iki değişkenle O(1) bellek</text>
</svg>
