<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Min-heap: ağaç ve dizi görünümü</title>
  <desc id="desc">Solda yedi elemanlı bir min-heap ağacı (1, 3, 2, 7, 4, 5, 9), sağda aynı elemanların dizideki yerleşimi. Bir indeksin çocukları 2i+1 ve 2i+2, ebeveyni (i-1)//2.</desc>
  <defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent)"/></marker></defs>
  <text x="260" y="24" text-anchor="middle" font-size="14" font-family="inherit" fill="var(--da-muted)">Ağaç görünümü</text>
  <text x="660" y="24" text-anchor="middle" font-size="14" font-family="inherit" fill="var(--da-muted)">Dizi görünümü (gerçek bellek)</text>
  <line x1="260" y1="60" x2="150" y2="150" stroke="var(--da-border)" stroke-width="2"/>
  <line x1="260" y1="60" x2="370" y2="150" stroke="var(--da-border)" stroke-width="2"/>
  <line x1="150" y1="150" x2="90" y2="250" stroke="var(--da-accent)" stroke-width="3"/>
  <line x1="150" y1="150" x2="210" y2="250" stroke="var(--da-accent)" stroke-width="3"/>
  <line x1="370" y1="150" x2="310" y2="250" stroke="var(--da-border)" stroke-width="2"/>
  <line x1="370" y1="150" x2="430" y2="250" stroke="var(--da-border)" stroke-width="2"/>
  <circle cx="260" cy="60" r="24" fill="var(--da-surface)" stroke="var(--da-primary)" stroke-width="3"/>
  <text x="260" y="66" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-primary)">1</text>
  <text x="260" y="102" text-anchor="middle" font-size="11" font-family="inherit" fill="var(--da-muted)">i=0</text>
  <circle cx="150" cy="150" r="24" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="150" y="156" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">3</text>
  <text x="150" y="192" text-anchor="middle" font-size="11" font-family="inherit" fill="var(--da-muted)">i=1</text>
  <circle cx="370" cy="150" r="24" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="370" y="156" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">2</text>
  <text x="370" y="192" text-anchor="middle" font-size="11" font-family="inherit" fill="var(--da-muted)">i=2</text>
  <circle cx="90" cy="250" r="24" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="90" y="256" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">7</text>
  <text x="90" y="292" text-anchor="middle" font-size="11" font-family="inherit" fill="var(--da-muted)">i=3</text>
  <circle cx="210" cy="250" r="24" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="210" y="256" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">4</text>
  <text x="210" y="292" text-anchor="middle" font-size="11" font-family="inherit" fill="var(--da-muted)">i=4</text>
  <circle cx="310" cy="250" r="24" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="310" y="256" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">5</text>
  <text x="310" y="292" text-anchor="middle" font-size="11" font-family="inherit" fill="var(--da-muted)">i=5</text>
  <circle cx="430" cy="250" r="24" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="430" y="256" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">9</text>
  <text x="430" y="292" text-anchor="middle" font-size="11" font-family="inherit" fill="var(--da-muted)">i=6</text>
  <text x="300" y="58" font-size="12" font-family="inherit" fill="var(--da-primary)">kök = en küçük</text>
  <rect x="520" y="120" width="48" height="48" fill="var(--da-surface)" stroke="var(--da-border)" stroke-width="1.5"/>
  <text x="544.0" y="151" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">1</text>
  <text x="544.0" y="188" text-anchor="middle" font-size="12" font-family="inherit" fill="var(--da-muted)">0</text>
  <rect x="568" y="120" width="48" height="48" fill="var(--da-surface)" stroke="var(--da-accent)" stroke-width="2.5"/>
  <text x="592.0" y="151" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">3</text>
  <text x="592.0" y="188" text-anchor="middle" font-size="12" font-family="inherit" fill="var(--da-muted)">1</text>
  <rect x="616" y="120" width="48" height="48" fill="var(--da-surface)" stroke="var(--da-border)" stroke-width="1.5"/>
  <text x="640.0" y="151" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">2</text>
  <text x="640.0" y="188" text-anchor="middle" font-size="12" font-family="inherit" fill="var(--da-muted)">2</text>
  <rect x="664" y="120" width="48" height="48" fill="var(--da-surface)" stroke="var(--da-accent)" stroke-width="2.5"/>
  <text x="688.0" y="151" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">7</text>
  <text x="688.0" y="188" text-anchor="middle" font-size="12" font-family="inherit" fill="var(--da-muted)">3</text>
  <rect x="712" y="120" width="48" height="48" fill="var(--da-surface)" stroke="var(--da-accent)" stroke-width="2.5"/>
  <text x="736.0" y="151" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">4</text>
  <text x="736.0" y="188" text-anchor="middle" font-size="12" font-family="inherit" fill="var(--da-muted)">4</text>
  <rect x="760" y="120" width="48" height="48" fill="var(--da-surface)" stroke="var(--da-border)" stroke-width="1.5"/>
  <text x="784.0" y="151" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">5</text>
  <text x="784.0" y="188" text-anchor="middle" font-size="12" font-family="inherit" fill="var(--da-muted)">5</text>
  <rect x="808" y="120" width="48" height="48" fill="var(--da-surface)" stroke="var(--da-border)" stroke-width="1.5"/>
  <text x="832.0" y="151" text-anchor="middle" font-size="17" font-weight="600" font-family="inherit" fill="var(--da-fg)">9</text>
  <text x="832.0" y="188" text-anchor="middle" font-size="12" font-family="inherit" fill="var(--da-muted)">6</text>
  <path d="M 592.0 120 C 592.0 70, 688.0 70, 688.0 116" fill="none" stroke="var(--da-accent)" stroke-width="2" marker-end="url(#ok)"/>
  <path d="M 592.0 120 C 592.0 70, 736.0 70, 736.0 116" fill="none" stroke="var(--da-accent)" stroke-width="2" marker-end="url(#ok)"/>
  <text x="660.0" y="74" text-anchor="middle" font-size="12" font-family="inherit" fill="var(--da-accent)">i=1 → 2·1+1=3, 2·1+2=4</text>
  <text x="520" y="240" font-size="14" font-family="inherit" fill="var(--da-fg)">sol çocuk: 2i + 1</text>
  <text x="520" y="266" font-size="14" font-family="inherit" fill="var(--da-fg)">sağ çocuk: 2i + 2</text>
  <text x="520" y="292" font-size="14" font-family="inherit" fill="var(--da-fg)">ebeveyn: (i − 1) // 2</text>
  <rect x="40" y="370" width="820" height="50" rx="10" fill="var(--da-surface)" stroke="var(--da-border)"/>
  <text x="60" y="392" font-size="13" font-family="inherit" fill="var(--da-success)">push: sona ekle → sift-up (ebeveynden küçükse yer değiştir) · O(log n)</text>
  <text x="60" y="410" font-size="13" font-family="inherit" fill="var(--da-danger)">pop: kökü al, son elemanı köke taşı → sift-down (küçük çocukla yer değiştir) · O(log n)</text>
</svg>
