<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Graf, komşuluk listesi ve BFS katmanları</title>
  <desc id="desc">Solda A'dan F'ye altı düğümlü yönsüz bir graf; ortada aynı grafın komşuluk listesi; sağda A'dan başlayan BFS'nin oluşturduğu mesafe katmanları: 0'da A, 1'de B ve C, 2'de D ve E, 3'te F.</desc>

  <text x="160" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg)">Graf (yönsüz)</text>
  <text x="455" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg)">Komşuluk listesi</text>
  <text x="745" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg)">BFS katmanları (A'dan)</text>

  <!-- Kenarlar -->
  <g stroke="var(--da-muted)" stroke-width="2">
    <line x1="60" y1="200" x2="150" y2="110"/>
    <line x1="60" y1="200" x2="150" y2="290"/>
    <line x1="150" y1="110" x2="250" y2="110"/>
    <line x1="150" y1="290" x2="250" y2="110"/>
    <line x1="150" y1="290" x2="250" y2="290"/>
    <line x1="250" y1="110" x2="300" y2="200"/>
    <line x1="250" y1="290" x2="300" y2="200"/>
  </g>

  <!-- Düğümler -->
  <g stroke-width="2">
    <circle cx="60" cy="200" r="22" fill="var(--da-primary)" stroke="var(--da-primary)"/>
    <circle cx="150" cy="110" r="22" fill="var(--da-surface)" stroke="var(--da-primary)"/>
    <circle cx="150" cy="290" r="22" fill="var(--da-surface)" stroke="var(--da-primary)"/>
    <circle cx="250" cy="110" r="22" fill="var(--da-surface)" stroke="var(--da-accent)"/>
    <circle cx="250" cy="290" r="22" fill="var(--da-surface)" stroke="var(--da-accent)"/>
    <circle cx="300" cy="200" r="22" fill="var(--da-surface)" stroke="var(--da-success)"/>
  </g>
  <g font-size="15" font-weight="600" text-anchor="middle" fill="var(--da-fg)">
    <text x="60" y="205" fill="var(--da-surface)">A</text>
    <text x="150" y="115">B</text>
    <text x="150" y="295">C</text>
    <text x="250" y="115">D</text>
    <text x="250" y="295">E</text>
    <text x="300" y="205">F</text>
  </g>
  <text x="180" y="360" text-anchor="middle" font-size="12" fill="var(--da-muted)">V = 6 düğüm, E = 7 kenar</text>

  <!-- Komşuluk listesi -->
  <rect x="360" y="60" width="190" height="270" rx="12" fill="var(--da-surface)" stroke="var(--da-border)"/>
  <g font-size="14" fill="var(--da-fg)">
    <text x="380" y="98">A → B, C</text>
    <text x="380" y="138">B → A, D</text>
    <text x="380" y="178">C → A, D, E</text>
    <text x="380" y="218">D → B, C, F</text>
    <text x="380" y="258">E → C, F</text>
    <text x="380" y="298">F → D, E</text>
  </g>
  <text x="455" y="360" text-anchor="middle" font-size="12" fill="var(--da-muted)">Bellek: O(V + E)</text>

  <!-- BFS katmanları -->
  <g font-size="13" fill="var(--da-muted)">
    <text x="610" y="95">mesafe 0</text>
    <text x="610" y="165">mesafe 1</text>
    <text x="610" y="235">mesafe 2</text>
    <text x="610" y="305">mesafe 3</text>
  </g>
  <g stroke-width="2">
    <rect x="690" y="70" width="180" height="40" rx="10" fill="var(--da-surface)" stroke="var(--da-primary)"/>
    <rect x="690" y="140" width="180" height="40" rx="10" fill="var(--da-surface)" stroke="var(--da-primary)"/>
    <rect x="690" y="210" width="180" height="40" rx="10" fill="var(--da-surface)" stroke="var(--da-accent)"/>
    <rect x="690" y="280" width="180" height="40" rx="10" fill="var(--da-surface)" stroke="var(--da-success)"/>
  </g>
  <g font-size="15" font-weight="600" text-anchor="middle" fill="var(--da-fg)">
    <text x="780" y="95">A</text>
    <text x="780" y="165">B   C</text>
    <text x="780" y="235">D   E</text>
    <text x="780" y="305">F</text>
  </g>
  <text x="745" y="360" text-anchor="middle" font-size="12" fill="var(--da-muted)">FIFO kuyruk: önce yakın katman işlenir</text>
</svg>
