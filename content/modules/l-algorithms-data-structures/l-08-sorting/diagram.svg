  <title id="title">Merge sort ve quick sort</title>
  <desc id="desc">Solda 8 elemanlı [38, 27, 43, 3, 9, 82, 10, 5] dizisi merge sort ile tek elemanlı parçalara bölünüp üç seviyede sıralı biçimde birleştiriliyor. Sağda quick sort'un bölümleme adımı: pivot 5 seçiliyor, küçükler sola, büyükler sağa toplanıyor ve pivot son yerine oturuyor.</desc>
  <text x="280" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg)">Merge sort: böl ve birleştir</text>
  <text x="720" y="36" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg)">Quick sort: bölümleme</text>
