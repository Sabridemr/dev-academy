<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Hash tablosu: anahtar, hash fonksiyonu ve kovalar</title>
  <desc id="desc">Solda dört anahtar, ortada hash fonksiyonu, sağda 0'dan 7'ye numaralı sekiz kova. elma ve kiraz anahtarları 2 numaralı kovaya düşer ve zincirleme ile aynı kovada bir liste oluşturur.</desc>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted)"/>
    </marker>
    <marker id="ok-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger)"/>
    </marker>
  </defs>

  <text x="110" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-fg)">Anahtarlar</text>
  <text x="360" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-fg)">hash(k) % 8</text>
  <text x="620" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-fg)">Kovalar</text>

  <g fill="var(--da-surface)" stroke="var(--da-border)" stroke-width="1.5">
    <rect x="40" y="80" width="140" height="44" rx="10"/>
    <rect x="40" y="160" width="140" height="44" rx="10"/>
    <rect x="40" y="240" width="140" height="44" rx="10"/>
    <rect x="40" y="320" width="140" height="44" rx="10"/>
  </g>
  <g font-size="14" fill="var(--da-fg)" text-anchor="middle">
    <text x="110" y="107">"elma"</text>
    <text x="110" y="187">"armut"</text>
    <text x="110" y="267">"kiraz"</text>
    <text x="110" y="347">"erik"</text>
  </g>

  <rect x="290" y="150" width="140" height="140" rx="16" fill="var(--da-surface)" stroke="var(--da-primary)" stroke-width="2"/>
  <text x="360" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-primary)">hash</text>
  <text x="360" y="234" text-anchor="middle" font-size="12" fill="var(--da-muted)">fonksiyonu</text>

  <g stroke="var(--da-muted)" stroke-width="1.6" fill="none" marker-end="url(#ok)">
    <path d="M 180 102 C 240 102, 250 180, 288 190"/>
    <path d="M 180 182 L 288 205"/>
    <path d="M 180 262 L 288 235"/>
    <path d="M 180 342 C 240 342, 250 260, 288 250"/>
  </g>

  <g fill="var(--da-surface)" stroke="var(--da-border)" stroke-width="1.5">
    <rect x="560" y="60" width="120" height="40" rx="6"/>
    <rect x="560" y="100" width="120" height="40" rx="6"/>
    <rect x="560" y="140" width="120" height="40" rx="6"/>
    <rect x="560" y="180" width="120" height="40" rx="6"/>
    <rect x="560" y="220" width="120" height="40" rx="6"/>
    <rect x="560" y="260" width="120" height="40" rx="6"/>
    <rect x="560" y="300" width="120" height="40" rx="6"/>
    <rect x="560" y="340" width="120" height="40" rx="6"/>
  </g>
  <g font-size="12" fill="var(--da-muted)" text-anchor="end">
    <text x="550" y="85">0</text>
    <text x="550" y="125">1</text>
    <text x="550" y="165">2</text>
    <text x="550" y="205">3</text>
    <text x="550" y="245">4</text>
    <text x="550" y="285">5</text>
    <text x="550" y="325">6</text>
    <text x="550" y="365">7</text>
  </g>
  <g font-size="13" fill="var(--da-fg)" text-anchor="middle">
    <text x="620" y="165">elma: 3</text>
    <text x="620" y="285">armut: 1</text>
    <text x="620" y="365">erik: 4</text>
  </g>
  <g font-size="12" fill="var(--da-muted)" text-anchor="middle">
    <text x="620" y="85">boş</text>
    <text x="620" y="125">boş</text>
    <text x="620" y="205">boş</text>
    <text x="620" y="245">boş</text>
    <text x="620" y="325">boş</text>
  </g>

  <g stroke="var(--da-primary)" stroke-width="1.8" fill="none" marker-end="url(#ok)">
    <path d="M 430 190 C 500 190, 510 160, 558 160"/>
    <path d="M 430 220 C 500 220, 510 280, 558 280"/>
    <path d="M 430 255 C 500 255, 510 360, 558 360"/>
  </g>
  <path d="M 430 240 C 490 240, 500 172, 558 168" stroke="var(--da-danger)" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#ok-c)"/>
  <text x="470" y="300" font-size="11" fill="var(--da-danger)" text-anchor="middle">kiraz da 2'ye düştü</text>

  <rect x="720" y="140" width="130" height="40" rx="6" fill="var(--da-surface)" stroke="var(--da-accent)" stroke-width="1.8"/>
  <text x="785" y="165" text-anchor="middle" font-size="13" fill="var(--da-fg)">kiraz: 2</text>
  <path d="M 680 160 L 718 160" stroke="var(--da-accent)" stroke-width="1.8" fill="none" marker-end="url(#ok)"/>
  <text x="785" y="125" text-anchor="middle" font-size="12" fill="var(--da-accent)">zincir (çakışma)</text>

  <rect x="720" y="250" width="160" height="90" rx="10" fill="var(--da-surface)" stroke="var(--da-border)"/>
  <text x="800" y="275" text-anchor="middle" font-size="12" fill="var(--da-fg)">yük faktörü</text>
  <text x="800" y="298" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-success)">4 / 8 = 0,5</text>
  <text x="800" y="320" text-anchor="middle" font-size="11" fill="var(--da-muted)">eşik 0,75 aşılınca × 2</text>

  <text x="450" y="420" text-anchor="middle" font-size="12" fill="var(--da-muted)">Arama: kovayı O(1) ile bul, sonra kovadaki kısa zinciri eşitlikle tara.</text>
</svg>
