  <text x="236" y="126" text-anchor="middle" font-size="11" fill="var(--da-muted)">[0]</text>
  <rect x="280" y="60" width="72" height="48" rx="6" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
