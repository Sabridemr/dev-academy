  <text x="396" y="126" text-anchor="middle" font-size="11" fill="var(--da-muted)">[2]</text>
  <rect x="440" y="60" width="72" height="48" rx="6" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="476" y="90" text-anchor="middle" font-size="16" fill="var(--da-fg)">1</text>
  <text x="476" y="126" text-anchor="middle" font-size="11" fill="var(--da-muted)">[3]</text>
  <rect x="520" y="60" width="72" height="48" rx="6" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
