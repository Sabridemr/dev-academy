<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Dizi bellek düzeni, kayan pencere ve iki işaretçi</title>
  <desc id="desc">Üstte bellekte ardışık duran altı hücreli bir dizi ve her hücrenin adresi: taban adres artı indeks çarpı sekiz. Ortada üç elemanlık bir pencerenin bir adım sağa kayması. Altta sıralı bir dizide soldan ve sağdan içeri doğru ilerleyen iki işaretçi.</desc>
