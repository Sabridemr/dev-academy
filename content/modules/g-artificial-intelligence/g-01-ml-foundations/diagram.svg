<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Öğrenme türleri, veri ayrımı ve overfitting eğrisi</title>
  <desc id="desc">Solda üç öğrenme türü kutusu: gözetimli (etiketli örnekler), gözetimsiz (etiketsiz yapı), pekiştirmeli (durum, eylem, ödül). Sağ üstte veri kümesinin eğitim, doğrulama ve test olarak bölünmüş çubuğu; sağ altta model karmaşıklığına karşı eğitim hatası (sürekli düşen) ve doğrulama hatası (U şeklinde) eğrileri, underfitting ve overfitting bölgeleri işaretli.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- Sol: öğrenme türleri -->
  <text x="150" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-fg, #0f172a)">Öğrenme türleri</text>

  <rect x="30" y="52" width="240" height="96" rx="12" fill="var(--da-primary, #6366f1)" opacity="0.1" stroke="var(--da-primary, #6366f1)" stroke-width="1.5"/>
  <text x="46" y="76" font-size="13" font-weight="600" fill="var(--da-primary, #6366f1)">Supervised</text>
  <text x="46" y="96" font-size="11.5" fill="var(--da-fg, #0f172a)">(x, y) çiftleri → f(x) ≈ y</text>
  <text x="46" y="114" font-size="11" fill="var(--da-muted, #64748b)">sınıflandırma · regresyon</text>
  <text x="46" y="132" font-size="11" fill="var(--da-muted, #64748b)">spam filtresi, fiyat tahmini</text>

  <rect x="30" y="164" width="240" height="96" rx="12" fill="var(--da-accent, #f59e0b)" opacity="0.12" stroke="var(--da-accent, #f59e0b)" stroke-width="1.5"/>
  <text x="46" y="188" font-size="13" font-weight="600" fill="var(--da-accent, #f59e0b)">Unsupervised</text>
  <text x="46" y="208" font-size="11.5" fill="var(--da-fg, #0f172a)">yalnızca x → yapıyı keşfet</text>
  <text x="46" y="226" font-size="11" fill="var(--da-muted, #64748b)">kümeleme · PCA · anomali</text>
  <text x="46" y="244" font-size="11" fill="var(--da-muted, #64748b)">müşteri segmentleri</text>

  <rect x="30" y="276" width="240" height="96" rx="12" fill="var(--da-success, #10b981)" opacity="0.12" stroke="var(--da-success, #10b981)" stroke-width="1.5"/>
  <text x="46" y="300" font-size="13" font-weight="600" fill="var(--da-success, #10b981)">Reinforcement</text>
  <text x="46" y="320" font-size="11.5" fill="var(--da-fg, #0f172a)">durum → eylem → ödül</text>
  <text x="46" y="338" font-size="11" fill="var(--da-muted, #64748b)">politika: uzun vadeli ödülü artır</text>
  <text x="46" y="356" font-size="11" fill="var(--da-muted, #64748b)">oyun, robot, RLHF</text>

  <!-- Ayırıcı -->
  <line x1="300" y1="40" x2="300" y2="400" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="4 4"/>

  <!-- Sağ üst: veri ayrımı -->
  <text x="600" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-fg, #0f172a)">Veri ayrımı (önce böl, sonra dönüştür)</text>
  <rect x="340" y="52" width="364" height="30" rx="6" fill="var(--da-primary, #6366f1)" opacity="0.85"/>
  <rect x="704" y="52" width="78" height="30" fill="var(--da-accent, #f59e0b)" opacity="0.85"/>
  <rect x="782" y="52" width="78" height="30" rx="6" fill="var(--da-muted, #64748b)" opacity="0.7"/>
  <text x="522" y="72" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-surface, #ffffff)">Train %70</text>
  <text x="743" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="var(--da-surface, #ffffff)">Val %15</text>
  <text x="821" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="var(--da-surface, #ffffff)">Test %15</text>
  <text x="522" y="100" text-anchor="middle" font-size="10.5" fill="var(--da-muted, #64748b)">parametreleri öğren</text>
  <text x="743" y="100" text-anchor="middle" font-size="10.5" fill="var(--da-muted, #64748b)">model seç</text>
  <text x="821" y="100" text-anchor="middle" font-size="10.5" fill="var(--da-muted, #64748b)">1 kez rapor</text>

  <!-- Sağ alt: hata eğrileri -->
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M 360 380 L 360 130"/>
    <path d="M 360 380 L 870 380"/>
  </g>
  <text x="352" y="135" text-anchor="end" font-size="11" fill="var(--da-muted, #64748b)">hata</text>
  <text x="860" y="398" text-anchor="end" font-size="11" fill="var(--da-muted, #64748b)">model karmaşıklığı →</text>

  <!-- Bölgeler -->
  <rect x="362" y="132" width="150" height="246" fill="var(--da-accent, #f59e0b)" opacity="0.07"/>
  <rect x="690" y="132" width="178" height="246" fill="var(--da-danger, #ef4444)" opacity="0.07"/>
  <text x="437" y="150" text-anchor="middle" font-size="11" fill="var(--da-accent, #f59e0b)">underfitting</text>
  <text x="437" y="164" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">yüksek bias</text>
  <text x="779" y="150" text-anchor="middle" font-size="11" fill="var(--da-danger, #ef4444)">overfitting</text>
  <text x="779" y="164" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">yüksek variance</text>

  <!-- Tatlı nokta -->
  <line x1="600" y1="132" x2="600" y2="378" stroke="var(--da-success, #10b981)" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="600" y="150" text-anchor="middle" font-size="11" fill="var(--da-success, #10b981)">tatlı nokta</text>

  <!-- Eğitim hatası: sürekli düşer -->
  <path d="M 372 200 C 450 250, 540 320, 620 345 S 800 368, 860 372" fill="none" stroke="var(--da-primary, #6366f1)" stroke-width="2.5"/>
  <!-- Doğrulama hatası: U -->
  <path d="M 372 210 C 450 270, 530 300, 600 300 S 760 240, 860 180" fill="none" stroke="var(--da-danger, #ef4444)" stroke-width="2.5" stroke-dasharray="7 4"/>
  <circle cx="600" cy="300" r="5" fill="var(--da-success, #10b981)"/>

  <!-- Legend -->
  <line x1="640" y1="330" x2="670" y2="330" stroke="var(--da-primary, #6366f1)" stroke-width="2.5"/>
  <text x="676" y="334" font-size="11" fill="var(--da-fg, #0f172a)">eğitim hatası</text>
  <line x1="640" y1="350" x2="670" y2="350" stroke="var(--da-danger, #ef4444)" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="676" y="354" font-size="11" fill="var(--da-fg, #0f172a)">doğrulama hatası</text>

  <!-- Alt not -->
  <text x="450" y="426" text-anchor="middle" font-size="11.5" fill="var(--da-muted, #64748b)">Hata ≈ Bias² + Variance + gürültü — karmaşıklık arttıkça bias düşer, variance yükselir; doğrulama minimumu seçilir.</text>
</svg>
