<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Üç üretim AI sistemi: öneri hunisi, arama sıralaması, fraud skorlama</title>
  <desc id="desc">Üç sütun. Sol: öneri hunisi — 300 milyon ürün, aday üretimi ile 500'e, sıralama ile 20'ye iner; yanında bütçeler 15, 30, 5 ms; altında batch ve stream özellik akışı. Orta: arama sıralaması — sorgu anlama, hibrit geri getirme (BM25 + vektör), learning to rank, cross-encoder yeniden sıralama. Sağ: gerçek zamanlı fraud — işlem, gerçek zamanlı sayaçlar ve grafik özellikleri, GBDT model, üç yollu karar (onayla, ek doğrulama, reddet), 50 ms bütçe, gecikmeli ters ibraz etiketi.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- Sol: öneri hunisi -->
  <text x="150" y="26" text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--da-fg, #0f172a)">Öneri hunisi (100 ms)</text>
  <rect x="20" y="36" width="260" height="410" rx="12" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
  <!-- huni şekli -->
  <polygon points="40,60 260,60 215,150 85,150" fill="var(--da-primary, #6366f1)" opacity="0.12" stroke="var(--da-primary, #6366f1)"/>
  <polygon points="85,156 215,156 185,246 115,246" fill="var(--da-primary, #6366f1)" opacity="0.22" stroke="var(--da-primary, #6366f1)"/>
  <polygon points="115,252 185,252 170,320 130,320" fill="var(--da-primary, #6366f1)" opacity="0.4" stroke="var(--da-primary, #6366f1)"/>
  <g font-size="11" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <text x="150" y="86" font-weight="600">300M ürün → 500 aday</text>
    <text x="150" y="104" font-size="10" fill="var(--da-muted, #64748b)">two-tower + ANN · birlikte satın alma</text>
    <text x="150" y="120" font-size="10" fill="var(--da-muted, #64748b)">popüler · trend</text>
    <text x="150" y="190" font-weight="600">500 → 500 skor</text>
    <text x="150" y="208" font-size="10" fill="var(--da-muted, #64748b)">GBDT / DNN · 400 özellik</text>
    <text x="150" y="224" font-size="10" fill="var(--da-muted, #64748b)">p(satın alma) × marj</text>
    <text x="150" y="282" font-weight="600">→ 20</text>
    <text x="150" y="300" font-size="9.5" fill="var(--da-muted, #64748b)">çeşitlilik · stok · keşif</text>
  </g>
  <g font-size="10" fill="var(--da-accent, #f59e0b)" font-weight="600">
    <text x="232" y="110">15 ms</text><text x="208" y="205">30 ms</text><text x="186" y="290">5 ms</text>
  </g>
  <!-- özellik akışı -->
  <rect x="36" y="340" width="228" height="92" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="4 3"/>
  <text x="150" y="358" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--da-fg, #0f172a)">Özellik tazeliği</text>
  <g font-size="9.5" fill="var(--da-muted, #64748b)">
    <text x="46" y="376">• batch (gece): ürün CTR, kullanıcı vektörü</text>
    <text x="46" y="392">• stream (saniye): oturum içi kategoriler</text>
    <text x="46" y="408">• istek anı (ms): cihaz, sayfa, saat</text>
    <text x="46" y="424" fill="var(--da-danger, #ef4444)">• her aşamaya zaman aşımı + fallback</text>
  </g>

  <!-- Orta: arama sıralaması -->
  <text x="450" y="26" text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--da-fg, #0f172a)">Arama sıralaması (LTR)</text>
  <rect x="320" y="36" width="260" height="410" rx="12" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
  <g font-size="10.5" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <rect x="345" y="56" width="210" height="44" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
    <text x="450" y="74" font-weight="600">Sorgu anlama</text>
    <text x="450" y="90" font-size="9.5" fill="var(--da-muted, #64748b)">yazım · eşanlamlı · niyet · gömme</text>

    <rect x="345" y="118" width="210" height="58" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.12" stroke="var(--da-primary, #6366f1)"/>
    <text x="450" y="138" font-weight="600">Geri getirme (hibrit)</text>
    <text x="450" y="154" font-size="9.5" fill="var(--da-muted, #64748b)">BM25 ters indeks + vektör araması</text>
    <text x="450" y="168" font-size="9.5" fill="var(--da-muted, #64748b)">→ binlerce aday</text>

    <rect x="345" y="194" width="210" height="72" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.22" stroke="var(--da-primary, #6366f1)"/>
    <text x="450" y="214" font-weight="600">Learning to Rank</text>
    <text x="450" y="230" font-size="9.5" fill="var(--da-muted, #64748b)">LambdaMART (GBDT, listwise)</text>
    <text x="450" y="244" font-size="9.5" fill="var(--da-muted, #64748b)">BM25 · başlık eşleşme · CTR · fiyat · stok</text>
    <text x="450" y="258" font-size="9.5" fill="var(--da-muted, #64748b)">pointwise &lt; pairwise &lt; listwise</text>

    <rect x="345" y="284" width="210" height="44" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.4" stroke="var(--da-primary, #6366f1)"/>
    <text x="450" y="302" font-weight="600">Yeniden sıralama (ilk 50)</text>
    <text x="450" y="318" font-size="9.5" fill="var(--da-muted, #64748b)">BERT cross-encoder · iş kuralları</text>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 450 102 L 450 116"/><path d="M 450 178 L 450 192"/><path d="M 450 268 L 450 282"/>
  </g>
  <g font-size="9.5" fill="var(--da-muted, #64748b)">
    <text x="340" y="356">Etiket: insan değerlendirici (az, temiz)</text>
    <text x="340" y="372">+ tıklama logları (çok, konum yanlı → IPW)</text>
    <text x="340" y="394" fill="var(--da-fg, #0f172a)">Ölçüm: NDCG@10, MRR (offline)</text>
    <text x="340" y="410" fill="var(--da-fg, #0f172a)">→ A/B: dönüşüm, sonuçsuz arama oranı</text>
  </g>

  <!-- Sağ: fraud -->
  <text x="750" y="26" text-anchor="middle" font-size="13.5" font-weight="600" fill="var(--da-fg, #0f172a)">Fraud skorlama (50 ms)</text>
  <rect x="620" y="36" width="260" height="410" rx="12" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
  <g font-size="10.5" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <rect x="645" y="56" width="210" height="36" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
    <text x="750" y="78">İşlem: tutar · ülke · cihaz</text>

    <rect x="645" y="108" width="210" height="76" rx="8" fill="var(--da-accent, #f59e0b)" opacity="0.14" stroke="var(--da-accent, #f59e0b)"/>
    <text x="750" y="126" font-weight="600">Özellikler (&lt; 10 ms)</text>
    <text x="750" y="142" font-size="9.5" fill="var(--da-muted, #64748b)">gerçek zamanlı sayaçlar: kart/saat, cihaz/gün</text>
    <text x="750" y="156" font-size="9.5" fill="var(--da-muted, #64748b)">grafik: paylaşılan adres · e-posta · cihaz</text>
    <text x="750" y="170" font-size="9.5" fill="var(--da-muted, #64748b)">profil: olağan harcama deseni</text>

    <rect x="645" y="200" width="210" height="44" rx="8" fill="var(--da-primary, #6366f1)" opacity="0.18" stroke="var(--da-primary, #6366f1)"/>
    <text x="750" y="218" font-weight="600">Model: GBDT (+ DNN)</text>
    <text x="750" y="234" font-size="9.5" fill="var(--da-muted, #64748b)">skor 0–1 · açıklanabilir · ~15 ms</text>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M 750 94 L 750 106"/><path d="M 750 186 L 750 198"/>
    <path d="M 690 246 L 672 268"/><path d="M 750 246 L 750 268"/><path d="M 810 246 L 828 268"/>
  </g>
  <rect x="632" y="270" width="72" height="40" rx="8" fill="var(--da-success, #10b981)" opacity="0.18" stroke="var(--da-success, #10b981)"/>
  <text x="668" y="288" text-anchor="middle" font-size="10" fill="var(--da-fg, #0f172a)">onayla</text>
  <text x="668" y="302" text-anchor="middle" font-size="9" fill="var(--da-muted, #64748b)">skor &lt; 0.2</text>
  <rect x="714" y="270" width="72" height="40" rx="8" fill="var(--da-accent, #f59e0b)" opacity="0.18" stroke="var(--da-accent, #f59e0b)"/>
  <text x="750" y="288" text-anchor="middle" font-size="10" fill="var(--da-fg, #0f172a)">ek doğrulama</text>
  <text x="750" y="302" text-anchor="middle" font-size="9" fill="var(--da-muted, #64748b)">3-D Secure</text>
  <rect x="796" y="270" width="72" height="40" rx="8" fill="var(--da-danger, #ef4444)" opacity="0.18" stroke="var(--da-danger, #ef4444)"/>
  <text x="832" y="288" text-anchor="middle" font-size="10" fill="var(--da-fg, #0f172a)">reddet</text>
  <text x="832" y="302" text-anchor="middle" font-size="9" fill="var(--da-muted, #64748b)">skor &gt; 0.9</text>
  <g font-size="9.5" fill="var(--da-muted, #64748b)">
    <text x="640" y="340">Eşik = FP maliyeti (kayıp müşteri) vs. FN (dolandırıcılık)</text>
    <text x="640" y="358">Etiket gecikmeli: chargeback 30–90 gün sonra</text>
    <text x="640" y="376">→ manuel inceleme ara etiket</text>
    <text x="640" y="398" fill="var(--da-danger, #ef4444)">Düşmanca ortam: sürekli concept drift</text>
    <text x="640" y="414" fill="var(--da-danger, #ef4444)">→ haftalık eğitim + kural motoru (anında yama)</text>
  </g>

  <text x="450" y="468" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">Ortak desen: ucuz/geniş → pahalı/dar · önceden hesapla · katmanlı tazelik · bütçe + fallback · her şeyi logla · A/B ile karar ver</text>
</svg>
