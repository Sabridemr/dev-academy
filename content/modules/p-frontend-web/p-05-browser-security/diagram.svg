<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Tarayıcının üç güvenlik kapısı</title>
  <desc id="desc">Tarayıcı kutusu içinde üç kapı. Birinci kapı SOP ve CORS: farklı origin'deki API'ye giden PUT isteğinden önce OPTIONS ön uçuşu gider; izin başlığı dönerse asıl istek gönderilir. İkinci kapı CSP: nonce taşıyan script çalışır, nonce'suz enjekte inline script engellenir. Üçüncü kapı çerez öznitelikleri: HttpOnly çerez JavaScript'ten gizlenir, SameSite başka siteden gelen isteklere çerez eklenmesini engeller.</desc>
  <defs>
    <marker id="p05-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">Tarayıcı üç kapı tutar</text>

  <!-- Tarayıcı çerçevesi -->
  <rect x="30" y="50" width="640" height="350" rx="14" fill="var(--da-surface, #fff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
  <text x="50" y="74" font-size="12" font-weight="600" fill="var(--da-muted, #64748b)">Tarayıcı — sayfa: https://app.devacademy.dev</text>

  <!-- API -->
  <rect x="740" y="90" width="190" height="80" rx="12" fill="var(--da-surface, #fff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="835" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">https://api.devacademy.dev</text>
  <text x="835" y="142" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">farklı origin (host farklı)</text>

  <!-- Kapı 1: CORS -->
  <rect x="50" y="90" width="600" height="96" rx="10" fill="var(--da-primary, #2563eb)" fill-opacity="0.07" stroke="var(--da-primary, #2563eb)" stroke-width="1.2"/>
  <text x="66" y="112" font-size="13" font-weight="700" fill="var(--da-primary, #2563eb)">1 · SOP + CORS: hangi yanıt okunabilir?</text>
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="66" y="136">① OPTIONS + Origin + Access-Control-Request-Method: PUT</text>
    <text x="66" y="156">② 204 + Access-Control-Allow-Origin: https://app.devacademy.dev</text>
    <text x="66" y="176">③ Asıl PUT gider; izin yoksa hiç gönderilmez</text>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.5" fill="none">
    <line x1="560" y1="125" x2="736" y2="118" marker-end="url(#p05-arrow)"/>
    <line x1="736" y1="145" x2="560" y2="150" marker-end="url(#p05-arrow)"/>
  </g>

  <!-- Kapı 2: CSP -->
  <rect x="50" y="200" width="600" height="96" rx="10" fill="var(--da-success, #059669)" fill-opacity="0.07" stroke="var(--da-success, #059669)" stroke-width="1.2"/>
  <text x="66" y="222" font-size="13" font-weight="700" fill="var(--da-success, #059669)">2 · CSP: hangi kod çalışabilir?</text>
  <text x="66" y="244" font-size="11" fill="var(--da-muted, #64748b)">Content-Security-Policy: script-src 'self' 'nonce-R4nd'</text>
  <rect x="66" y="254" width="250" height="30" rx="6" fill="var(--da-success, #059669)" fill-opacity="0.15"/>
  <text x="191" y="274" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">&lt;script nonce="R4nd"&gt; ✓ çalışır</text>
  <rect x="340" y="254" width="290" height="30" rx="6" fill="var(--da-danger, #dc2626)" fill-opacity="0.15"/>
  <text x="485" y="274" text-anchor="middle" font-size="12" fill="var(--da-danger, #dc2626)">enjekte &lt;script&gt; (nonce yok) ✗ engellenir</text>

  <!-- Kapı 3: Çerez -->
  <rect x="50" y="310" width="600" height="76" rx="10" fill="var(--da-warning, #d97706)" fill-opacity="0.07" stroke="var(--da-warning, #d97706)" stroke-width="1.2"/>
  <text x="66" y="332" font-size="13" font-weight="700" fill="var(--da-warning, #d97706)">3 · Çerez öznitelikleri: kimlik bilgisi nereye gider?</text>
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="66" y="354">HttpOnly → document.cookie göremez (XSS çalamaz)</text>
    <text x="66" y="374">SameSite=Lax → başka siteden gelen POST'a eklenmez (CSRF)  ·  Secure → yalnızca HTTPS</text>
  </g>

  <!-- Not -->
  <g font-size="12" fill="var(--da-muted, #64748b)">
    <text x="700" y="230">SOP göndermeyi değil,</text>
    <text x="700" y="248">yanıtı okumayı engeller.</text>
    <text x="700" y="284">CORS ≠ yetkilendirme:</text>
    <text x="700" y="302">curl CORS'u umursamaz.</text>
    <text x="700" y="338">CORS CSRF'i önlemez:</text>
    <text x="700" y="356">basit istek zaten gönderildi.</text>
  </g>
</svg>
