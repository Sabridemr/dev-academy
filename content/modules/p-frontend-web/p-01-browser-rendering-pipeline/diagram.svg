<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Kritik render yolu</title>
  <desc id="desc">HTML ayrıştırılarak DOM'a, CSS ayrıştırılarak CSSOM'a dönüşür. İkisi birleşip render ağacını oluşturur; ardından layout, paint ve composite adımları sırayla çalışır ve piksel ekrana basılır. Defer'siz bir script etiketi HTML ayrıştırmayı durdurur; CSS ise yalnızca çizimi bekletir.</desc>
  <defs>
    <marker id="p01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">Baytlardan piksellere: kritik render yolu</text>

  <!-- Girdi dosyaları -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="30" y="70" width="120" height="50" rx="10" fill="var(--da-surface, #fff)" stroke="var(--da-primary, #2563eb)" stroke-width="1.5"/>
    <text x="90" y="100" fill="var(--da-fg, #0f172a)">index.html</text>
    <rect x="30" y="250" width="120" height="50" rx="10" fill="var(--da-surface, #fff)" stroke="var(--da-accent, #0891b2)" stroke-width="1.5"/>
    <text x="90" y="280" fill="var(--da-fg, #0f172a)">app.css</text>
  </g>

  <!-- DOM ve CSSOM -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="220" y="70" width="140" height="50" rx="10" fill="var(--da-primary, #2563eb)" fill-opacity="0.12" stroke="var(--da-primary, #2563eb)" stroke-width="1.5"/>
    <text x="290" y="100" fill="var(--da-fg, #0f172a)">DOM</text>
    <rect x="220" y="250" width="140" height="50" rx="10" fill="var(--da-accent, #0891b2)" fill-opacity="0.12" stroke="var(--da-accent, #0891b2)" stroke-width="1.5"/>
    <text x="290" y="280" fill="var(--da-fg, #0f172a)">CSSOM</text>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.5" fill="none" marker-end="url(#p01-arrow)">
    <line x1="150" y1="95" x2="216" y2="95"/>
    <line x1="150" y1="275" x2="216" y2="275"/>
    <path d="M 360 95 C 400 95 400 170 432 178"/>
    <path d="M 360 275 C 400 275 400 200 432 194"/>
    <line x1="560" y1="185" x2="586" y2="185"/>
    <line x1="700" y1="185" x2="726" y2="185"/>
    <line x1="840" y1="185" x2="866" y2="185"/>
  </g>
  <g font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="183" y="88">ayrıştır</text>
    <text x="183" y="268">ayrıştır</text>
  </g>

  <!-- Boru hattı -->
  <g font-size="13" font-weight="600" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <rect x="436" y="160" width="124" height="50" rx="10" fill="var(--da-surface, #fff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
    <text x="498" y="190">Render ağacı</text>
    <rect x="590" y="160" width="110" height="50" rx="10" fill="var(--da-surface, #fff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
    <text x="645" y="190">Layout</text>
    <rect x="730" y="160" width="110" height="50" rx="10" fill="var(--da-surface, #fff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5"/>
    <text x="785" y="190">Paint</text>
    <rect x="870" y="160" width="74" height="50" rx="10" fill="var(--da-success, #059669)" fill-opacity="0.15" stroke="var(--da-success, #059669)" stroke-width="1.5"/>
    <text x="907" y="190">Piksel</text>
  </g>
  <g font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="498" y="228">görünür düğümler</text>
    <text x="645" y="228">konum + boyut</text>
    <text x="785" y="228">çizim komutları</text>
    <text x="907" y="228">composite</text>
  </g>

  <!-- Bloklama notları -->
  <line x1="290" y1="128" x2="290" y2="150" stroke="var(--da-danger, #dc2626)" stroke-width="3"/>
  <rect x="190" y="140" width="200" height="40" rx="8" fill="var(--da-danger, #dc2626)" fill-opacity="0.10" stroke="var(--da-danger, #dc2626)" stroke-width="1.2"/>
  <text x="290" y="157" text-anchor="middle" font-size="11" font-weight="600" fill="var(--da-danger, #dc2626)">&lt;script src&gt; (defer yok)</text>
  <text x="290" y="172" text-anchor="middle" font-size="11" fill="var(--da-danger, #dc2626)">HTML ayrıştırmayı durdurur</text>

  <rect x="190" y="316" width="200" height="40" rx="8" fill="var(--da-warning, #d97706)" fill-opacity="0.10" stroke="var(--da-warning, #d97706)" stroke-width="1.2"/>
  <text x="290" y="333" text-anchor="middle" font-size="11" font-weight="600" fill="var(--da-warning, #d97706)">CSS: render-blocking</text>
  <text x="290" y="348" text-anchor="middle" font-size="11" fill="var(--da-warning, #d97706)">CSSOM olmadan çizim yok</text>

  <!-- Yeniden tetikleme -->
  <g font-size="11" fill="var(--da-muted, #64748b)">
    <text x="436" y="290">Geometri değişirse (width, top): layout → paint → composite</text>
    <text x="436" y="310">Yalnızca renk değişirse: paint → composite</text>
    <text x="436" y="330">transform / opacity: çoğu zaman yalnızca composite</text>
  </g>
  <rect x="426" y="270" width="420" height="72" rx="8" fill="none" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="4 4"/>
</svg>
