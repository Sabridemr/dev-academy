<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Git'in dört alanı</title>
  <desc id="desc">Soldan sağa çalışma dizini, staging alanı, yerel depo ve uzak depo. Üst oklar git add, git commit ve git push ile ileri akışı; alt oklar git checkout, git merge, git fetch ve git pull ile geri akışı gösterir.</desc>
  <defs>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- Yerel makine çerçevesi -->
  <rect x="20" y="30" width="640" height="340" rx="16" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="6 6"/>
  <text x="40" y="56" font-size="13" fill="var(--da-muted, #64748b)">Geliştirici makinesi</text>
  <text x="800" y="56" text-anchor="middle" font-size="13" fill="var(--da-muted, #64748b)">GitHub / GitLab</text>

  <!-- Kutular -->
  <g stroke-width="1.5">
    <rect x="50" y="130" width="160" height="120" rx="12" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)"/>
    <rect x="260" y="130" width="160" height="120" rx="12" fill="var(--da-accent, #f59e0b)" opacity="0.15" stroke="var(--da-accent, #f59e0b)"/>
    <rect x="470" y="130" width="160" height="120" rx="12" fill="var(--da-primary, #6366f1)" opacity="0.12" stroke="var(--da-primary, #6366f1)"/>
    <rect x="720" y="130" width="160" height="120" rx="12" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)"/>
  </g>
  <g font-size="14" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="130" y="165">Çalışma dizini</text>
    <text x="340" y="165">Staging alanı</text>
    <text x="550" y="165">Yerel depo</text>
    <text x="800" y="165">Uzak depo</text>
  </g>
  <g font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="130" y="186">diskteki dosyalar</text>
    <text x="130" y="202">düzenlediğiniz hâl</text>
    <text x="340" y="186">index</text>
    <text x="340" y="202">sonraki commit'in taslağı</text>
    <text x="550" y="186">.git/objects</text>
    <text x="550" y="202">commit grafiği, dallar</text>
    <text x="800" y="186">origin</text>
    <text x="800" y="202">ekibin ortak kopyası</text>
  </g>
  <g font-size="10" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="130" y="232">git status · git diff</text>
    <text x="340" y="232">git diff --staged</text>
    <text x="550" y="232">git log · git branch</text>
    <text x="800" y="232">pull request · CI</text>
  </g>

  <!-- İleri oklar (üst) -->
  <g stroke="var(--da-primary, #6366f1)" stroke-width="2" fill="none" marker-end="url(#arrow-p)">
    <path d="M 210 150 L 258 150"/>
    <path d="M 420 150 L 468 150"/>
    <path d="M 630 150 L 718 150"/>
  </g>
  <g font-size="11" fill="var(--da-primary, #6366f1)" text-anchor="middle" font-weight="600">
    <text x="234" y="120">git add</text>
    <text x="444" y="120">git commit</text>
    <text x="674" y="120">git push</text>
  </g>

  <!-- Geri oklar (alt) -->
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.8" fill="none" marker-end="url(#arrow-m)" stroke-dasharray="5 4">
    <path d="M 718 235 L 632 235"/>
    <path d="M 468 235 L 212 235"/>
  </g>
  <g font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="674" y="262">git fetch</text>
    <text x="340" y="262">git checkout / git merge</text>
  </g>

  <!-- git pull: uzak → çalışma dizini -->
  <path d="M 800 250 C 800 330, 130 330, 130 252" stroke="var(--da-success, #10b981)" stroke-width="1.8" fill="none" marker-end="url(#arrow-p)"/>
  <text x="465" y="318" text-anchor="middle" font-size="11" fill="var(--da-success, #10b981)" font-weight="600">git pull = fetch + merge</text>

  <!-- Alt not -->
  <text x="460" y="388" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">git restore dosyayı geri alır, git restore --staged staging'den çıkarır; git add -p tek dosyanın bir kısmını staging'e taşır.</text>
</svg>
