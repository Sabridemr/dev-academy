<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Linux katmanlı mimarisi</title>
  <desc id="desc">Üstte kullanıcı alanı (shell, uygulamalar, servisler), ortada sistem çağrısı arayüzü, altta kernel bileşenleri ve en altta donanım. Sağda bir komutun katmanlardan geçiş örneği.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
  </defs>

  <!-- Kullanıcı alanı -->
  <rect x="30" y="30" width="560" height="130" rx="14" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="50" y="56" font-size="13" font-weight="600" fill="var(--da-muted, #64748b)">KULLANICI ALANI (user space)</text>
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5">
    <rect x="50" y="72" width="160" height="66" rx="10"/>
    <rect x="230" y="72" width="160" height="66" rx="10"/>
    <rect x="410" y="72" width="160" height="66" rx="10"/>
  </g>
  <g font-size="14" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="130" y="100">Shell</text>
    <text x="310" y="100">Uygulamalar</text>
    <text x="490" y="100">Servisler</text>
  </g>
  <g font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="130" y="120">bash, zsh</text>
    <text x="310" y="120">ls, grep, vim, python</text>
    <text x="490" y="120">nginx, sshd, cron</text>
  </g>

  <!-- Sistem çağrısı arayüzü -->
  <rect x="30" y="178" width="560" height="40" rx="10" fill="var(--da-primary, #6366f1)" opacity="0.12" stroke="var(--da-primary, #6366f1)" stroke-width="1.5"/>
  <text x="310" y="203" text-anchor="middle" font-size="13" font-weight="600" fill="var(--da-primary, #6366f1)">Sistem çağrısı arayüzü · open() read() write() fork() execve()</text>

  <!-- Kernel -->
  <rect x="30" y="236" width="560" height="130" rx="14" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="50" y="262" font-size="13" font-weight="600" fill="var(--da-muted, #64748b)">KERNEL (çekirdek)</text>
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5">
    <rect x="50" y="278" width="100" height="66" rx="10"/>
    <rect x="160" y="278" width="100" height="66" rx="10"/>
    <rect x="270" y="278" width="100" height="66" rx="10"/>
    <rect x="380" y="278" width="100" height="66" rx="10"/>
    <rect x="490" y="278" width="80" height="66" rx="10"/>
  </g>
  <g font-size="12" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="100" y="304">Zamanlayıcı</text>
    <text x="210" y="304">Bellek</text>
    <text x="320" y="304">VFS</text>
    <text x="430" y="304">Ağ yığını</text>
    <text x="530" y="304">Sürücüler</text>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="100" y="322">süreçler, CPU</text>
    <text x="210" y="322">sanal bellek</text>
    <text x="320" y="322">ext4, xfs, /proc</text>
    <text x="430" y="322">TCP/IP, soketler</text>
    <text x="530" y="322">disk, NIC</text>
  </g>

  <!-- Donanım -->
  <rect x="30" y="384" width="560" height="48" rx="12" fill="var(--da-accent, #f59e0b)" opacity="0.15" stroke="var(--da-accent, #f59e0b)"/>
  <text x="310" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">DONANIM · CPU · RAM · Disk · Ağ kartı</text>

  <!-- Sağ: bir komutun yolculuğu -->
  <text x="755" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="var(--da-muted, #64748b)">Örnek: ls /var/log</text>
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.5">
    <rect x="650" y="72" width="210" height="44" rx="10"/>
    <rect x="650" y="150" width="210" height="44" rx="10"/>
    <rect x="650" y="236" width="210" height="44" rx="10"/>
    <rect x="650" y="316" width="210" height="44" rx="10"/>
  </g>
  <g font-size="12" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="755" y="90">1. Shell komutu ayrıştırır</text>
    <text x="755" y="106" font-size="10" fill="var(--da-muted, #64748b)">/usr/bin/ls bulunur, fork + execve</text>
    <text x="755" y="168">2. ls → getdents() çağrısı</text>
    <text x="755" y="184" font-size="10" fill="var(--da-muted, #64748b)">kullanıcı alanından kernel'e geçiş</text>
    <text x="755" y="254">3. VFS → ext4 sürücüsü</text>
    <text x="755" y="270" font-size="10" fill="var(--da-muted, #64748b)">dizin girdileri diskten okunur</text>
    <text x="755" y="334">4. Sonuç stdout'a yazılır</text>
    <text x="755" y="350" font-size="10" fill="var(--da-muted, #64748b)">terminal çıktıyı gösterir</text>
  </g>
  <g stroke="var(--da-primary, #6366f1)" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M 755 116 L 755 148"/>
    <path d="M 755 194 L 755 234"/>
    <path d="M 755 280 L 755 314"/>
  </g>
  <path d="M 862 338 C 890 338, 890 94, 862 94" stroke="var(--da-success, #10b981)" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow-back)"/>
  <text x="884" y="222" font-size="10" fill="var(--da-success, #10b981)" text-anchor="middle" transform="rotate(90 884 222)">yanıt geri döner</text>

  <text x="310" y="450" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">Kullanıcı alanındaki hiçbir program donanıma doğrudan dokunmaz; her erişim sistem çağrısıyla kernel'den geçer.</text>
</svg>
