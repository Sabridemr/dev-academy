<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">VPS güvenlik katmanları</title>
  <desc id="desc">İnternetten gelen trafik önce UFW güvenlik duvarından geçer; yalnızca 22, 80 ve 443 portları açıktır, 5432 kapalıdır. Arkada sshd yalnızca anahtarla ve root olmadan giriş kabul eder, nginx web trafiğini karşılar, PostgreSQL yalnızca localhost'u dinler. Fail2ban auth.log'u okuyup tekrar eden başarısız girişleri güvenlik duvarında engeller; otomatik güncellemeler yamaları uygular.</desc>
  <defs>
    <marker id="h02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="h02-arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="h02-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>

  <!-- İnternet -->
  <rect x="20" y="150" width="130" height="110" rx="14" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="85" y="195" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">İnternet</text>
  <text x="85" y="216" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">kullanıcılar,</text>
  <text x="85" y="232" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">tarayıcı botlar</text>

  <!-- VPS çerçevesi -->
  <rect x="185" y="20" width="695" height="400" rx="16" fill="none" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="6 5"/>
  <text x="205" y="44" font-size="12" font-weight="600" fill="var(--da-muted, #64748b)">VPS (Ubuntu LTS) · unattended-upgrades güvenlik yamalarını uygular</text>

  <!-- UFW -->
  <rect x="210" y="70" width="140" height="330" rx="12" fill="var(--da-primary, #6366f1)" opacity="0.12" stroke="var(--da-primary, #6366f1)" stroke-width="1.5"/>
  <text x="280" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="var(--da-primary, #6366f1)">UFW</text>
  <text x="280" y="120" text-anchor="middle" font-size="11" fill="var(--da-fg, #0f172a)">deny incoming</text>
  <g font-size="12" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="280" y="168">ALLOW 22</text>
    <text x="280" y="248">ALLOW 80, 443</text>
    <text x="280" y="328" fill="var(--da-danger, #ef4444)">DENY 5432</text>
  </g>

  <!-- İnternet → UFW okları -->
  <line x1="150" y1="190" x2="206" y2="168" stroke="var(--da-primary, #6366f1)" stroke-width="2" marker-end="url(#h02-arrow)"/>
  <line x1="150" y1="210" x2="206" y2="244" stroke="var(--da-primary, #6366f1)" stroke-width="2" marker-end="url(#h02-arrow)"/>
  <line x1="150" y1="235" x2="206" y2="320" stroke="var(--da-danger, #ef4444)" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#h02-arrow-danger)"/>

  <!-- Servisler -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5">
    <rect x="420" y="130" width="210" height="72" rx="10"/>
    <rect x="420" y="212" width="210" height="72" rx="10"/>
  </g>
  <rect x="420" y="294" width="210" height="72" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-muted, #64748b)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-size="14" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="525" y="160">sshd :22</text>
    <text x="525" y="242">nginx :80 / :443</text>
    <text x="525" y="324">PostgreSQL :5432</text>
  </g>
  <g font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="525" y="182">yalnızca anahtar · root girişi kapalı</text>
    <text x="525" y="264">HTTPS, ters vekil</text>
    <text x="525" y="346">yalnızca localhost dinler</text>
  </g>
  <line x1="350" y1="166" x2="416" y2="166" stroke="var(--da-primary, #6366f1)" stroke-width="2" marker-end="url(#h02-arrow)"/>
  <line x1="350" y1="248" x2="416" y2="248" stroke="var(--da-primary, #6366f1)" stroke-width="2" marker-end="url(#h02-arrow)"/>
  <text x="385" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="var(--da-danger, #ef4444)">✕</text>

  <!-- auth.log ve Fail2ban -->
  <rect x="690" y="130" width="160" height="60" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="770" y="157" text-anchor="middle" font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)">auth.log</text>
  <text x="770" y="176" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">başarısız girişler</text>
  <rect x="690" y="240" width="160" height="70" rx="10" fill="var(--da-accent, #f59e0b)" opacity="0.14" stroke="var(--da-accent, #f59e0b)" stroke-width="1.5"/>
  <text x="770" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="var(--da-fg, #0f172a)">Fail2ban</text>
  <text x="770" y="288" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">5 hata → IP engeli</text>
  <line x1="630" y1="160" x2="686" y2="160" stroke="var(--da-accent, #f59e0b)" stroke-width="2" marker-end="url(#h02-arrow-accent)"/>
  <line x1="770" y1="190" x2="770" y2="236" stroke="var(--da-accent, #f59e0b)" stroke-width="2" marker-end="url(#h02-arrow-accent)"/>
  <path d="M 770 310 C 770 400, 420 405, 354 380" fill="none" stroke="var(--da-accent, #f59e0b)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#h02-arrow-accent)"/>
  <text x="600" y="405" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">engelleme kuralını güvenlik duvarına ekler</text>
</svg>
