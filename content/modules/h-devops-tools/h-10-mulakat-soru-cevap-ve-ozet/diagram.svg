<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">CI/CD akışının tek sayfalık haritası</title>
  <desc id="desc">Üst sırada pull request aşaması: tetikleyici, lint, test ve güvenlik taraması, branch protection ile merge. Orta sırada main sonrası: bir kez build ve SHA etiketli imaj, staging ve smoke test, onay, production ve dağıtım stratejisi. Alt sırada izleme, alarm ve geri alma döngüsü. En altta DORA metrikleri: dağıtım sıklığı ve değişiklik teslim süresi hızı, değişiklik hata oranı ve geri dönüş süresi kararlılığı ölçer.</desc>
  <defs>
    <marker id="h10-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="h10-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- Satır etiketleri -->
  <g font-size="11" font-weight="600" fill="var(--da-muted, #64748b)">
    <text x="20" y="28">1 · PULL REQUEST (CI)</text>
    <text x="20" y="148">2 · MAIN SONRASI (CD)</text>
    <text x="20" y="268">3 · CANLIDA</text>
  </g>

  <!-- Satır 1 -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3">
    <rect x="20" y="40" width="150" height="62" rx="10"/>
    <rect x="200" y="40" width="150" height="62" rx="10"/>
    <rect x="380" y="40" width="150" height="62" rx="10"/>
    <rect x="560" y="40" width="150" height="62" rx="10"/>
  </g>
  <rect x="740" y="40" width="140" height="62" rx="10" fill="var(--da-primary, #6366f1)" opacity="0.14" stroke="var(--da-primary, #6366f1)"/>
  <g font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="95" y="67">Tetikleyici</text>
    <text x="275" y="67">Lint</text>
    <text x="455" y="67">Test</text>
    <text x="635" y="67">Güvenlik</text>
    <text x="810" y="67">Merge</text>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="95" y="87">push · pull_request</text>
    <text x="275" y="87">en hızlı kontrol önce</text>
    <text x="455" y="87">unit · entegrasyon · kapsam</text>
    <text x="635" y="87">audit · CodeQL · secrets</text>
    <text x="810" y="87">branch protection</text>
  </g>
  <g stroke="var(--da-primary, #6366f1)" stroke-width="2" marker-end="url(#h10-arrow)">
    <line x1="170" y1="71" x2="196" y2="71"/>
    <line x1="350" y1="71" x2="376" y2="71"/>
    <line x1="530" y1="71" x2="556" y2="71"/>
    <line x1="710" y1="71" x2="736" y2="71"/>
  </g>
  <path d="M 810 102 C 810 130, 95 120, 95 156" fill="none" stroke="var(--da-primary, #6366f1)" stroke-width="2" marker-end="url(#h10-arrow)"/>

  <!-- Satır 2 -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3">
    <rect x="20" y="160" width="190" height="62" rx="10"/>
    <rect x="240" y="160" width="170" height="62" rx="10"/>
    <rect x="440" y="160" width="140" height="62" rx="10"/>
  </g>
  <rect x="610" y="160" width="270" height="62" rx="10" fill="var(--da-success, #10b981)" opacity="0.14" stroke="var(--da-success, #10b981)"/>
  <g font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="115" y="187">Build once</text>
    <text x="325" y="187">Staging</text>
    <text x="510" y="187">Onay</text>
    <text x="745" y="187">Production</text>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="115" y="207">imaj:sha-a91f → registry</text>
    <text x="325" y="207">migrate + smoke test</text>
    <text x="510" y="207">environment kuralı</text>
    <text x="745" y="207">rolling · blue-green · canary · flag</text>
  </g>
  <g stroke="var(--da-primary, #6366f1)" stroke-width="2" marker-end="url(#h10-arrow)">
    <line x1="210" y1="191" x2="236" y2="191"/>
    <line x1="410" y1="191" x2="436" y2="191"/>
    <line x1="580" y1="191" x2="606" y2="191"/>
  </g>
  <line x1="745" y1="222" x2="745" y2="276" stroke="var(--da-primary, #6366f1)" stroke-width="2" marker-end="url(#h10-arrow)"/>

  <!-- Satır 3 -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3">
    <rect x="610" y="280" width="270" height="62" rx="10"/>
    <rect x="330" y="280" width="240" height="62" rx="10"/>
  </g>
  <rect x="20" y="280" width="270" height="62" rx="10" fill="var(--da-danger, #ef4444)" opacity="0.1" stroke="var(--da-danger, #ef4444)"/>
  <g font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="745" y="307">İzleme</text>
    <text x="450" y="307">Alarm</text>
    <text x="155" y="307">Rollback</text>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="745" y="327">metrik · log · iz · /health</text>
    <text x="450" y="327">SLO, burn rate, nöbetçi</text>
    <text x="155" y="327">önceki SHA · revert · flag kapat</text>
  </g>
  <g stroke="var(--da-primary, #6366f1)" stroke-width="2" marker-end="url(#h10-arrow)">
    <line x1="610" y1="311" x2="574" y2="311"/>
    <line x1="330" y1="311" x2="294" y2="311"/>
  </g>

  <!-- DORA -->
  <rect x="20" y="370" width="860" height="86" rx="12" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="40" y="394" font-size="12" font-weight="700" fill="var(--da-fg, #0f172a)">DORA metrikleri</text>
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="40" y="420">Hız: dağıtım sıklığı · değişiklik teslim süresi</text>
    <text x="470" y="420">Kararlılık: değişiklik hata oranı · geri dönüş süresi</text>
  </g>
  <text x="40" y="442" font-size="11" fill="var(--da-muted, #64748b)">Küçük değişiklik + otomatik kapılar + hızlı geri alma, dört metriği birlikte iyileştirir.</text>
</svg>
