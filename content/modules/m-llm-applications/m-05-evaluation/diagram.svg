<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">LLM değerlendirme döngüsü</title>
  <desc id="desc">Solda altın veri seti. Ortada çevrim dışı değerlendirme kutusu: deterministik kontroller, referans karşılaştırması ve LLM yargıcı. Sağda CI kapısı; eşikler geçilirse kademeli dağıtım ve üretim. Üretimden gelen çevrimiçi sinyaller ve başarısız örnekler alttaki ok ile altın veri setine geri döner.</desc>
  <defs>
    <marker id="m05-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted)"/>
    </marker>
  </defs>

  <!-- Altın veri seti -->
  <rect x="30" y="110" width="150" height="120" rx="14" fill="var(--da-surface)" stroke="var(--da-accent)" stroke-width="2"/>
  <text x="105" y="145" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg)">Altın veri seti</text>
  <g font-size="12" fill="var(--da-muted)" text-anchor="middle">
    <text x="105" y="170">50–200 örnek</text>
    <text x="105" y="188">etiketli, sürümlü</text>
    <text x="105" y="206">zor vakalar dahil</text>
  </g>

  <!-- Çevrim dışı değerlendirme -->
  <rect x="230" y="40" width="300" height="260" rx="16" fill="var(--da-surface)" stroke="var(--da-border)"/>
  <text x="380" y="68" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg)">Çevrim dışı değerlendirme</text>
  <g font-size="13">
    <rect x="250" y="86" width="260" height="52" rx="10" fill="var(--da-success)" opacity="0.15" stroke="var(--da-success)"/>
    <text x="264" y="108" fill="var(--da-fg)">1. Deterministik kontroller</text>
    <text x="264" y="127" font-size="11" fill="var(--da-muted)">şema, kaynak kimliği, context recall</text>
    <rect x="250" y="150" width="260" height="52" rx="10" fill="var(--da-primary)" opacity="0.13" stroke="var(--da-primary)"/>
    <text x="264" y="172" fill="var(--da-fg)">2. Referans karşılaştırması</text>
    <text x="264" y="191" font-size="11" fill="var(--da-muted)">etiket, alan eşleşmesi</text>
    <rect x="250" y="214" width="260" height="52" rx="10" fill="var(--da-accent)" opacity="0.15" stroke="var(--da-accent)"/>
    <text x="264" y="236" fill="var(--da-fg)">3. LLM yargıcı (rubrik)</text>
    <text x="264" y="255" font-size="11" fill="var(--da-muted)">faithfulness, correctness — insanla kalibre</text>
  </g>
  <text x="380" y="290" text-anchor="middle" font-size="11" fill="var(--da-muted)">ucuzdan pahalıya ↓</text>

  <!-- CI kapısı -->
  <path d="M 640 110 L 700 170 L 640 230 L 580 170 Z" fill="var(--da-surface)" stroke="var(--da-fg)" stroke-width="1.5"/>
  <text x="640" y="166" text-anchor="middle" font-size="13" fill="var(--da-fg)">CI kapısı</text>
  <text x="640" y="184" text-anchor="middle" font-size="11" fill="var(--da-muted)">eşikler?</text>

  <!-- Üretim -->
  <rect x="740" y="120" width="130" height="100" rx="14" fill="var(--da-surface)" stroke="var(--da-success)" stroke-width="2"/>
  <text x="805" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-fg)">Kademeli</text>
  <text x="805" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-fg)">dağıtım</text>
  <text x="805" y="198" text-anchor="middle" font-size="11" fill="var(--da-muted)">A/B, %5 → %100</text>

  <g stroke="var(--da-muted)" stroke-width="2" fill="none" marker-end="url(#m05-arrow)">
    <path d="M 180 170 L 228 170"/>
    <path d="M 530 170 L 578 170"/>
    <path d="M 700 170 L 738 170"/>
  </g>
  <text x="718" y="160" text-anchor="middle" font-size="11" fill="var(--da-success)">geçti</text>
  <path d="M 640 230 L 640 270" stroke="var(--da-danger)" stroke-width="2" fill="none" marker-end="url(#m05-arrow)"/>
  <text x="650" y="262" font-size="11" fill="var(--da-danger)">kaldı → düzelt</text>

  <!-- Geri besleme -->
  <path d="M 805 220 L 805 360 L 105 360 L 105 232" fill="none" stroke="var(--da-accent)" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m05-arrow)"/>
  <rect x="300" y="340" width="330" height="40" rx="10" fill="var(--da-surface)" stroke="var(--da-accent)"/>
  <text x="465" y="357" text-anchor="middle" font-size="12" fill="var(--da-fg)">Çevrimiçi sinyaller: beğeni, düzenleme, insana aktarım</text>
  <text x="465" y="373" text-anchor="middle" font-size="12" fill="var(--da-accent)">her başarısız örnek → yeni test</text>
</svg>
