<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Offset ve cursor sayfalama karşılaştırması</title>
  <desc id="desc">Solda offset sayfalama: üçüncü sayfa için veritabanı ilk 40 satırı okuyup atar, sonraki 20 satırı döndürür; derin sayfalarda maliyet artar ve araya yeni kayıt girince satırlar kayar. Sağda cursor sayfalama: sorgu indeksle doğrudan son görülen id'nin sonrasına atlar ve 20 satır döndürür; her sayfanın maliyeti aynıdır, yeni kayıtlar sayfaları kaydırmaz, ama rastgele bir sayfaya atlanamaz.</desc>
  <defs>
    <marker id="i03-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
  </defs>

  <!-- Paneller -->
  <rect x="15" y="15" width="425" height="310" rx="14" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
  <rect x="460" y="15" width="425" height="310" rx="14" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>

  <g font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">
    <text x="35" y="44">Offset sayfalama</text>
    <text x="480" y="44">Cursor (imleç) sayfalama</text>
  </g>
  <g font-size="11.5" fill="var(--da-muted, #64748b)">
    <text x="35" y="66">GET /products?page=3&amp;limit=20</text>
    <text x="35" y="84">ORDER BY id LIMIT 20 OFFSET 40</text>
    <text x="480" y="66">GET /products?after=140&amp;limit=20</text>
    <text x="480" y="84">WHERE id &gt; 140 ORDER BY id LIMIT 20</text>
  </g>

  <!-- Offset şeridi: 6 atılan + 3 dönen + 1 okunmayan -->
  <g stroke="var(--da-border, #cbd5e1)">
    <rect x="35" y="130" width="36" height="36" rx="4" fill="var(--da-danger, #ef4444)" fill-opacity="0.2"/>
    <rect x="75" y="130" width="36" height="36" rx="4" fill="var(--da-danger, #ef4444)" fill-opacity="0.2"/>
    <rect x="115" y="130" width="36" height="36" rx="4" fill="var(--da-danger, #ef4444)" fill-opacity="0.2"/>
    <rect x="155" y="130" width="36" height="36" rx="4" fill="var(--da-danger, #ef4444)" fill-opacity="0.2"/>
    <rect x="195" y="130" width="36" height="36" rx="4" fill="var(--da-danger, #ef4444)" fill-opacity="0.2"/>
    <rect x="235" y="130" width="36" height="36" rx="4" fill="var(--da-danger, #ef4444)" fill-opacity="0.2"/>
    <rect x="275" y="130" width="36" height="36" rx="4" fill="var(--da-primary, #6366f1)" fill-opacity="0.35"/>
    <rect x="315" y="130" width="36" height="36" rx="4" fill="var(--da-primary, #6366f1)" fill-opacity="0.35"/>
    <rect x="355" y="130" width="36" height="36" rx="4" fill="var(--da-primary, #6366f1)" fill-opacity="0.35"/>
    <rect x="395" y="130" width="30" height="36" rx="4" fill="none"/>
  </g>
  <path d="M 35 176 L 35 182 L 271 182 L 271 176" fill="none" stroke="var(--da-danger, #ef4444)"/>
  <path d="M 275 176 L 275 182 L 391 182 L 391 176" fill="none" stroke="var(--da-primary, #6366f1)"/>
  <g font-size="11" text-anchor="middle">
    <text x="153" y="198" fill="var(--da-danger, #ef4444)">40 satır okunur, atılır</text>
    <text x="333" y="198" fill="var(--da-primary, #6366f1)">20 satır döner</text>
  </g>

  <!-- Cursor şeridi: 6 okunmayan + 3 dönen + 1 okunmayan -->
  <g stroke="var(--da-border, #cbd5e1)" fill="none">
    <rect x="480" y="130" width="36" height="36" rx="4"/>
    <rect x="520" y="130" width="36" height="36" rx="4"/>
    <rect x="560" y="130" width="36" height="36" rx="4"/>
    <rect x="600" y="130" width="36" height="36" rx="4"/>
    <rect x="640" y="130" width="36" height="36" rx="4"/>
    <rect x="680" y="130" width="36" height="36" rx="4"/>
    <rect x="720" y="130" width="36" height="36" rx="4" fill="var(--da-primary, #6366f1)" fill-opacity="0.35"/>
    <rect x="760" y="130" width="36" height="36" rx="4" fill="var(--da-primary, #6366f1)" fill-opacity="0.35"/>
    <rect x="800" y="130" width="36" height="36" rx="4" fill="var(--da-primary, #6366f1)" fill-opacity="0.35"/>
    <rect x="840" y="130" width="30" height="36" rx="4"/>
  </g>
  <path d="M 500 112 C 600 92, 680 92, 734 126" fill="none" stroke="var(--da-primary, #6366f1)" stroke-width="1.8" marker-end="url(#i03-arrow)"/>
  <text x="590" y="106" font-size="11" fill="var(--da-primary, #6366f1)">indeksle id 140'ın sonrasına atla</text>
  <path d="M 720 176 L 720 182 L 836 182 L 836 176" fill="none" stroke="var(--da-primary, #6366f1)"/>
  <g font-size="11" text-anchor="middle">
    <text x="580" y="198" fill="var(--da-muted, #64748b)">okunmaz</text>
    <text x="778" y="198" fill="var(--da-primary, #6366f1)">20 satır + nextCursor</text>
  </g>

  <!-- Artı / eksiler -->
  <g font-size="11.5" fill="var(--da-fg, #0f172a)">
    <text x="35" y="236">+ "7. sayfaya atla" ve toplam sayfa kolay</text>
    <text x="35" y="258">− derin sayfada maliyet büyür (OFFSET 100000)</text>
    <text x="35" y="280">− araya kayıt girince satırlar kayar:</text>
    <text x="47" y="298">aynı ürün iki kez görünür ya da biri atlanır</text>
    <text x="480" y="236">+ her sayfanın maliyeti aynı</text>
    <text x="480" y="258">+ yeni kayıtlar sayfaları kaydırmaz</text>
    <text x="480" y="280">− rastgele bir sayfaya atlanamaz;</text>
    <text x="492" y="298">yalnızca "sonraki" (ve "önceki") gezilir</text>
  </g>
</svg>
