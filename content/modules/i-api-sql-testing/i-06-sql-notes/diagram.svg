<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Örnek şema ve sorgu değerlendirme sırası</title>
  <desc id="desc">Solda users, products ve orders tabloları; orders tablosundaki customer_id ve product_id yabancı anahtarları users ve products tablolarının id sütununa ok ile bağlanır. Sağda bir SELECT sorgusunun mantıksal değerlendirme sırası yukarıdan aşağıya sıralanır: FROM ve JOIN, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT.</desc>
  <defs>
    <marker id="fk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- Sol panel: şema -->
  <rect x="20" y="20" width="520" height="420" rx="16" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="6 6"/>
  <text x="280" y="48" text-anchor="middle" font-size="13" fill="var(--da-muted, #64748b)">Ders şeması: üç tablo, iki yabancı anahtar</text>

  <!-- users -->
  <rect x="50" y="80" width="170" height="130" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <rect x="50" y="80" width="170" height="28" rx="10" fill="var(--da-primary, #6366f1)" opacity="0.15"/>
  <text x="135" y="99" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-primary, #6366f1)">users</text>
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="62" y="128">id  (PK)</text>
    <text x="62" y="148">name</text>
    <text x="62" y="168">city</text>
    <text x="62" y="188">created_at</text>
  </g>

  <!-- products -->
  <rect x="50" y="290" width="170" height="130" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <rect x="50" y="290" width="170" height="28" rx="10" fill="var(--da-primary, #6366f1)" opacity="0.15"/>
  <text x="135" y="309" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-primary, #6366f1)">products</text>
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="62" y="338">id  (PK)</text>
    <text x="62" y="358">name</text>
    <text x="62" y="378">category</text>
    <text x="62" y="398">price</text>
  </g>

  <!-- orders -->
  <rect x="330" y="150" width="190" height="190" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <rect x="330" y="150" width="190" height="28" rx="10" fill="var(--da-accent, #f59e0b)" opacity="0.18"/>
  <text x="425" y="169" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-fg, #0f172a)">orders</text>
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="342" y="198">id  (PK)</text>
    <text x="342" y="218">customer_id  (FK)</text>
    <text x="342" y="238">product_id  (FK)</text>
    <text x="342" y="258">status</text>
    <text x="342" y="278">total_amount</text>
    <text x="342" y="298">created_at</text>
  </g>
  <text x="425" y="328" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">indeks: (customer_id, status)</text>

  <!-- FK okları -->
  <g stroke="var(--da-primary, #6366f1)" stroke-width="1.8" fill="none" marker-end="url(#fk)">
    <path d="M 330 214 C 280 214, 260 124, 222 124"/>
    <path d="M 330 234 C 280 234, 260 334, 222 334"/>
  </g>
  <text x="262" y="160" text-anchor="middle" font-size="11" fill="var(--da-primary, #6366f1)">customer_id → users.id</text>
  <text x="262" y="300" text-anchor="middle" font-size="11" fill="var(--da-primary, #6366f1)">product_id → products.id</text>
  <text x="135" y="245" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">1 müşteri → n sipariş</text>

  <!-- Sağ panel: değerlendirme sırası -->
  <rect x="570" y="20" width="310" height="420" rx="16" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="6 6"/>
  <text x="725" y="48" text-anchor="middle" font-size="13" fill="var(--da-muted, #64748b)">Mantıksal değerlendirme sırası</text>

  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.3">
    <rect x="620" y="66" width="210" height="34" rx="8"/>
    <rect x="620" y="118" width="210" height="34" rx="8"/>
    <rect x="620" y="170" width="210" height="34" rx="8"/>
    <rect x="620" y="222" width="210" height="34" rx="8"/>
    <rect x="620" y="274" width="210" height="34" rx="8"/>
    <rect x="620" y="326" width="210" height="34" rx="8"/>
    <rect x="620" y="378" width="210" height="34" rx="8"/>
  </g>
  <g font-size="13" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="725" y="88">1 · FROM + JOIN</text>
    <text x="725" y="140">2 · WHERE</text>
    <text x="725" y="192">3 · GROUP BY</text>
    <text x="725" y="244">4 · HAVING</text>
    <text x="725" y="296">5 · SELECT</text>
    <text x="725" y="348">6 · ORDER BY</text>
    <text x="725" y="400">7 · LIMIT</text>
  </g>
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.5" fill="none" marker-end="url(#flow)">
    <path d="M 725 100 L 725 116"/>
    <path d="M 725 152 L 725 168"/>
    <path d="M 725 204 L 725 220"/>
    <path d="M 725 256 L 725 272"/>
    <path d="M 725 308 L 725 324"/>
    <path d="M 725 360 L 725 376"/>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)">
    <text x="842" y="140">satır süzer</text>
    <text x="842" y="244">grup süzer</text>
    <text x="842" y="296">takma ad</text>
  </g>
  <circle cx="600" cy="140" r="5" fill="var(--da-danger, #ef4444)"/>
  <circle cx="600" cy="244" r="5" fill="var(--da-success, #10b981)"/>
</svg>
