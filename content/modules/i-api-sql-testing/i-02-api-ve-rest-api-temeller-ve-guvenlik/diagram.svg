<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Bir API isteğinin geçtiği kontroller ve durum kodları</title>
  <desc id="desc">Soldan sağa altı kutu: tarayıcıdaki CORS kontrolü, kimlik doğrulama, kota, yetkilendirme, girdi doğrulama ve handler. Kimlik ve kota API gateway'de, yetki, doğrulama ve handler serviste çalışır. Her kutunun altında başarısız olunca dönen sonuç yazar: CORS için tarayıcının engellemesi, kimlik için 401, kota için 429, yetki için 403, doğrulama için 400 ya da 422, handler için 404 ya da 409; başarılı yolun sonunda 200, 201 ya da 204 vardır.</desc>
  <defs>
    <marker id="i02-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="i02-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
  </defs>

  <!-- Katman parantezleri -->
  <g font-size="12" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <path d="M 20 52 L 20 44 L 150 44 L 150 52" fill="none" stroke="var(--da-border, #cbd5e1)"/>
    <text x="85" y="36">tarayıcı</text>
    <path d="M 178 52 L 178 44 L 466 44 L 466 52" fill="none" stroke="var(--da-border, #cbd5e1)"/>
    <text x="322" y="36">API gateway</text>
    <path d="M 494 52 L 494 44 L 940 44 L 940 52" fill="none" stroke="var(--da-border, #cbd5e1)"/>
    <text x="717" y="36">servis (handler'ın bulunduğu yer)</text>
  </g>

  <!-- Kontrol kutuları -->
  <g stroke-width="1.5">
    <rect x="20" y="70" width="130" height="80" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-border, #cbd5e1)"/>
    <rect x="178" y="70" width="130" height="80" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-primary, #6366f1)"/>
    <rect x="336" y="70" width="130" height="80" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-primary, #6366f1)"/>
    <rect x="494" y="70" width="130" height="80" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-accent, #f97316)"/>
    <rect x="652" y="70" width="130" height="80" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-accent, #f97316)"/>
    <rect x="810" y="70" width="130" height="80" rx="10" fill="var(--da-surface, #f8fafc)" stroke="var(--da-success, #10b981)"/>
  </g>
  <g font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="85" y="104">CORS</text>
    <text x="243" y="104">Kimlik</text>
    <text x="401" y="104">Kota</text>
    <text x="559" y="104">Yetki</text>
    <text x="717" y="104">Doğrulama</text>
    <text x="875" y="104">Handler</text>
  </g>
  <g font-size="10.5" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="85" y="124">origin izinli mi?</text>
    <text x="243" y="124">token geçerli mi?</text>
    <text x="401" y="124">limit aşıldı mı?</text>
    <text x="559" y="124">rol yetiyor mu?</text>
    <text x="717" y="124">gövde kurala uygun mu?</text>
    <text x="875" y="124">kaynak var mı?</text>
  </g>

  <!-- Başarılı yol okları -->
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.5" marker-end="url(#i02-arrow)">
    <line x1="150" y1="110" x2="176" y2="110"/>
    <line x1="308" y1="110" x2="334" y2="110"/>
    <line x1="466" y1="110" x2="492" y2="110"/>
    <line x1="624" y1="110" x2="650" y2="110"/>
    <line x1="782" y1="110" x2="808" y2="110"/>
  </g>

  <!-- Ret okları -->
  <g stroke="var(--da-danger, #ef4444)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#i02-arrow-bad)">
    <line x1="85" y1="150" x2="85" y2="192"/>
    <line x1="243" y1="150" x2="243" y2="192"/>
    <line x1="401" y1="150" x2="401" y2="192"/>
    <line x1="559" y1="150" x2="559" y2="192"/>
    <line x1="717" y1="150" x2="717" y2="192"/>
    <line x1="850" y1="150" x2="850" y2="192"/>
  </g>
  <line x1="900" y1="150" x2="900" y2="192" stroke="var(--da-success, #10b981)" stroke-width="1.5"/>

  <!-- Sonuçlar -->
  <g fill="var(--da-surface, #f8fafc)" stroke="var(--da-danger, #ef4444)" stroke-width="1.2">
    <rect x="30" y="196" width="110" height="34" rx="17"/>
    <rect x="198" y="196" width="90" height="34" rx="17"/>
    <rect x="356" y="196" width="90" height="34" rx="17"/>
    <rect x="514" y="196" width="90" height="34" rx="17"/>
    <rect x="667" y="196" width="100" height="34" rx="17"/>
    <rect x="806" y="196" width="72" height="34" rx="17"/>
  </g>
  <rect x="884" y="196" width="66" height="34" rx="17" fill="var(--da-surface, #f8fafc)" stroke="var(--da-success, #10b981)" stroke-width="1.5"/>
  <g font-size="12" font-weight="600" text-anchor="middle" fill="var(--da-danger, #ef4444)">
    <text x="85" y="218">tarayıcı engeller</text>
    <text x="243" y="218">401</text>
    <text x="401" y="218">429</text>
    <text x="559" y="218">403</text>
    <text x="717" y="218">400 / 422</text>
    <text x="842" y="218">404 / 409</text>
  </g>
  <text x="917" y="218" font-size="12" font-weight="600" text-anchor="middle" fill="var(--da-success, #10b981)">2xx</text>

  <g font-size="10.5" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="243" y="248">Unauthorized</text>
    <text x="401" y="248">Retry-After</text>
    <text x="559" y="248">Forbidden</text>
    <text x="717" y="248">hatalı veri / iş kuralı</text>
    <text x="880" y="248">200 · 201 · 204</text>
  </g>

  <text x="480" y="294" font-size="12" text-anchor="middle" fill="var(--da-fg, #0f172a)">Ucuz kontroller önde: istek ne kadar erken reddedilirse arka uç o kadar az iş yapar.</text>
</svg>
