<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Pub/sub mimarisi: topic, partition, consumer group ve dead-letter queue</title>
  <desc id="desc">Solda iki üretici servis, ortada üç partition'a bölünmüş bir topic, sağda iki bağımsız consumer group (billing ve analytics). Billing grubunda iki tüketici partition'ları paylaşır; analytics grubunda tek tüketici hepsini okur. Altta retry topic ve dead-letter queue: başarısız mesajlar önce retry'a, sınır aşılınca DLQ'ya gider.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
  </defs>

  <!-- Üreticiler -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5">
    <rect x="30" y="110" width="140" height="56" rx="10"/>
    <rect x="30" y="200" width="140" height="56" rx="10"/>
  </g>
  <g font-size="13" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="100" y="134">Order Service</text>
    <text x="100" y="224">Cart Service</text>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="100" y="152">producer</text>
    <text x="100" y="242">producer</text>
  </g>
  <text x="100" y="90" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Üreticiler</text>

  <!-- Broker / topic -->
  <rect x="235" y="60" width="250" height="230" rx="14" fill="var(--da-primary, #6366f1)" opacity="0.08" stroke="var(--da-primary, #6366f1)" stroke-dasharray="6 5"/>
  <text x="360" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="var(--da-primary, #6366f1)">topic: orders</text>
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="1.5">
    <rect x="260" y="104" width="200" height="44" rx="8"/>
    <rect x="260" y="164" width="200" height="44" rx="8"/>
    <rect x="260" y="224" width="200" height="44" rx="8"/>
  </g>
  <!-- offset kutucukları -->
  <g fill="var(--da-primary, #6366f1)" opacity="0.35">
    <rect x="318" y="114" width="18" height="24" rx="3"/><rect x="340" y="114" width="18" height="24" rx="3"/><rect x="362" y="114" width="18" height="24" rx="3"/><rect x="384" y="114" width="18" height="24" rx="3"/>
    <rect x="318" y="174" width="18" height="24" rx="3"/><rect x="340" y="174" width="18" height="24" rx="3"/><rect x="362" y="174" width="18" height="24" rx="3"/>
    <rect x="318" y="234" width="18" height="24" rx="3"/><rect x="340" y="234" width="18" height="24" rx="3"/><rect x="362" y="234" width="18" height="24" rx="3"/><rect x="384" y="234" width="18" height="24" rx="3"/><rect x="406" y="234" width="18" height="24" rx="3"/>
  </g>
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="270" y="131">P0</text>
    <text x="270" y="191">P1</text>
    <text x="270" y="251">P2</text>
  </g>
  <g font-size="9" fill="var(--da-muted, #64748b)">
    <text x="318" y="110">0</text><text x="406" y="110">offset →</text>
  </g>
  <text x="360" y="282" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">partition = hash(orderId) mod 3 · retention 7 gün</text>

  <!-- Üretici → topic okları -->
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M 170 138 C 210 138, 220 126, 258 126"/>
    <path d="M 170 228 C 210 228, 220 186, 258 186"/>
    <path d="M 170 232 C 215 240, 225 246, 258 246"/>
  </g>
  <text x="205" y="118" font-size="10" fill="var(--da-muted, #64748b)">key=orderId</text>

  <!-- Consumer group: billing -->
  <rect x="560" y="60" width="180" height="140" rx="12" fill="var(--da-success, #10b981)" opacity="0.08" stroke="var(--da-success, #10b981)" stroke-dasharray="5 4"/>
  <text x="650" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-success, #10b981)">group: billing</text>
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4">
    <rect x="585" y="96" width="130" height="40" rx="8"/>
    <rect x="585" y="148" width="130" height="40" rx="8"/>
  </g>
  <g font-size="12" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="650" y="120">C1 ← P0, P1</text>
    <text x="650" y="172">C2 ← P2</text>
  </g>

  <!-- Consumer group: analytics -->
  <rect x="560" y="220" width="180" height="80" rx="12" fill="var(--da-accent, #f59e0b)" opacity="0.10" stroke="var(--da-accent, #f59e0b)" stroke-dasharray="5 4"/>
  <text x="650" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-accent, #f59e0b)">group: analytics</text>
  <rect x="585" y="254" width="130" height="36" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.4"/>
  <text x="650" y="277" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">A1 ← P0, P1, P2</text>

  <!-- Topic → tüketici okları -->
  <g stroke="var(--da-success, #10b981)" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M 460 126 C 520 126, 530 116, 583 116"/>
    <path d="M 460 186 C 520 186, 530 120, 583 120"/>
    <path d="M 460 246 C 520 246, 530 168, 583 168"/>
  </g>
  <g stroke="var(--da-accent, #f59e0b)" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)">
    <path d="M 460 136 C 520 150, 530 272, 583 272"/>
    <path d="M 460 196 C 520 200, 530 272, 583 274"/>
    <path d="M 460 256 C 520 262, 530 276, 583 276"/>
  </g>
  <text x="650" y="318" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">her grup kendi offset'ini tutar → aynı mesajı bağımsız okur</text>

  <!-- Downstream -->
  <rect x="790" y="96" width="140" height="92" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.4"/>
  <text x="860" y="124" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">Payment API</text>
  <text x="860" y="142" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">dış bağımlılık</text>
  <text x="860" y="172" text-anchor="middle" font-size="10" fill="var(--da-danger, #ef4444)">503 → retry</text>
  <path d="M 715 116 L 788 130" stroke="var(--da-muted, #64748b)" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 715 168 L 788 150" stroke="var(--da-muted, #64748b)" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

  <!-- Retry topic ve DLQ -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-danger, #ef4444)" stroke-width="1.4">
    <rect x="260" y="350" width="200" height="44" rx="8"/>
    <rect x="585" y="350" width="150" height="44" rx="8"/>
  </g>
  <text x="360" y="370" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">orders.retry</text>
  <text x="360" y="386" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">1 s → 2 s → 4 s (+jitter)</text>
  <text x="660" y="370" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">orders.DLQ</text>
  <text x="660" y="386" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">alarm + replay</text>

  <g stroke="var(--da-danger, #ef4444)" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-err)">
    <path d="M 640 190 C 640 260, 480 330, 462 365"/>
    <path d="M 460 372 L 583 372"/>
    <path d="M 300 350 C 300 320, 290 300, 290 270"/>
  </g>
  <g font-size="10" fill="var(--da-danger, #ef4444)">
    <text x="520" y="364" text-anchor="middle">N deneme sonrası</text>
    <text x="560" y="300">işlenemedi</text>
    <text x="238" y="312">yeniden oynat</text>
  </g>

  <text x="480" y="440" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Grup içinde: her partition tek tüketiciye (kuyruk). Gruplar arasında: herkes her mesajı alır (pub/sub).</text>
</svg>
