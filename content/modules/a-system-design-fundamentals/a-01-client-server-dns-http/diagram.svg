<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Bir URL'nin yolculuğu: DNS, TCP, TLS, HTTP ve WebSocket</title>
  <desc id="desc">Solda tarayıcı, sağda web sunucusu. Üstte DNS çözümleyici ve yetkili DNS sunucusu. Tarayıcı ile sunucu arasında dört sıralı katman: TCP el sıkışma (1 RTT), TLS el sıkışma (1 RTT), HTTP istek/yanıt (1 RTT) ve WebSocket yükseltmesi sonrası çift yönlü akış.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
  </defs>

  <!-- DNS katmanı -->
  <rect x="260" y="20" width="400" height="92" rx="14" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="6 6"/>
  <text x="460" y="42" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">1 · DNS çözümleme (UDP/53)</text>
  <rect x="290" y="54" width="150" height="44" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="365" y="73" text-anchor="middle" font-size="13" fill="var(--da-fg, #0f172a)">Recursive resolver</text>
  <text x="365" y="89" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">1.1.1.1 · cache + TTL</text>
  <rect x="480" y="54" width="150" height="44" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="555" y="73" text-anchor="middle" font-size="13" fill="var(--da-fg, #0f172a)">Yetkili DNS</text>
  <text x="555" y="89" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">root → .com → example.com</text>
  <path d="M 440 76 L 480 76" stroke="var(--da-muted, #64748b)" stroke-width="1.5" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>

  <!-- Tarayıcı -->
  <rect x="40" y="190" width="150" height="150" rx="14" fill="var(--da-primary, #6366f1)" opacity="0.12" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
  <text x="115" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-primary, #6366f1)">Tarayıcı</text>
  <text x="115" y="244" text-anchor="middle" font-size="11" fill="var(--da-fg, #0f172a)">shop.example.com</text>
  <text x="115" y="260" text-anchor="middle" font-size="11" fill="var(--da-fg, #0f172a)">/urun/42</text>
  <text x="115" y="290" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">DNS cache · TLS session</text>
  <text x="115" y="304" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">kök CA deposu</text>

  <!-- Sunucu -->
  <rect x="710" y="190" width="150" height="150" rx="14" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="785" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">Web sunucusu</text>
  <text x="785" y="244" text-anchor="middle" font-size="11" fill="var(--da-fg, #0f172a)">203.0.113.10:443</text>
  <text x="785" y="276" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">sertifika + özel anahtar</text>
  <text x="785" y="290" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">HTTP/2 · WebSocket</text>

  <!-- Tarayıcı → DNS oku -->
  <path d="M 150 190 C 180 130, 220 90, 290 80" stroke="var(--da-muted, #64748b)" stroke-width="1.5" fill="none" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <text x="200" y="118" font-size="10" fill="var(--da-muted, #64748b)">A kaydı? → 203.0.113.10</text>

  <!-- Katmanlar: TCP / TLS / HTTP / WS -->
  <g font-size="11" text-anchor="middle">
    <!-- TCP -->
    <path d="M 190 212 L 710 212" stroke="var(--da-muted, #64748b)" stroke-width="2" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>
    <rect x="370" y="198" width="160" height="26" rx="6" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
    <text x="450" y="215" fill="var(--da-fg, #0f172a)">2 · TCP: SYN / SYN-ACK / ACK</text>
    <text x="600" y="206" fill="var(--da-muted, #64748b)" font-size="10">1 RTT</text>

    <!-- TLS -->
    <path d="M 190 252 L 710 252" stroke="var(--da-accent, #f59e0b)" stroke-width="2" fill="none" stroke-dasharray="6 3" marker-end="url(#arr-a)" marker-start="url(#arr-a)"/>
    <rect x="360" y="238" width="180" height="26" rx="6" fill="var(--da-surface, #ffffff)" stroke="var(--da-accent, #f59e0b)"/>
    <text x="450" y="255" fill="var(--da-fg, #0f172a)">3 · TLS 1.3: Hello + sertifika</text>
    <text x="600" y="246" fill="var(--da-muted, #64748b)" font-size="10">1 RTT</text>

    <!-- HTTP -->
    <path d="M 190 292 L 710 292" stroke="var(--da-primary, #6366f1)" stroke-width="2" fill="none" marker-end="url(#arr-p)" marker-start="url(#arr-p)"/>
    <rect x="355" y="278" width="190" height="26" rx="6" fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)"/>
    <text x="450" y="295" fill="var(--da-fg, #0f172a)">4 · HTTP: GET /urun/42 → 200</text>
    <text x="600" y="286" fill="var(--da-muted, #64748b)" font-size="10">1 RTT · TTFB</text>

    <!-- WS -->
    <path d="M 190 328 L 710 328" stroke="var(--da-success, #10b981)" stroke-width="2.5" fill="none" marker-end="url(#arr-s)" marker-start="url(#arr-s)"/>
    <rect x="345" y="314" width="210" height="26" rx="6" fill="var(--da-surface, #ffffff)" stroke="var(--da-success, #10b981)"/>
    <text x="450" y="331" fill="var(--da-fg, #0f172a)">5 · Upgrade → 101 → WebSocket</text>
    <text x="600" y="322" fill="var(--da-muted, #64748b)" font-size="10">çift yönlü</text>
  </g>

  <!-- Alt: katman yığını -->
  <rect x="40" y="372" width="820" height="70" rx="12" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="60" y="394" font-size="11" font-weight="600" fill="var(--da-fg, #0f172a)">Katman yığını</text>
  <g font-size="11" text-anchor="middle" fill="var(--da-fg, #0f172a)">
    <rect x="60" y="404" width="150" height="26" rx="6" fill="var(--da-success, #10b981)" opacity="0.15" stroke="var(--da-success, #10b981)"/>
    <text x="135" y="421">HTTP / WebSocket</text>
    <rect x="230" y="404" width="150" height="26" rx="6" fill="var(--da-accent, #f59e0b)" opacity="0.15" stroke="var(--da-accent, #f59e0b)"/>
    <text x="305" y="421">TLS</text>
    <rect x="400" y="404" width="150" height="26" rx="6" fill="var(--da-primary, #6366f1)" opacity="0.15" stroke="var(--da-primary, #6366f1)"/>
    <text x="475" y="421">TCP (veya QUIC/UDP)</text>
    <rect x="570" y="404" width="130" height="26" rx="6" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
    <text x="635" y="421">IP</text>
    <rect x="720" y="404" width="120" height="26" rx="6" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
    <text x="780" y="421">Ethernet / Wi-Fi</text>
  </g>
  <text x="840" y="394" text-anchor="end" font-size="10" fill="var(--da-muted, #64748b)">İlk istek ≈ 3–4 RTT; HTTP/3 bunu 1–2 RTT'ye indirir</text>
</svg>
