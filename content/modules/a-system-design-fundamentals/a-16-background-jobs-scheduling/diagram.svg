<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Arka plan işinin yaşam döngüsü ve cron kilidi</title>
  <desc id="desc">Solda bir işin durum makinesi: kuyrukta, rezerve, başarılı; hata durumunda gecikmeli deneme kümesine gider ve süre dolunca kuyruğa döner; deneme sınırı aşılınca DLQ'ya taşınır ve oradan yeniden oynatılabilir; ACK gelmezse rezerve iş kuyruğa geri döner. Sağda üç API replikasında saat başı aynı anda tetiklenen cron işi Redis'e SET NX PX gönderir; yalnızca bir replika OK alıp işi çalıştırır, diğer ikisi null alıp çıkar.</desc>
  <defs>
    <marker id="bj-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="bj-arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="bj-arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
  </defs>

  <text x="250" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-fg, #0f172a)">Bir işin yaşam döngüsü</text>
  <text x="740" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-fg, #0f172a)">Cron × 3 replika = tek çalışma</text>
  <line x1="510" y1="44" x2="510" y2="440" stroke="var(--da-border, #cbd5e1)" stroke-dasharray="4 4"/>

  <!-- Durumlar -->
  <g stroke-width="1.5">
    <rect x="30" y="70" width="130" height="56" rx="12" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
    <rect x="200" y="70" width="130" height="56" rx="12" fill="var(--da-primary, #6366f1)" fill-opacity="0.12" stroke="var(--da-primary, #6366f1)"/>
    <rect x="370" y="70" width="120" height="56" rx="12" fill="var(--da-success, #10b981)" fill-opacity="0.14" stroke="var(--da-success, #10b981)"/>
    <rect x="200" y="230" width="130" height="56" rx="12" fill="var(--da-accent, #f59e0b)" fill-opacity="0.14" stroke="var(--da-accent, #f59e0b)"/>
    <rect x="200" y="370" width="130" height="56" rx="12" fill="var(--da-danger, #ef4444)" fill-opacity="0.12" stroke="var(--da-danger, #ef4444)"/>
  </g>
  <g font-size="13" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="95" y="96">Kuyrukta</text>
    <text x="265" y="96">Rezerve</text>
    <text x="430" y="96">Başarılı</text>
    <text x="265" y="256">Gecikmeli deneme</text>
    <text x="265" y="396">DLQ (ölü)</text>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="95" y="114">enqueued</text>
    <text x="265" y="114">in-flight, gizli</text>
    <text x="430" y="114">ACK → silinir</text>
    <text x="265" y="274">15 s → 30 s → 60 s + jitter</text>
    <text x="265" y="414">alarm + inceleme</text>
  </g>

  <!-- Geçişler -->
  <line x1="162" y1="98" x2="196" y2="98" stroke="var(--da-muted, #64748b)" stroke-width="1.5" marker-end="url(#bj-arrow)"/>
  <line x1="332" y1="98" x2="366" y2="98" stroke="var(--da-success, #10b981)" stroke-width="1.8" marker-end="url(#bj-arrow-ok)"/>
  <line x1="265" y1="128" x2="265" y2="226" stroke="var(--da-danger, #ef4444)" stroke-width="1.5" marker-end="url(#bj-arrow-bad)"/>
  <text x="273" y="180" font-size="10" fill="var(--da-danger, #ef4444)">hata (503, timeout)</text>
  <path d="M 198 258 C 120 258 95 200 95 130" fill="none" stroke="var(--da-muted, #64748b)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#bj-arrow)"/>
  <text x="40" y="215" font-size="10" fill="var(--da-muted, #64748b)">süre doldu</text>
  <line x1="265" y1="288" x2="265" y2="366" stroke="var(--da-danger, #ef4444)" stroke-width="1.5" marker-end="url(#bj-arrow-bad)"/>
  <text x="273" y="332" font-size="10" fill="var(--da-danger, #ef4444)">deneme sınırı aşıldı</text>
  <path d="M 198 398 C 40 398 30 250 60 130" fill="none" stroke="var(--da-primary, #6366f1)" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#bj-arrow)"/>
  <text x="40" y="380" font-size="10" fill="var(--da-primary, #6366f1)">replay</text>
  <path d="M 230 68 C 210 40 140 40 120 66" fill="none" stroke="var(--da-accent, #f59e0b)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#bj-arrow)"/>
  <text x="175" y="44" font-size="10" text-anchor="middle" fill="var(--da-accent, #f59e0b)">ACK yok → yeniden görünür</text>

  <!-- İdempotency notu -->
  <rect x="350" y="230" width="145" height="96" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
  <g font-size="10" fill="var(--da-fg, #0f172a)">
    <text x="360" y="250" font-weight="600">Her denemede:</text>
    <text x="360" y="268">1. anahtar tamam mı?</text>
    <text x="360" y="284">2. değilse işi yap</text>
    <text x="360" y="300">3. anahtarı yaz</text>
    <text x="360" y="316">4. ACK</text>
  </g>

  <!-- Sağ: cron + kilit -->
  <g stroke-width="1.5">
    <rect x="540" y="70" width="120" height="50" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
    <rect x="540" y="150" width="120" height="50" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
    <rect x="540" y="230" width="120" height="50" rx="10" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
    <rect x="790" y="140" width="140" height="70" rx="12" fill="var(--da-danger, #ef4444)" fill-opacity="0.08" stroke="var(--da-danger, #ef4444)"/>
  </g>
  <g font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="600" y="92">Replika 1</text>
    <text x="600" y="172">Replika 2</text>
    <text x="600" y="252">Replika 3</text>
    <text x="860" y="168">Redis</text>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="600" y="108">@Cron 14:00</text>
    <text x="600" y="188">@Cron 14:00</text>
    <text x="600" y="268">@Cron 14:00</text>
    <text x="860" y="186">lock:reminders:…T14</text>
    <text x="860" y="200">PX 55 dk</text>
  </g>
  <g stroke-width="1.5">
    <line x1="662" y1="95" x2="786" y2="160" stroke="var(--da-success, #10b981)" marker-end="url(#bj-arrow-ok)"/>
    <line x1="662" y1="175" x2="786" y2="175" stroke="var(--da-muted, #64748b)" marker-end="url(#bj-arrow)"/>
    <line x1="662" y1="255" x2="786" y2="190" stroke="var(--da-muted, #64748b)" marker-end="url(#bj-arrow)"/>
  </g>
  <g font-size="10" font-weight="600">
    <text x="690" y="112" fill="var(--da-success, #10b981)">SET NX → OK, çalıştır</text>
    <text x="690" y="170" fill="var(--da-muted, #64748b)">SET NX → null</text>
    <text x="690" y="246" fill="var(--da-muted, #64748b)">SET NX → null</text>
  </g>
  <rect x="540" y="310" width="390" height="116" rx="12" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
  <g font-size="11" fill="var(--da-fg, #0f172a)">
    <text x="556" y="334" font-weight="600">Bilinçli bedeller</text>
    <text x="556" y="356">• Kilit sahibi çökerse o saatin işi atlanır (en fazla bir kez)</text>
    <text x="556" y="376">• Saat damgalı anahtar: her saat ayrı kilit, PX ile kendiliğinden düşer</text>
    <text x="556" y="396">• GC duraklaması + süresi dolan kilit → fencing token gerekir</text>
    <text x="556" y="416">• Kilit optimizasyondur; asıl güvence idempotency</text>
  </g>
</svg>
