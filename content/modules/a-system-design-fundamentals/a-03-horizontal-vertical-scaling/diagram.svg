<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Dikey ve yatay ölçekleme karşılaştırması</title>
  <desc id="desc">Sol panel dikey ölçekleme: kullanıcılar doğrudan tek bir sunucuya bağlanır; küçük sunucu bir okla daha büyük sunucuya dönüşür, altında tek hata noktası ve donanım tavanı uyarısı. Sağ panel yatay ölçekleme: kullanıcılar bir load balancer'a bağlanır, load balancer dört eş sunucuya dağıtır; altında stateless ön koşulu ve N-1 dayanıklılık notu.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>

  <!-- SOL: Dikey -->
  <rect x="20" y="20" width="420" height="400" rx="14" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="230" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">Dikey ölçekleme (scale up)</text>
  <text x="230" y="66" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">aynı makine, daha fazla güç</text>

  <!-- kullanıcılar -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5">
    <rect x="40" y="170" width="90" height="44" rx="10"/>
  </g>
  <text x="85" y="196" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">Kullanıcılar</text>
  <path d="M 130 192 L 170 192" stroke="var(--da-muted, #64748b)" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <!-- küçük sunucu -->
  <rect x="172" y="162" width="70" height="60" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="207" y="186" text-anchor="middle" font-size="11" fill="var(--da-fg, #0f172a)">4 vCPU</text>
  <text x="207" y="202" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">16 GB</text>
  <!-- CPU çubuğu -->
  <rect x="180" y="210" width="54" height="6" rx="3" fill="var(--da-border, #cbd5e1)"/>
  <rect x="180" y="210" width="54" height="6" rx="3" fill="var(--da-danger, #ef4444)"/>
  <text x="207" y="236" text-anchor="middle" font-size="10" fill="var(--da-danger, #ef4444)">CPU %100</text>

  <!-- büyütme oku -->
  <path d="M 250 192 L 290 192" stroke="var(--da-accent, #f59e0b)" stroke-width="2.5" fill="none" marker-end="url(#arr-a)"/>
  <text x="270" y="180" text-anchor="middle" font-size="10" fill="var(--da-accent, #f59e0b)">büyüt</text>

  <!-- büyük sunucu -->
  <rect x="296" y="120" width="120" height="144" rx="10" fill="var(--da-primary, #6366f1)" opacity="0.1" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
  <text x="356" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="var(--da-primary, #6366f1)">32 vCPU</text>
  <text x="356" y="180" text-anchor="middle" font-size="11" fill="var(--da-fg, #0f172a)">256 GB RAM</text>
  <text x="356" y="196" text-anchor="middle" font-size="11" fill="var(--da-fg, #0f172a)">NVMe</text>
  <rect x="316" y="214" width="80" height="6" rx="3" fill="var(--da-border, #cbd5e1)"/>
  <rect x="316" y="214" width="36" height="6" rx="3" fill="var(--da-success, #10b981)"/>
  <text x="356" y="238" text-anchor="middle" font-size="10" fill="var(--da-success, #10b981)">CPU %45</text>

  <!-- alt notlar -->
  <g font-size="11" fill="var(--da-fg, #0f172a)">
    <text x="40" y="300">+ Kod değişmez, veri tek yerde, ACID kolay</text>
    <text x="40" y="320">+ Dakikalar içinde uygulanır</text>
    <text x="40" y="350" fill="var(--da-danger, #ef4444)">− Tek hata noktası (SPOF) sürer</text>
    <text x="40" y="370" fill="var(--da-danger, #ef4444)">− Donanım tavanı; fiyat üstel artar</text>
    <text x="40" y="390" fill="var(--da-danger, #ef4444)">− Yükseltmede genelde downtime</text>
  </g>

  <!-- SAĞ: Yatay -->
  <rect x="460" y="20" width="420" height="400" rx="14" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="670" y="48" text-anchor="middle" font-size="15" font-weight="600" fill="var(--da-fg, #0f172a)">Yatay ölçekleme (scale out)</text>
  <text x="670" y="66" text-anchor="middle" font-size="11" fill="var(--da-muted, #64748b)">daha fazla makine, araya dağıtıcı</text>

  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5">
    <rect x="480" y="170" width="90" height="44" rx="10"/>
  </g>
  <text x="525" y="196" text-anchor="middle" font-size="12" fill="var(--da-fg, #0f172a)">Kullanıcılar</text>
  <path d="M 570 192 L 606 192" stroke="var(--da-muted, #64748b)" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <!-- LB -->
  <rect x="608" y="162" width="92" height="60" rx="10" fill="var(--da-primary, #6366f1)" opacity="0.12" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
  <text x="654" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-primary, #6366f1)">Load</text>
  <text x="654" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-primary, #6366f1)">Balancer</text>

  <!-- LB → sunucular -->
  <g stroke="var(--da-primary, #6366f1)" stroke-width="1.8" fill="none" marker-end="url(#arr-p)">
    <path d="M 700 178 C 740 178, 740 104, 772 104"/>
    <path d="M 700 186 C 740 186, 740 162, 772 162"/>
    <path d="M 700 198 C 740 198, 740 220, 772 220"/>
    <path d="M 700 206 C 740 206, 740 278, 772 278"/>
  </g>

  <!-- 4 eş sunucu -->
  <g>
    <rect x="774" y="84" width="90" height="40" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
    <rect x="774" y="142" width="90" height="40" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
    <rect x="774" y="200" width="90" height="40" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
    <rect x="774" y="258" width="90" height="40" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  </g>
  <g font-size="11" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="819" y="101">S1 · 8 vCPU</text>
    <text x="819" y="159">S2 · 8 vCPU</text>
    <text x="819" y="217">S3 · 8 vCPU</text>
    <text x="819" y="275">S4 · 8 vCPU</text>
  </g>
  <!-- cpu çubukları -->
  <g>
    <rect x="784" y="110" width="70" height="5" rx="2.5" fill="var(--da-border, #cbd5e1)"/><rect x="784" y="110" width="22" height="5" rx="2.5" fill="var(--da-success, #10b981)"/>
    <rect x="784" y="168" width="70" height="5" rx="2.5" fill="var(--da-border, #cbd5e1)"/><rect x="784" y="168" width="22" height="5" rx="2.5" fill="var(--da-success, #10b981)"/>
    <rect x="784" y="226" width="70" height="5" rx="2.5" fill="var(--da-border, #cbd5e1)"/><rect x="784" y="226" width="22" height="5" rx="2.5" fill="var(--da-success, #10b981)"/>
    <rect x="784" y="284" width="70" height="5" rx="2.5" fill="var(--da-border, #cbd5e1)"/><rect x="784" y="284" width="22" height="5" rx="2.5" fill="var(--da-success, #10b981)"/>
  </g>
  <text x="819" y="316" text-anchor="middle" font-size="10" fill="var(--da-success, #10b981)">her biri CPU ≈ %30</text>

  <g font-size="11" fill="var(--da-fg, #0f172a)">
    <text x="480" y="300">+ Teorik tavan yok; sıradan donanım</text>
    <text x="480" y="320">+ N−1 dayanıklılık, sıfır-downtime dağıtım</text>
    <text x="480" y="340">+ Autoscaling ile talebe göre aç/kapa</text>
    <text x="480" y="370" fill="var(--da-danger, #ef4444)">− Stateless olmalı; oturum dışarı taşınır</text>
    <text x="480" y="390" fill="var(--da-danger, #ef4444)">− Paylaşımlı DB/cache; dağıtık karmaşıklık</text>
  </g>
</svg>
