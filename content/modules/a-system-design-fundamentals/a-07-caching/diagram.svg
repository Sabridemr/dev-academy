<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Katmanlı cache mimarisi</title>
  <desc id="desc">Soldan sağa beş katman: tarayıcı, CDN, API gateway, uygulama (in-process ve Redis) ve veritabanı. Her katmanın tipik gecikmesi ve isabet oranı gösterilir; miss olan istek bir sonraki katmana iner ve veritabanına ulaşan trafik her katmanda azalır.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="arrow-hit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="var(--da-fg, #0f172a)">Bir istek veritabanına varmadan beş kapıdan geçer</text>

  <!-- Trafik azalma şeridi -->
  <path d="M 60 70 L 900 70 L 900 92 L 60 150 Z" fill="var(--da-primary, #6366f1)" opacity="0.10"/>
  <text x="70" y="110" font-size="11" fill="var(--da-primary, #6366f1)">100% trafik</text>
  <text x="840" y="86" font-size="11" fill="var(--da-primary, #6366f1)" text-anchor="end">DB'ye ulaşan: ~1%</text>

  <!-- Katman kutuları -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)" stroke-width="1.5">
    <rect x="40" y="170" width="150" height="120" rx="12"/>
    <rect x="225" y="170" width="150" height="120" rx="12"/>
    <rect x="410" y="170" width="150" height="120" rx="12"/>
    <rect x="595" y="170" width="150" height="120" rx="12"/>
  </g>
  <rect x="780" y="170" width="150" height="120" rx="12" fill="var(--da-accent, #f59e0b)" opacity="0.14" stroke="var(--da-accent, #f59e0b)" stroke-width="1.5"/>

  <!-- Başlıklar -->
  <g font-size="14" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="115" y="196">Tarayıcı</text>
    <text x="300" y="196">CDN (edge)</text>
    <text x="485" y="196">API Gateway</text>
    <text x="670" y="196">Uygulama</text>
    <text x="855" y="196">Veritabanı</text>
  </g>
  <!-- Ne saklar -->
  <g font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="115" y="216">Cache-Control, ETag</text>
    <text x="115" y="232">statik dosyalar</text>
    <text x="300" y="216">görsel, JS/CSS, HTML</text>
    <text x="300" y="232">TTL + purge</text>
    <text x="485" y="216">GET yanıt gövdesi</text>
    <text x="485" y="232">kısa TTL</text>
    <text x="670" y="216">in-process LRU</text>
    <text x="670" y="232">+ Redis / Memcached</text>
    <text x="855" y="216">buffer pool</text>
    <text x="855" y="232">disk + indeks</text>
  </g>
  <!-- Gecikme -->
  <g font-size="12" font-weight="600" text-anchor="middle" fill="var(--da-primary, #6366f1)">
    <text x="115" y="262">~0 ms</text>
    <text x="300" y="262">10–30 ms</text>
    <text x="485" y="262">~1 ms</text>
    <text x="670" y="262">0.01–1 ms</text>
    <text x="855" y="262" fill="var(--da-accent, #f59e0b)">5–50 ms</text>
  </g>
  <!-- İsabet rozetleri -->
  <g font-size="11" text-anchor="middle">
    <rect x="75" y="272" width="80" height="16" rx="8" fill="var(--da-success, #10b981)" opacity="0.15"/>
    <text x="115" y="284" fill="var(--da-success, #10b981)">hit ≈ 40%</text>
    <rect x="260" y="272" width="80" height="16" rx="8" fill="var(--da-success, #10b981)" opacity="0.15"/>
    <text x="300" y="284" fill="var(--da-success, #10b981)">hit ≈ 80%</text>
    <rect x="445" y="272" width="80" height="16" rx="8" fill="var(--da-success, #10b981)" opacity="0.15"/>
    <text x="485" y="284" fill="var(--da-success, #10b981)">hit ≈ 50%</text>
    <rect x="630" y="272" width="80" height="16" rx="8" fill="var(--da-success, #10b981)" opacity="0.15"/>
    <text x="670" y="284" fill="var(--da-success, #10b981)">hit ≈ 90%</text>
  </g>

  <!-- Miss okları -->
  <g stroke="var(--da-muted, #64748b)" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M 190 230 L 223 230"/>
    <path d="M 375 230 L 408 230"/>
    <path d="M 560 230 L 593 230"/>
    <path d="M 745 230 L 778 230"/>
  </g>
  <g font-size="10" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="207" y="222">miss</text>
    <text x="392" y="222">miss</text>
    <text x="577" y="222">miss</text>
    <text x="762" y="222">miss</text>
  </g>

  <!-- Hit dönüş okları (yeşil, kesikli) -->
  <g stroke="var(--da-success, #10b981)" stroke-width="1.4" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow-hit)">
    <path d="M 300 290 C 300 330, 140 330, 120 294"/>
    <path d="M 485 290 C 485 345, 140 345, 118 296"/>
    <path d="M 670 290 C 670 360, 140 360, 116 298"/>
  </g>
  <text x="400" y="372" text-anchor="middle" font-size="11" fill="var(--da-success, #10b981)">hit → yanıt hemen geri döner, alt katmanlara inilmez</text>

  <!-- Alt not -->
  <text x="480" y="405" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">DB'ye ulaşan trafik ≈ 100% × (1−0.4) × (1−0.8) × (1−0.5) × (1−0.9) ≈ 0.6%. Her katmanın isabeti bir alt katmanı korur.</text>
</svg>
