<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">CDN mimarisi: PoP'lar, origin shield, origin ve edge fonksiyonu</title>
  <desc id="desc">Solda üç bölgeden kullanıcılar (İstanbul, Berlin, São Paulo). Her biri yakın bir PoP'a bağlanır; İstanbul PoP'unda cache HIT yeşil, São Paulo PoP'unda cache MISS kırmızı okla origin shield'e, oradan origin'e gider. Berlin PoP'unda bir edge fonksiyonu çalışır. Altta Cache-Control başlıkları ve hit/miss akışını özetleyen şerit.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
    <marker id="arr-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-success, #10b981)"/>
    </marker>
    <marker id="arr-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-danger, #ef4444)"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-accent, #f59e0b)"/>
    </marker>
  </defs>

  <!-- Bölge etiketleri -->
  <text x="90" y="34" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Kullanıcılar</text>
  <text x="330" y="34" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Edge: PoP'lar (300+ şehir, anycast)</text>
  <text x="590" y="34" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Origin shield</text>
  <text x="800" y="34" text-anchor="middle" font-size="12" fill="var(--da-muted, #64748b)">Origin (tek bölge)</text>

  <!-- Kullanıcılar -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5">
    <rect x="30" y="60" width="120" height="48" rx="10"/>
    <rect x="30" y="160" width="120" height="48" rx="10"/>
    <rect x="30" y="260" width="120" height="48" rx="10"/>
  </g>
  <g font-size="12" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="90" y="80">İstanbul</text>
    <text x="90" y="180">Berlin</text>
    <text x="90" y="280">São Paulo</text>
  </g>
  <g font-size="9" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="90" y="96">RTT PoP: 8 ms</text>
    <text x="90" y="196">RTT PoP: 6 ms</text>
    <text x="90" y="296">RTT PoP: 15 ms</text>
  </g>

  <!-- PoP'lar -->
  <g>
    <rect x="240" y="52" width="180" height="64" rx="12" fill="var(--da-primary, #6366f1)" opacity="0.1" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
    <rect x="240" y="152" width="180" height="64" rx="12" fill="var(--da-primary, #6366f1)" opacity="0.1" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
    <rect x="240" y="252" width="180" height="64" rx="12" fill="var(--da-primary, #6366f1)" opacity="0.1" stroke="var(--da-primary, #6366f1)" stroke-width="2"/>
  </g>
  <g font-size="12" font-weight="600" fill="var(--da-primary, #6366f1)" text-anchor="middle">
    <text x="330" y="74">PoP İstanbul</text>
    <text x="330" y="174">PoP Frankfurt</text>
    <text x="330" y="274">PoP São Paulo</text>
  </g>
  <g font-size="10" text-anchor="middle">
    <text x="330" y="92" fill="var(--da-success, #10b981)">cache: hero.webp · HIT · Age 42</text>
    <text x="330" y="106" fill="var(--da-muted, #64748b)">TCP/TLS burada sonlanır</text>
    <text x="330" y="192" fill="var(--da-accent, #f59e0b)">edge fn: resize(?w=400) · A/B · JWT</text>
    <text x="330" y="206" fill="var(--da-muted, #64748b)">V8 isolate · ~5 ms cold start</text>
    <text x="330" y="292" fill="var(--da-danger, #ef4444)">cache: boş · MISS</text>
    <text x="330" y="306" fill="var(--da-muted, #64748b)">→ shield'e sor, origin'e değil</text>
  </g>

  <!-- Kullanıcı → PoP okları -->
  <g stroke-width="1.8" fill="none">
    <path d="M 150 84 L 238 84" stroke="var(--da-success, #10b981)" marker-end="url(#arr-s)"/>
    <path d="M 150 184 L 238 184" stroke="var(--da-accent, #f59e0b)" marker-end="url(#arr-a)"/>
    <path d="M 150 284 L 238 284" stroke="var(--da-danger, #ef4444)" marker-end="url(#arr-d)"/>
  </g>
  <text x="194" y="76" text-anchor="middle" font-size="9" fill="var(--da-success, #10b981)">8 ms</text>
  <text x="194" y="176" text-anchor="middle" font-size="9" fill="var(--da-accent, #f59e0b)">origin'siz</text>
  <text x="194" y="276" text-anchor="middle" font-size="9" fill="var(--da-danger, #ef4444)">miss</text>

  <!-- Shield -->
  <rect x="520" y="140" width="140" height="80" rx="12" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="590" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Origin Shield</text>
  <text x="590" y="184" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">tiered cache</text>
  <text x="590" y="200" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">request coalescing</text>

  <!-- PoP miss → shield -->
  <path d="M 420 284 C 470 284, 480 200, 518 192" stroke="var(--da-danger, #ef4444)" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-d)"/>
  <path d="M 420 100 C 470 100, 480 160, 518 168" stroke="var(--da-border, #cbd5e1)" stroke-width="1.4" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)"/>
  <text x="470" y="236" text-anchor="middle" font-size="9" fill="var(--da-danger, #ef4444)">1 miss</text>
  <text x="470" y="124" text-anchor="middle" font-size="9" fill="var(--da-muted, #64748b)">yalnızca miss'te</text>

  <!-- Origin -->
  <rect x="730" y="140" width="140" height="80" rx="12" fill="var(--da-surface, #ffffff)" stroke="var(--da-fg, #0f172a)" stroke-width="1.5"/>
  <text x="800" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="var(--da-fg, #0f172a)">Origin</text>
  <text x="800" y="184" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">Virginia · RTT 150 ms</text>
  <text x="800" y="200" text-anchor="middle" font-size="10" fill="var(--da-muted, #64748b)">trafiğin %5'ini görür</text>
  <path d="M 660 180 L 728 180" stroke="var(--da-danger, #ef4444)" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arr-d)"/>
  <text x="694" y="172" text-anchor="middle" font-size="9" fill="var(--da-danger, #ef4444)">1 istek</text>
  <!-- purge -->
  <path d="M 740 140 C 720 90, 600 80, 420 70" stroke="var(--da-accent, #f59e0b)" stroke-width="1.3" fill="none" stroke-dasharray="2 3" marker-end="url(#arr-a)"/>
  <text x="600" y="78" text-anchor="middle" font-size="9" fill="var(--da-accent, #f59e0b)">PURGE tag:hero (saniyeler)</text>

  <!-- Alt şerit: başlıklar -->
  <rect x="30" y="340" width="840" height="104" rx="12" fill="var(--da-surface, #ffffff)" stroke="var(--da-border, #cbd5e1)"/>
  <text x="46" y="362" font-size="11" font-weight="600" fill="var(--da-fg, #0f172a)">Cache-Control: origin, CDN'e ne saklayacağını söyler</text>
  <g font-size="10">
    <text x="46" y="384" fill="var(--da-success, #10b981)">app.3f9a2c.js</text>
    <text x="150" y="384" fill="var(--da-fg, #0f172a)">public, max-age=31536000, immutable</text>
    <text x="400" y="384" fill="var(--da-muted, #64748b)">→ sürümlü URL, purge gerekmez</text>

    <text x="46" y="404" fill="var(--da-primary, #6366f1)">/api/products</text>
    <text x="150" y="404" fill="var(--da-fg, #0f172a)">public, max-age=30, s-maxage=600, stale-while-revalidate=300</text>
    <text x="520" y="404" fill="var(--da-muted, #64748b)">→ tarayıcı 30 s, CDN 10 dk, eskiyi ver + arkada yenile</text>

    <text x="46" y="424" fill="var(--da-danger, #ef4444)">/account</text>
    <text x="150" y="424" fill="var(--da-fg, #0f172a)">private, no-store</text>
    <text x="400" y="424" fill="var(--da-muted, #64748b)">→ kişisel yanıt CDN'de asla kalmaz (sızıntı riski)</text>
  </g>
  <text x="854" y="362" text-anchor="end" font-size="10" fill="var(--da-muted, #64748b)">cache key = host + path + query (+ Vary)</text>
</svg>
