<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc" font-family="inherit">
  <title id="title">Uzay-zaman diyagramı: Lamport ve vektör saatler</title>
  <desc id="desc">A, B ve C süreçleri yatay çizgiler olarak çizilmiştir. A'dan B'ye m1, B'den C'ye m2, C'den A'ya m3 mesajı gider. Her olayın üstünde Lamport değeri, altında vektör saati yazar. a1 ve c1 arasında mesaj zinciri yoktur, eşzamanlıdır.</desc>
  <defs>
    <marker id="q01-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-primary, #6366f1)"/>
    </marker>
    <marker id="q01-time" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--da-muted, #64748b)"/>
    </marker>
  </defs>

  <!-- Süreç çizgileri -->
  <g stroke="var(--da-fg, #0f172a)" stroke-width="2" marker-end="url(#q01-time)">
    <line x1="110" y1="90" x2="860" y2="90"/>
    <line x1="110" y1="190" x2="860" y2="190"/>
    <line x1="110" y1="290" x2="860" y2="290"/>
  </g>
  <g font-size="16" font-weight="600" fill="var(--da-fg, #0f172a)" text-anchor="end">
    <text x="96" y="95">A</text>
    <text x="96" y="195">B</text>
    <text x="96" y="295">C</text>
  </g>
  <text x="860" y="350" font-size="12" text-anchor="end" fill="var(--da-muted, #64748b)">her süreç kendi yerel sırası →</text>

  <!-- Mesajlar -->
  <g stroke="var(--da-primary, #6366f1)" stroke-width="2" fill="none" marker-end="url(#q01-arrow)">
    <line x1="290" y1="90" x2="374" y2="184"/>
    <line x1="470" y1="190" x2="554" y2="284"/>
    <line x1="650" y1="290" x2="754" y2="96"/>
  </g>
  <g font-size="12" fill="var(--da-primary, #6366f1)" font-weight="600">
    <text x="340" y="128">m1</text>
    <text x="520" y="228">m2</text>
    <text x="712" y="200">m3</text>
  </g>

  <!-- Olaylar -->
  <g fill="var(--da-surface, #ffffff)" stroke="var(--da-primary, #6366f1)" stroke-width="2.5">
    <circle cx="290" cy="90" r="7"/>
    <circle cx="760" cy="90" r="7"/>
    <circle cx="380" cy="190" r="7"/>
    <circle cx="470" cy="190" r="7"/>
    <circle cx="560" cy="290" r="7"/>
    <circle cx="650" cy="290" r="7"/>
  </g>
  <g fill="var(--da-accent, #f59e0b)" stroke="var(--da-accent, #f59e0b)" stroke-width="2.5">
    <circle cx="200" cy="90" r="7"/>
    <circle cx="230" cy="290" r="7"/>
  </g>

  <!-- Lamport değerleri (üstte) -->
  <g font-size="12" fill="var(--da-fg, #0f172a)" text-anchor="middle">
    <text x="200" y="72">a1 · L=1</text>
    <text x="290" y="72">L=2</text>
    <text x="760" y="72">L=7</text>
    <text x="380" y="172">L=3</text>
    <text x="470" y="172">L=4</text>
    <text x="230" y="272">c1 · L=1</text>
    <text x="560" y="272">L=5</text>
    <text x="650" y="272">L=6</text>
  </g>
  <!-- Vektör saatler (altta) -->
  <g font-size="11" fill="var(--da-muted, #64748b)" text-anchor="middle">
    <text x="200" y="112">[1,0,0]</text>
    <text x="290" y="112">[2,0,0]</text>
    <text x="760" y="112">[3,2,3]</text>
    <text x="380" y="212">[2,1,0]</text>
    <text x="470" y="212">[2,2,0]</text>
    <text x="230" y="312">[0,0,1]</text>
    <text x="560" y="312">[2,2,2]</text>
    <text x="650" y="312">[2,2,3]</text>
  </g>

  <!-- Eşzamanlılık işareti -->
  <path d="M 200 120 C 170 190, 200 240, 228 280" fill="none" stroke="var(--da-accent, #f59e0b)" stroke-width="1.8" stroke-dasharray="5 5"/>
  <rect x="120" y="176" width="90" height="28" rx="8" fill="var(--da-surface, #ffffff)" stroke="var(--da-accent, #f59e0b)"/>
  <text x="165" y="195" font-size="12" text-anchor="middle" fill="var(--da-accent, #f59e0b)" font-weight="600">eşzamanlı</text>

  <!-- Açıklama -->
  <g font-size="12" fill="var(--da-fg, #0f172a)">
    <text x="110" y="345">Üst: Lamport değeri · Alt: vektör saat [A,B,C]</text>
  </g>
</svg>
