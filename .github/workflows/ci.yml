name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN yalnızca okuma; hiçbir iş depoya yazmaz
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # Turborepo yerel önbelleği; işler arasında actions/cache ile taşınır
  TURBO_CACHE_DIR: .turbo/cache

jobs:
  # Biçim + lint: tüm paketler, hızlı geri bildirim
  lint:
    name: Lint ve biçim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-lint-${{ github.sha }}
          restore-keys: turbo-lint-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint

  # İçerik + ortak paket
  shared-and-content:
    name: Ortak paket ve içerik doğrulama
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-shared-${{ github.sha }}
          restore-keys: turbo-shared-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build typecheck test --filter=@devacademy/shared
      - name: İçerik doğrulama (uyarılar da hata)
        run: pnpm content:validate --strict
      - name: Kod izi üreticisi (Python) testleri
        run: python3 -m unittest discover -s packages/shared/scripts/python-trace
      - name: Kodlama alıştırmaları (çözümler python3 ile testlerden geçer)
        run: pnpm content:exercises

  backend:
    name: Backend (birim + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: shared-and-content
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devacademy
          POSTGRES_PASSWORD: devacademy
          POSTGRES_DB: devacademy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devacademy" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://devacademy:devacademy@localhost:5432/devacademy_test?schema=public
      REDIS_URL: redis://localhost:6379/1
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-0123456
      SEED_STRICT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-backend-${{ github.sha }}
          restore-keys: turbo-backend-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @devacademy/backend exec prisma generate
      - run: pnpm turbo run typecheck test build --filter=@devacademy/backend
      - name: Şema ile migration'lar arasında fark yok (eksik migration)
        env:
          SHADOW_DATABASE_URL: postgresql://devacademy:devacademy@localhost:5432/devacademy_shadow?schema=public
        run: |
          echo 'CREATE DATABASE devacademy_shadow;' | pnpm --filter @devacademy/backend exec prisma db execute --stdin --url "$DATABASE_URL"
          pnpm --filter @devacademy/backend exec prisma migrate diff --exit-code \
            --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL"
      - run: pnpm --filter @devacademy/backend exec prisma migrate deploy
      - run: pnpm --filter @devacademy/backend prisma:seed
      - run: pnpm --filter @devacademy/backend test:e2e

  web:
    name: Web (typecheck, birim, build, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: shared-and-content
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devacademy
          POSTGRES_PASSWORD: devacademy
          POSTGRES_DB: devacademy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devacademy" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://devacademy:devacademy@localhost:5432/devacademy?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-0123456
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-web-${{ github.sha }}
          restore-keys: turbo-web-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @devacademy/backend exec prisma generate
      - run: pnpm turbo run typecheck test build --filter=@devacademy/web --filter=@devacademy/backend
      - name: API'yi hazırla ve başlat
        run: |
          pnpm --filter @devacademy/backend exec prisma migrate deploy
          pnpm --filter @devacademy/backend prisma:seed
          (cd backend && PORT=4000 node dist/main.js > ../api.log 2>&1 &)
          npx wait-on -t 60000 http://localhost:4000/health
      - run: pnpm --filter @devacademy/web exec playwright install --with-deps chromium
      - name: Web sunucusunu başlat ve Playwright çalıştır
        run: |
          (cd web && pnpm start > ../web.log 2>&1 &)
          npx wait-on -t 60000 http://localhost:3000
          pnpm --filter @devacademy/web exec playwright test --project=chromium --project=mobile
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            api.log
            web.log

  mobile:
    name: Mobil (typecheck, Jest, Metro paketleme)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: shared-and-content
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-mobile-${{ github.sha }}
          restore-keys: turbo-mobile-
      - run: pnpm install --frozen-lockfile
      # build = expo export (iOS + Android): native modül/çözümleme hatalarını Metro düzeyinde yakalar
      - run: pnpm turbo run typecheck test build --filter=@devacademy/mobile
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid/api/v1

  docker:
    name: Docker imajları
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR'larda da derlenir (push: false): taban imaj yükseltmeleri (ör. Dependabot) birleşmeden yakalanır
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: devacademy-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: tools
          push: false
          tags: devacademy-tools:${{ github.sha }}
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: devacademy-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
